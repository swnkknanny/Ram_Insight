<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSight หม้อแปลง</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--navy:#0b2160;--navy2:#1c3a7a;--blue:#1677f2;--bg:#f3f6fb;--card:#fff;--line:#e1e8f3;--line2:#edf1f8;--text:#14213d;--soft:#5d6b86;--faint:#8a96ad;
--R:#2563eb;--Rbg:#eaf1ff;--A:#2e8b57;--Atx:#23704a;--Abg:#e8f6ee;--Abd:#bfe3cd;--M:#e07a1f;--Mtx:#b85f10;--Mbg:#fff2e5;--Mbd:#f6d3b0;--bad:#c2413b;--badbg:#fdecea}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.6 'IBM Plex Sans Thai Looped','IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.app{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column;gap:7px;position:sticky;top:0;height:100vh;overflow-y:auto;width:258px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:var(--navy);margin:2px 4px 10px}.logo img{height:36px;width:auto}
.logo span{color:var(--blue)}
.sec{font-size:12.5px;color:var(--faint);margin:12px 6px 0}
.stn{border:1px solid var(--line);background:#f9fbfe;border-radius:12px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}.stn .ic{width:19px;height:19px;color:var(--navy)}.stn.on .ic{color:#fff}
.stn .t{display:block;font-weight:700;line-height:1.35}.stn .s{display:block;font-size:12px;color:var(--soft)}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}.stn.on .s{color:#c9d4f2}
.nav{border:0;background:transparent;border-radius:10px;padding:11px 12px;color:var(--soft);text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.nav:hover{background:#f1f5fd}.nav.on{background:#e8eefb;box-shadow:inset 3px 0 0 var(--blue);font-weight:700;color:var(--navy)}.nav.on .ic{color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.side .btn{width:100%;justify-content:flex-start}.btn:hover{background:#f6f8fd}.btn.sm{padding:7px 14px;font-size:14px;font-weight:500}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.green{background:var(--A);border-color:var(--A);color:#fff;position:relative}.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--M);border:2px solid #fff}
.pill{background:var(--Abg);color:var(--Atx);border-radius:12px;padding:10px 12px 10px 28px;font-size:13px;line-height:1.5;position:relative;margin-top:4px}.pill:before{content:'';position:absolute;left:12px;top:17px;width:8px;height:8px;border-radius:50%;background:var(--A)}.pill.empty:before{background:#8a96ad}
.pill.empty{background:#eef2f8;color:var(--soft)}.side .btn.off{color:var(--faint);background:#fbfcfe}
.foot{margin-top:auto;padding-top:8px}
.main{min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}.who{background:#e8eefb;color:var(--navy);border-radius:99px;padding:5px 14px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center}.who .ic{width:15px;height:15px}.btn.green.idle{background:#9fd3b6;border-color:#9fd3b6}.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}.btn.navy:hover{background:var(--navy2)}
.menu-btn{display:none}
.content{padding:24px 28px 60px;max-width:1560px}
h1{margin:0 0 16px;font-size:28px;font-weight:700;color:var(--navy);display:flex;gap:12px;align-items:center}h1 .ic{width:28px;height:28px}
h2{margin:0;font-size:17.5px;font-weight:700;color:var(--navy)}.hd2{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.hd2 .info{margin-left:2px}.psub{color:var(--soft);font-size:13.5px;margin:3px 0 0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px}.seg button.on{background:var(--navy);color:#fff}
.sel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 10px 7px 14px;display:inline-flex;align-items:center;gap:6px;color:var(--soft)}
.sel select{border:0;background:transparent;font-weight:600;color:var(--text);padding:3px;max-width:100%;outline:none}
.g{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:0 2px 10px -6px rgba(11,33,96,.12);position:relative;min-width:0}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{border-color:#b9c9ee;box-shadow:0 10px 26px -14px rgba(11,33,96,.28)}
.sub{color:var(--soft);font-size:13px}.n{color:var(--faint);font-size:12.5px}
.info{border:1.5px solid #9aa6bd;background:#fff;color:#7d8aa5;width:20px;height:20px;border-radius:50%;font-size:12px;font-style:italic;font-family:Georgia,serif;font-weight:600;line-height:1;display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-left:4px;cursor:pointer}.info:hover{border-color:var(--blue);color:var(--blue)}
.card>.info.tr{position:absolute;top:16px;right:16px;width:22px;height:22px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}
.lb{color:var(--soft);font-size:13.5px}.v{font-size:34px;font-weight:700;color:var(--navy);line-height:1.2}.v small{font-size:15px;color:var(--soft);font-weight:600}
.ram{border-radius:16px;padding:16px 18px;text-align:left;border:1px solid transparent;width:100%}
.ram.R{background:var(--Rbg);color:var(--R);border-color:#d3e0fb}.ram.A{background:var(--Abg);color:var(--Atx);border-color:var(--Abd)}.ram.M{background:var(--Mbg);color:var(--Mtx);border-color:var(--Mbd)}.ram .nm{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--text);margin-bottom:4px}.ram .big{font-size:38px;font-weight:700;line-height:1.25}.ram .big small{font-size:17px;font-weight:700}.ram .f{color:var(--soft)}.ram .ok{color:var(--Atx);font-weight:600;display:flex;gap:4px;align-items:center;margin-top:2px}
.ram .f{font-size:13px}
.badge{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.badge .ic{width:13px;height:13px}.b-ok{background:var(--Abg);color:var(--Atx)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--Mbg);color:var(--Mtx)}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr 64px;gap:14px;align-items:center;margin:10px 0;font-size:14px;cursor:pointer;border-radius:8px;padding:1px 4px}
.hbar:hover{background:#f3f7ff}.hbar .tr{background:var(--line2);border-radius:6px;overflow:hidden;height:11px}.hbar .tr i{display:block;height:100%;border-radius:6px}.hbar b{text-align:right;font-weight:700}.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}th{color:var(--soft);font-size:12.5px;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}.r{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:#f3f7ff}
.gh td{background:#f6f8fc;font-weight:600;cursor:pointer}.gh .ic{width:15px;height:15px;vertical-align:-2px;margin-right:6px;color:var(--soft)}.gh .gs{color:var(--faint);font-weight:400;margin-left:6px}.gh:hover td{background:#eef3fc}
.databar{background:var(--line2);border-radius:6px;min-width:130px}.databar i{display:block;background:#cfe0ff;border-radius:6px;padding:1px 8px;font-style:normal;font-weight:600;color:var(--navy)}
.empty{text-align:center;color:var(--soft);padding:50px 20px}.emp{text-align:center;padding:64px 20px 70px}.emp .ico{margin:0 auto 14px;width:90px;height:90px;border-radius:22px;background:#e8eefb;color:var(--navy)}.emp .ico .ic{width:36px;height:36px}.emp h2{font-size:25px;margin:0 0 8px;color:var(--text)}.emp p{margin:0 0 18px;color:var(--soft)}
.donut{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.donut .h{width:116px;height:116px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--soft)}.donut .h b{display:block;font-size:26px;color:var(--navy);line-height:1.1}
.leg{display:grid;grid-template-columns:14px minmax(0,1fr) 40px 44px;gap:10px;align-items:start;font-size:14.5px;margin:2px 0;cursor:pointer;border-radius:8px;padding:3px 4px}.leg:hover{background:#f3f7ff}
.leg i{width:13px;height:13px;border-radius:3px;margin-top:5px}.leg .s2{display:block;color:var(--faint);font-size:12.5px}.leg>b{text-align:right;font-size:16px}.leg .pc{text-align:right;color:var(--faint);padding-top:1px}
.res{border-radius:16px;padding:16px;min-width:0}.res.R{background:var(--Rbg);border:1px solid #cfdcfb}.res.M{background:var(--Mbg);border:1px solid var(--Mbd)}.res.A{background:var(--Abg);border:1px solid var(--Abd)}
.res .hd{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}.res .box{background:#fff;border-radius:12px;padding:12px}
.res .big{font-size:36px;font-weight:700;line-height:1.2}.res .big small{font-size:16px}.res.R .big{color:var(--R)}.res.M .big{color:var(--M)}.res.A .big{color:var(--A)}
.res .mini{font-size:14px;margin-top:8px;color:var(--text)}
.tag{width:22px;height:22px;border-radius:6px;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.lbl{font-size:13px;color:var(--soft);margin-bottom:4px}
.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-size:17px;width:100%;display:flex;align-items:center;gap:6px}
.inp input{border:0;outline:0;width:100%;background:transparent;font-size:17px;min-width:0}.inp span{color:var(--faint);font-size:14px}
.inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,242,.15)}.inp.auto{background:var(--Abg);border-color:var(--Abd)}
select.f,input.f{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%;font-size:15px}
.errmsg{color:var(--bad);font-size:13px;margin-top:4px}
.note{background:#f3f7ff;border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--soft)}
.note.warn{background:var(--Mbg);color:var(--Mtx)}.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--Abg);color:var(--Atx)}
.rv{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:16px;align-items:start}.rv>div{display:flex;flex-direction:column;gap:16px;min-width:0}
.fml{font-size:13.5px;line-height:1.7}.fml b{display:block}
.rng{width:100%;accent-color:var(--navy)}
.good{color:var(--A);font-weight:600}.badc{color:var(--bad);font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.ov.open{display:flex}
.mbox{background:#fff;border-radius:22px;width:100%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox.sm{max-width:480px}.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);font-size:20px;font-weight:700;color:var(--navy);gap:10px}
.mx{border:0;background:#f1f4f9;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.mb{padding:18px 22px;overflow:auto;flex:1;min-height:0}.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;flex-wrap:wrap;gap:0 2px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.tabs button{border:0;background:transparent;padding:17px 12px;border-radius:0;white-space:nowrap;color:var(--navy);font-size:15px;font-weight:500}.tabs button.on{box-shadow:inset 0 -3px 0 var(--blue);color:var(--navy);font-weight:700}.tabs button.lk{color:var(--faint)}
.step{display:flex;gap:12px;margin-bottom:14px}.step>b{background:var(--navy);color:#fff;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}.step h4{margin:0}.step p{margin:2px 0 0;color:var(--soft)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13.5px;color:var(--soft);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;z-index:200;display:none;max-width:90vw}
.drop{border:2px dashed #b9c9ee;border-radius:14px;padding:30px;text-align:center;color:var(--soft);background:#f8faff}
.hidden{display:none!important}
.code{background:#0f1a33;color:#d7e3ff;border-radius:12px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:420px;white-space:pre}
.ok-t{color:var(--Atx);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(15,26,51,.4);z-index:49;display:none}
/* trend */
.bars{display:flex;gap:3px;align-items:flex-end;height:210px;border-bottom:1px solid var(--line);position:relative;margin-top:12px}
.bars .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}.bars .c i{display:block;width:100%;background:#2f5bb7;border-radius:3px 3px 0 0}.bars .c:hover i{background:var(--blue)}
.bars .c span{font-size:10.5px;color:var(--soft)}.bars .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--M)}
.axl{display:flex;gap:3px;font-size:10.5px;color:var(--soft)}.axl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.pa{display:grid;grid-template-columns:minmax(90px,200px) 1fr 40px 46px;gap:10px;align-items:center;font-size:14px;padding:5px 4px;border-radius:8px;cursor:pointer}.pa:hover{background:#f3f7ff}
.pa .tr{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}.pa .tr i{display:block;height:100%;background:#2f5bb7;border-radius:6px}.pa.dim .tr i{background:#9db6ea}.pa.dim{color:var(--soft)}
.p80{border-top:1.5px dashed var(--bad);color:var(--bad);font-size:11.5px;margin:3px 0 6px;line-height:1}
.pb{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}.pb i{display:block;height:100%;border-radius:6px;background:#2f5bb7}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.rv{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-105%);transition:.25s;box-shadow:none}
 body.drawer .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}body.drawer .scrim{display:block}
 .menu-btn{display:inline-flex}.top{padding:0 14px}.content{padding:16px 14px 50px}.g3,.g2{grid-template-columns:1fr}.who,.hide-m{display:none}
}
@media(max-width:560px){.g4{gap:10px}.card{padding:14px}.v{font-size:26px}h1{font-size:22px}.donutw{flex-direction:column;align-items:flex-start}.leg{grid-template-columns:14px minmax(0,1fr) 30px 46px}.leg .rp{display:none}.hbar{grid-template-columns:90px 1fr 60px}.pa{grid-template-columns:minmax(70px,120px) 1fr 34px 40px}}
/* print */
#printReport{display:none}
@media print{
 body{background:#fff}.side,.top,.scrim,.ov,.toast,.info,.menu-btn,.bar .btn,.noprint{display:none!important}.app{display:block}.content{padding:0;max-width:none}
 .card{box-shadow:none;break-inside:avoid}.print-h{display:block!important}
 body.rep .app{display:none}body.rep #printReport{display:block}
 @page{size:A4;margin:12mm}
}
.print-h{display:none;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:14px}


.fld label.inp{display:flex;color:var(--text);font-size:17px;margin:0}



/* ===== v3 restyle ===== */
.fld label.lbl2{display:block}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:500}
.optc{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}.optc b{display:block}.optc .n{margin-top:1px}.optc input{width:18px;height:18px;accent-color:var(--navy)}.optc.dis{opacity:.7}
.ocard{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;background:#fff;width:100%;text-align:left}.ocard:hover{border-color:#b9c9ee;background:#fafcff}
.ocard .ib{width:46px;height:46px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none}.ocard b{display:block;font-size:16px}.ocard span{color:var(--soft);font-size:14px}
.warnbox{background:#fff7d6;border:1px solid #f3e19b;border-radius:12px;padding:12px 14px;color:#7a5b00}
.stepol{margin:0;padding-left:22px;line-height:2}.stepol li{margin-bottom:2px}
.ttl-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;font-size:14px;margin-right:8px}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.stat{background:#f4f7fc;border-radius:14px;padding:14px 16px}.stat .lb{font-size:13.5px}.stat .v{font-size:27px}.stat .n{margin-top:2px}
.pill2{border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;background:var(--Abg);color:var(--Atx);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}.pill2.bad{background:var(--badbg);color:var(--bad)}
.tag-p{border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;background:#eef2f8;color:var(--soft)}.tag-p.p1{background:#fdecea;color:var(--bad)}.tag-p.p2{background:var(--Mbg);color:var(--Mtx)}
@media(max-width:700px){.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}}

.kvl{display:grid;grid-template-columns:210px 1fr;gap:9px 16px;align-items:baseline}.kl{color:var(--soft)}
.btn.redo{border-color:#f0b4b0;color:var(--bad);background:#fff;margin-right:auto}
.info.warn{border-color:#f1c79b;color:var(--Mtx);background:#fff7ee}
table.big td{padding:13px 10px;font-size:15px}table.big th{padding:12px 10px;background:#f4f7fc}
.mf .btn{padding:10px 20px}
@media(max-width:600px){.kvl{grid-template-columns:1fr;gap:0 }.kl{margin-top:8px;font-size:13px}}

.mbox.sm2{max-width:560px}

const p2 = n => String(n).padStart(2, '0');
function fmtIso(ms){ if(ms == null) return ''; const d = new Date(ms); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }
function fmtTh(ms){ if(ms == null) return '–'; const d = new Date(ms); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }
function fmtThD(ms){ if(ms == null) return '–'; const d = new Date(ms); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543}`; }
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const yrTh = y => `${y+543} (${y})`;
function parseTime(v){
  if(v == null || v === '') return null;
  if(v instanceof Date){ if(isNaN(v)) return null; return Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes()) / 60000) * 60000; }
  if(typeof v === 'number'){ if(!isFinite(v) || v < 1) return null; return Math.round((v - 25569) * 1440) * 60000; }
  const s = String(v).trim(); let m;
  let Y, Mo, D, h = 0, mi = 0;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/))){ Y = +m[1]; Mo = +m[2]; D = +m[3]; h = +(m[4]||0); mi = +(m[5]||0); }
  else if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2}))?/))){ D = +m[1]; Mo = +m[2]; Y = +m[3]; h = +(m[4]||0); mi = +(m[5]||0); }
  else return null;
  if(Y > 2400) Y -= 543;
  if(Mo < 1 || Mo > 12 || D < 1 || D > 31) return null;
  return Date.UTC(Y, Mo - 1, D, h, mi);
}

function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

const COLMAP = {servicerequest:'sr', sr:'sr', summary:'summary', 'สถานที่ติดตั้ง':'loc', failurecode:'fail', problemcode:'prob', cause:'cause', priority:'prio', actualstart:'start', actualfinish:'finish', workcenter:'wc', status:'status', reported:'reported', reportedby:'by'};
const normH = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, '');
function sheetToRows(aoa){
  let hi = -1, map = null;
  for(let i = 0; i < Math.min(15, aoa.length); i++){
    const m = {}; let c = 0;
    (aoa[i] || []).forEach((h, j) => { const k = COLMAP[normH(h)]; if(k && !(k in m)){ m[k] = j; c++; } });
    if(c >= 3){ hi = i; map = m; break; }
  }
  if(hi < 0) return null;
  const rows = [];
  for(let i = hi + 1; i < aoa.length; i++){
    const r = aoa[i] || []; const g = k => (k in map) ? r[map[k]] : '';
    if(!r.some(x => x !== '' && x != null)) continue;
    const st = parseTime(g('start')), fi = parseTime(g('finish')), rp = parseTime(g('reported'));
    const rawT = k => { const v = g(k); return (v === '' || v == null) ? '' : v; };

      start:fmtIso(st), finish:fmtIso(fi), wc:String(g('wc') || '').trim(), status:String(g('status') || '').trim(), reported:fmtIso(rp), by:String(g('by') || '').trim(), _bad:{s:rawT('start') !== '' && st == null, f:rawT('finish') !== '' && fi == null}});

/* ---------- ทำความสะอาด ---------- */
function workType(r){ const s = r.summary || ''; if(/^\s*\[PM\]/i.test(s)) return 'PM'; if(/^\s*\[CM\]/i.test(s)) return 'CM'; return r.prio === 4 ? 'PM' : 'CM'; }
function unitOf(r){
  let m = (r.loc || '').match(/\(([^()]+)\)/); if(m && /[A-Za-z]+-/.test(m[1])) return m[1].trim().toUpperCase();
  m = (r.loc || '').match(/\b([A-Za-z]{1,4}-TR\.?\d+)\b/i) || (r.summary || '').match(/\b([A-Za-z]{1,4}-TR\.?\d+)\b/i);
  return m ? m[1].toUpperCase() : '';
}
function cleanData(rows){
  const rep = {read:rows.length, pm:0, cm:0, dup:0, drops:{}, samples:{}, startEq:0, events:0};
  const seen = new Set(), ev = [];
  const drop = (why, r) => { rep.drops[why] = (rep.drops[why] || 0) + 1; (rep.samples[why] = rep.samples[why] || []).length < 3 && rep.samples[why].push(r.sr || r.loc || '(ไม่มีเลข)'); };
  rows.forEach((r, i) => {
    if(workType(r) === 'PM'){ rep.pm++; return; }
    rep.cm++;
    const key = r.sr || `${r.loc}|${r.start}|${r.finish}`;
    if(seen.has(key)){ rep.dup++; return; } seen.add(key);
    const s = parseTime(r.start), f = parseTime(r.finish);
    if(s == null || f == null){ drop('ไม่มีเวลาเริ่มหรือเวลาเสร็จ', r); return; }
    if(f < s){ drop('เวลาเสร็จก่อนเวลาเริ่ม', r); return; }
    const h = (f - s) / 3600000;
    if(h > MAX_REPAIR_H){ drop('ซ่อมนานเกิน 8,760 ชม.', r); return; }
    const unit = unitOf(r);
    if(!unit){ drop('ไม่พบรหัสหม้อแปลง', r); return; }
    const rp = parseTime(r.reported);
    ev.push({id:i, sr:r.sr, summary:r.summary, loc:r.loc, fail:r.fail, prob:r.prob || '', cause:r.cause || '', prio:r.prio, s, f, h, eq:h === 0, unit, stn:unit.split('-')[0], year:new Date(s).getUTCFullYear(), rp, wc:r.wc, status:r.status, by:r.by});
    if(h === 0) rep.startEq++;

const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function calc(evs){
  const by = {};
  evs.forEach(e => (by[e.unit] = by[e.unit] || []).push(e));
  const units = {}, perEv = {}; let allGaps = [];
  Object.keys(by).forEach(u => {
    const l = by[u].slice().sort((a, b) => a.s - b.s || a.f - b.f);
    const gaps = [];
    l.forEach((e, i) => { if(i){ const g = (e.s - l[i-1].f) / 3600000; perEv[e.id] = {gap:g, prev:l[i-1]}; if(g > 0) gaps.push(g); } });
    const mtbf = gaps.length ? mean(gaps) : null, mttr = mean(l.map(e => e.h));
    units[u] = {unit:u, stn:l[0].stn, n:l.length, gaps:gaps.length, mtbf, mttr, A:mtbf != null ? mtbf / (mtbf + mttr) * 100 : null, eq:l.filter(e => e.eq).length, evs:l};
    allGaps = allGaps.concat(gaps);
    l.forEach(e => { const pe = perEv[e.id] = perEv[e.id] || {gap:null, prev:null}; pe.mt = mtbf; pe.A = mtbf != null ? mtbf / (mtbf + e.h) * 100 : null; });
  });
  const mts = [], As = [];
  evs.forEach(e => { const pe = perEv[e.id]; if(pe && pe.mt != null){ mts.push(pe.mt); As.push(pe.A); } });
  const mtbf = mean(mts), mttr = mean(evs.map(e => e.h)), A = mean(As);
  return {units, perEv, N:evs.length, mtbf, mtbfDays:mtbf != null ? mtbf / 24 : null, pooled:mean(allGaps), pooledDays:allGaps.length ? mean(allGaps) / 24 : null, mttr, A, nA:As.length,
    R:(t) => mtbf != null ? Math.exp(-t / mtbf) * 100 : null, M:(t) => mttr ? (1 - Math.exp(-t / mttr)) * 100 : null};
}
const uStats = (u, evs) => calc(evs).units[u];

}

function drill(k, v){
  let evs, title, c, fml = '';
  if(k === 'ev') return evDetail(v);
  if(k === 'ram') return ramModal();
  if(k === 'dq'){ const r = CLEAN.rep; const dr = Object.keys(r.drops).map(w => `<tr><td>${esc(w)}</td><td class="r">${r.drops[w]}</td><td>${esc((r.samples[w] || []).join(', '))}</td></tr>`).join('');
    return openM(1, 'สถานะข้อมูล', dqHtml(r) + (dr ? `<h2 style="margin:16px 0 6px">แถวที่ตัดทิ้ง</h2>${tbl(['เหตุผล', '>จำนวน', 'ตัวอย่างเลขที่'], [dr])}` : '<div class="note ok" style="margin-top:12px">ไม่มีแถวที่ถูกตัดทิ้ง</div>') + (r.startEq ? `<div class="note warn" style="margin-top:12px">มี ${r.startEq} เหตุที่เวลาเริ่ม = เวลาเสร็จ ระบบเก็บไว้ใช้คำนวณ (ซ่อม 0 ชม.) ควรตรวจกับต้นฉบับ</div>` : ''));
  }
  if(['unit', 'prob', 'cause', 'period', 'year', 'cmpu'].includes(k)){
    const base = scopeEv({noStn:k === 'unit', noYear:k === 'year'});
    if(k === 'unit'){ evs = base.filter(e => e.unit === v); title = `หม้อแปลง ${v}`; }
    else if(k === 'prob'){ evs = base.filter(e => (e.prob || '(ไม่ระบุ)') === v); title = probName(v); }
    else if(k === 'cause'){ evs = base.filter(e => (e.cause || '(ไม่ระบุ)') === v); title = causeName(v); }
    else if(k === 'year'){ evs = base.filter(e => e.year === +v); title = `ปี ${+v + 543}`; }
    else if(k === 'cmpu'){ evs = scopeEv({noYear:true}).filter(e => e.unit === v && (e.year === RK.cmpA || e.year === RK.cmpB)); title = `หม้อแปลง ${v} · ปี ${RK.cmpA + 543} กับ ${RK.cmpB + 543}`; }
    else { evs = RK.periods[+v].evs; title = RK.periods[+v].tl; }
    c = calc(evs);
    if(k === 'unit'){ const u = c.units[v]; fml = u ? `<div class="g g3" style="margin:0 0 8px"><div class="card"><div class="lb">MTBF</div><div class="v">${u.mtbf == null ? '–' : fmt(u.mtbf / 24)} <small>วัน</small></div>${u.mtbf == null ? `<div class="n">ไม่มีช่วงห่างให้คำนวณ ${nomtbfInfo(v)}</div>` : `<div class="n">${fmt(u.mtbf, 1)} ชม. จาก ${u.gaps} ช่วงห่าง</div>`}</div><div class="card"><div class="lb">MTTR</div><div class="v">${fmt(u.mttr)} <small>ชม.</small></div></div><div class="card"><div class="lb">A</div><div class="v">${fmt(u.A, 3)} <small>%</small></div>${badgeA(u.A)}</div></div><div class="fml">A = ${u.mtbf == null ? '–' : fmt(u.mtbf, 2)} ÷ (${u.mtbf == null ? '–' : fmt(u.mtbf, 2)} + ${fmt(u.mttr, 3)}) × 100</div>` : ''; }
  } else {
    evs = scopeEv(); if(k === 'eq') evs = evs.filter(e => e.eq); c = calc(k === 'eq' ? scopeEv() : evs);
    title = {events:'รายการทั้งหมด', units:'จำนวนหม้อแปลง', mtbf:'MTBF', mttr:'MTTR', A:'Availability (A)', R:'ความเชื่อถือได้ (R)', M:'ความซ่อมคืนได้ (M)', eq:'เหตุที่เริ่ม = เสร็จ'}[k] || k;
    fml = `<div class="fml">${fmlHtml(k, c, evs)}</div>`;
  }
  const cc = k === 'eq' ? calc(evs) : c;
  const us = Object.values(c.units).sort((a, b) => a.unit < b.unit ? -1 : 1);
  const ug = groupBy(evs, e => e.year), ytab = Object.keys(ug).sort().map(y => { const x = calc(ug[y]); return `<tr class="click" ${clickAttr('year', y)}><td>${+y + 543}</td><td class="r">${x.N}</td><td class="r">${x.mtbfDays == null ? '–' : fmt(x.mtbfDays)}</td><td class="r">${fmt(x.mttr)}</td><td class="r">${fmt(x.A, 3)}</td></tr>`; });
  openM(1, esc(title), `${fml}<h2 style="margin:16px 0 6px">แยกตามหม้อแปลง</h2>${tbl(['หม้อแปลง', '>เหตุ', '>ช่วงห่างที่นับได้', '>MTBF (วัน)', '>MTTR (ชม.)', '>A (%)', 'สถานะ', '>เริ่ม = เสร็จ'], us.map(u => `<tr class="click" ${clickAttr('unit', u.unit)}><td><b>${u.unit}</b></td><td class="r">${u.n}</td><td class="r">${u.gaps}</td><td class="r">${mtbfCell(u, true)}</td><td class="r">${fmt(u.mttr)}</td><td class="r">${fmt(u.A, 3)}</td><td>${badgeA(u.A)}</td><td class="r">${u.eq}</td></tr>`))}
  ${ytab.length > 1 ? `<h2 style="margin:16px 0 6px">แยกตามปี</h2>${tbl(['ปี', '>เหตุ', '>MTBF (วัน)', '>MTTR (ชม.)', '>A (%)'], ytab)}` : ''}${evTable(evs, cc)}`);
}

function doLogin(){
  const n = $('lgName').value.trim(), p = $('lgPw').value, er = $('lgErr'), list = admins();
  if(!n || !p){ er.textContent = 'กรอกชื่อและรหัสผ่าน'; return; }
  if(!list.length){ if(p.length < 4){ er.textContent = 'รหัสผ่านอย่างน้อย 4 ตัวอักษร'; return; } if(p !== $('lgPw2').value){ er.textContent = 'รหัสผ่านสองช่องไม่ตรงกัน'; return; } list.push({name:n, h:cyrb53(p)}); lsSet(KS.adm, list); audit('สร้างแอดมินคนแรก: ' + n); }

function logout(){

function handleFile(file){
  if(typeof XLSX === 'undefined'){ toast('โหลดตัวอ่าน Excel ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)'); return; }
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(fr.result, {type:'array', cellDates:false});
      const names = wb.SheetNames.slice().sort((a, b) => (b === 'Service Requests') - (a === 'Service Requests'));
      let res = null, used = '';
      for(const n of names){ const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}); const r = sheetToRows(aoa); if(r && r.rows.length){ res = r; used = n; break; } }
      if(!res){ openM(2, 'อ่านไฟล์ไม่ได้', '<div class="note bad">ไม่พบตารางที่มีหัวคอลัมน์ที่รู้จัก (เช่น Service Request, Summary, สถานที่ติดตั้ง, Actual Start, Actual Finish) ใน 15 แถวแรกของทุกชีต</div>', '<button class="btn pri" data-close="ov2">ปิด</button>'); return; }
      const badT = res.rows.filter(x => x._bad.s || x._bad.f).length;
      if(res.missing.length){ openM(2, 'อ่านไฟล์ไม่ได้', `<div class="note bad">ไม่พบคอลัมน์: ${res.missing.join(', ')}</div>`, '<button class="btn navy" data-close="ov2">ปิด</button>'); return; }
      DB.rows = res.rows.map(x => { const o = Object.assign({}, x); delete o._bad; return o; }); recompute(); DB.report = CLEAN.rep; DB.file = file.name; const r = CLEAN.rep, ys = years();
      audit(`นำเข้าไฟล์ ${file.name} (${DB.rows.length} แถว → ${CLEAN.ev.length} เหตุ)`); markDirty(); ST.stn = 'ALL'; ST.year = 'ALL'; render();
      const dr = Object.keys(r.drops).reduce((s, k) => s + r.drops[k], 0), nu = new Set(CLEAN.ev.map(e => e.unit)).size, kv = (a, b) => `<div class="kl">${a}</div><div>${b}</div>`;
      openM(1, 'ผลการนำเข้า', `<div class="note ok" style="border:1px solid var(--Abd);margin-bottom:14px">ใช้คำนวณได้ <b>งานซ่อม [CM] ${CLEAN.ev.length} เหตุ · หม้อแปลง ${nu} ลูก</b></div><div class="kvl" style="grid-template-columns:200px 1fr">${kv('ไฟล์', `${esc(file.name)} · ${wb.SheetNames.length} ชีต`)}${kv('แถวที่อ่านได้', r.read + ' แถว')}${kv('งาน [PM] ที่ตัดออก', `${r.pm} แถว <span class="n">(บำรุงรักษาตามแผน ไม่นำมาคำนวณ R/A/M)</span>`)}${kv('งาน [CM]', `${r.cm} แถว (ซ้ำ ${r.dup} → เหลือ ${r.cm - r.dup})`)}${dr ? kv('ตัดทิ้ง (ข้อมูลผิดปกติ)', `<span class="bad-t">${dr} แถว</span> <span class="n">(${Object.keys(r.drops).map(w => esc(w) + ' ' + r.drops[w]).join(' · ')})</span>`) : ''}${kv('ช่วงข้อมูล', ys.length ? `ปี ${ys[0] + 543} – ปี ${ys[ys.length - 1] + 543} (${ys.length} ปี)` : '–')}</div>${badT ? `<div class="note warn" style="margin-top:12px">มี ${badT} แถวที่อ่านรูปแบบวันเวลาไม่ได้</div>` : ''}<div class="n" style="margin-top:14px;font-size:13.5px">ข้อมูลยังไม่ถูกบันทึก กด “บันทึกการเปลี่ยนแปลง” ด้านบนเพื่อเก็บไว้ในเบราว์เซอร์นี้</div>`, '<button class="btn navy" data-close="ov1">ตกลง</button>');
    }catch(err){ openM(2, 'อ่านไฟล์ไม่ได้', `<div class="note bad">${esc(err.message || err)}</div>`, '<button class="btn pri" data-close="ov2">ปิด</button>'); }
  };
  fr.readAsArrayBuffer(file);
}
let PENDING = null;
function doImport(name){
  if(!PENDING) return; DB.rows = PENDING; PENDING = null; recompute(); DB.report = CLEAN.rep; audit(`นำเข้าไฟล์ ${name} (${DB.rows.length} แถว → ${CLEAN.ev.length} เหตุ)`); markDirty(); closeM(1); ST.stn = 'ALL'; ST.year = 'ALL'; render(); toast('นำเข้าแล้ว อย่าลืมกดบันทึกการเปลี่ยนแปลง');
}

}
function doAdd(){
  const er = $('adE'), loc = $('adL').value.trim(), sr0 = $('adSR').value.trim(), sr = sr0 || 'MAN-' + Date.now().toString(36).toUpperCase(), s = $('adS').value, f = $('adF').value;
  if(!/\(([^()]+)\)/.test(loc)){ er.textContent = 'สถานที่ติดตั้งต้องมีรหัสหม้อแปลงในวงเล็บ เช่น คอต่อ (KO-TR.1)'; return; }
  if(sr0 && DB.rows.some(r => r.sr === sr)){ er.textContent = 'มี Service Request นี้อยู่แล้ว'; return; }
  if(!s || !f){ er.textContent = 'กรอกเวลาเริ่มและเวลาเสร็จ'; return; }
  const a = parseTime(s.replace('T', ' ')), b = parseTime(f.replace('T', ' ')), rp = $('adR').value ? parseTime($('adR').value.replace('T', ' ')) : null;
  if(b <= a){ er.textContent = 'เวลาเสร็จต้องหลังเวลาเริ่ม'; return; }
  let sm = $('adT').value.trim() || 'เพิ่มโดยแอดมิน'; if(!/^\s*\[(CM|PM)\]/i.test(sm)) sm = '[CM] ' + sm;
  DB.rows.push({sr, summary:sm, loc, fail:'', prob:$('adPr').value.trim(), cause:$('adC').value.trim(), prio:+$('adP').value, start:fmtIso(a), finish:fmtIso(b), wc:'', status:'', reported:rp != null ? fmtIso(rp) : '', by:SESSION});
  recompute(); audit(`เพิ่มรายการ ${sr}`); markDirty(); closeM(1); render(); toast('เพิ่มรายการแล้ว');
}
function delAsk(id){ const e = CLEAN.ev.find(x => x.id == id); if(!e) return; openM(2, 'ลบเหตุนี้?', `ลบเหตุของ <b>${e.unit}</b> เริ่ม ${fmtTh(e.s)} (${esc(e.sr)}) ออกจากข้อมูล`, `<button class="btn" data-close="ov2">ยกเลิก</button><button class="btn red" data-a="dodel" data-v="${id}">ลบ</button>`); }

const PYCODE = `import json, re
from datetime import datetime
def _t(s):
    if not s: return None
    try: return datetime.strptime(s, '%Y-%m-%d %H:%M')
    except Exception: return None
def _unit(r):
    m = re.search(r'\\(([^()]+)\\)', r.get('loc') or '')
    if m and re.search(r'[A-Za-z]+-', m.group(1)): return m.group(1).strip().upper()
    m = re.search(r'\\b([A-Za-z]{1,4}-TR\\.?\\d+)\\b', r.get('loc') or '') or re.search(r'\\b([A-Za-z]{1,4}-TR\\.?\\d+)\\b', r.get('summary') or '')
    return m.group(1).upper() if m else ''
def _mean(a): return sum(a)/len(a) if a else None
def analyze(js):
    rows = json.loads(js); seen = set(); ev = []; pm = cm = dup = drop = 0
    for r in rows:
        s = r.get('summary') or ''
        if re.match(r'\\s*\\[PM\\]', s, re.I) or (not re.match(r'\\s*\\[CM\\]', s, re.I) and r.get('prio') == 4):
            pm += 1; continue
        cm += 1
        key = r.get('sr') or ((r.get('loc') or '') + '|' + (r.get('start') or '') + '|' + (r.get('finish') or ''))
        if key in seen: dup += 1; continue
        seen.add(key)
        a = _t(r.get('start')); b = _t(r.get('finish'))
        if a is None or b is None or b < a: drop += 1; continue
        h = (b - a).total_seconds() / 3600
        u = _unit(r)
        if h > 8760 or not u: drop += 1; continue
        ev.append(dict(u=u, a=a, b=b, h=h, p=r.get('prob') or '(ไม่ระบุ)', c=r.get('cause') or '(ไม่ระบุ)', pr=r.get('prio')))
    by = {}
    for e in ev: by.setdefault(e['u'], []).append(e)
    gaps = []; mt = []; As = {}; ulist = []
    for u, l in sorted(by.items()):
        l.sort(key=lambda e: (e['a'], e['b']))
        g = [(l[i]['a'] - l[i-1]['b']).total_seconds() / 3600 for i in range(1, len(l))]
        g = [x for x in g if x > 0]; gaps += g
        m = _mean(g); mr = _mean([e['h'] for e in l]); ua = []
        for e in l:
            if m is not None:
                A = m / (m + e['h']) * 100
                mt.append(m); As.setdefault(u.split('-')[0], []).append(A); ua.append(A)
        ulist.append(dict(unit=u, n=len(l), mtbf=m, mttr=mr, A=(m / (m + mr) * 100) if m is not None else None))
    allA = [x for v in As.values() for x in v]
    def top(k):
        d = {}
        for e in ev: d[e[k]] = d.get(e[k], 0) + 1
        if not d: return '-'
        k2, n = sorted(d.items(), key=lambda kv: (-kv[1], kv[0]))[0]
        return k2 + ' ' + str(n)

`;
