<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAMSight หม้อแปลง</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--navy:#0b2160;--navy2:#1c3a7a;--blue:#1677f2;--bg:#f3f6fb;--card:#fff;--line:#e3e9f3;--line2:#eef2f8;--text:#14213d;--soft:#5d6b86;--faint:#8a96ad;
--R:#2563eb;--Rbg:#eaf1ff;--A:#2e8b57;--Atx:#23704a;--Abg:#e8f6ee;--Abd:#bfe3cd;--M:#e07a1f;--Mtx:#b85f10;--Mbg:#fff2e5;--Mbd:#f6d3b0;--bad:#c2413b;--badbg:#fdecea}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 'IBM Plex Sans Thai Looped','IBM Plex Sans Thai','Noto Sans Thai',Tahoma,sans-serif;color:var(--text);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;overflow-y:auto;width:268px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;color:var(--navy);margin:2px 4px 8px}.logo img{height:38px;width:auto}
.logo span{color:var(--blue)}
.sec{font-size:12px;color:var(--faint);margin:10px 6px 0}
.stn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%}
.stn .t{display:block;font-weight:600}.stn .s{display:block;font-size:12px;color:var(--soft)}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}.stn.on .s{color:#c9d4f2}
.nav{border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;display:flex;gap:10px;align-items:center;width:100%;color:var(--text)}
.nav:hover{background:#f1f5fd}.nav.on{background:#e8eefb;box-shadow:inset 3px 0 0 var(--blue);font-weight:700;color:var(--navy)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-align:center}
.side .btn{width:100%;justify-content:flex-start}.btn:hover{background:#f6f8fd}.btn.sm{padding:6px 12px;font-size:14px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy2)}
.btn.green{background:var(--A);border-color:var(--A);color:#fff;position:relative}.btn.red{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.dot{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--M);border:2px solid #fff}
.pill{background:var(--Abg);color:var(--Atx);border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.45}
.pill.empty{background:#f1f4fa;color:var(--soft)}
.foot{margin-top:auto;padding-top:8px}
.main{min-width:0}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:8px;align-items:center}.who{background:var(--Rbg);color:var(--navy);border-radius:99px;padding:5px 12px;font-size:13.5px}
.menu-btn{display:none}
.content{padding:24px 28px 60px;max-width:1500px}
h1{margin:0 0 14px;font-size:26px;color:var(--navy);display:flex;gap:10px;align-items:center}
h2{margin:0;font-size:16.5px;color:var(--navy)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px}.seg button.on{background:var(--navy);color:#fff}
.sel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 8px 6px 14px;display:inline-flex;align-items:center;gap:6px;color:var(--soft)}
.sel select{border:0;background:transparent;font-weight:600;color:var(--text);padding:3px;max-width:100%;outline:none}
.g{display:grid;gap:16px;margin-bottom:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:0 8px 24px -16px rgba(11,33,96,.15);position:relative;min-width:0}
.card.click{cursor:pointer;transition:.15s}.card.click:hover{border-color:#b9c9ee;box-shadow:0 10px 26px -14px rgba(11,33,96,.28)}
.sub{color:var(--soft);font-size:13px}.n{color:var(--faint);font-size:12.5px}
.info{border:1px solid #f1c79b;background:#fff7ee;color:var(--Mtx);width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1;display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-left:4px}
.card>.info.tr{position:absolute;top:14px;right:14px}
.ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.lb{color:var(--soft);font-size:13.5px}.v{font-size:32px;font-weight:700;color:var(--navy);line-height:1.2}.v small{font-size:15px;color:var(--soft);font-weight:600}
.ram{border-radius:14px;padding:14px 16px;text-align:left;border:0;width:100%}
.ram.R{background:var(--Rbg);color:var(--R)}.ram.A{background:var(--Abg);color:var(--Atx)}.ram.M{background:var(--Mbg);color:var(--Mtx)}
.ram .t{font-weight:700}.ram .p{font-size:30px;font-weight:700;line-height:1.3}.ram .f{font-size:12.5px;opacity:.9}
.badge{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.badge .ic{width:13px;height:13px}.b-ok{background:var(--Abg);color:var(--Atx)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--Mbg);color:var(--Mtx)}
.hbar{display:grid;grid-template-columns:minmax(80px,150px) 1fr 70px;gap:12px;align-items:center;margin:9px 0;font-size:14px;cursor:pointer;border-radius:8px;padding:1px 4px}
.hbar:hover{background:#f3f7ff}.hbar .tr{background:var(--line2);border-radius:6px;overflow:hidden;height:10px}.hbar .tr i{display:block;height:100%;border-radius:6px}.hbar b{text-align:right;font-weight:600}.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw{overflow:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}th{color:var(--soft);font-size:12.5px;font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}.r{text-align:right}tr.click{cursor:pointer}tr.click:hover td{background:#f3f7ff}
.gh td{background:#f7f9fd;font-weight:600;cursor:pointer}.gh:hover td{background:#eef3fc}
.databar{background:var(--line2);border-radius:6px;min-width:130px}.databar i{display:block;background:#cfe0ff;border-radius:6px;padding:1px 8px;font-style:normal;font-weight:600;color:var(--navy)}
.empty{text-align:center;color:var(--soft);padding:50px 20px}
.donut{width:160px;height:160px;border-radius:50%;display:grid;place-items:center;flex:none;position:relative}
.donut .h{width:98px;height:98px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--soft)}.donut .h b{display:block;font-size:26px;color:var(--navy);line-height:1.1}
.leg{display:grid;grid-template-columns:14px minmax(0,1fr) 34px 52px minmax(80px,auto);gap:8px;align-items:center;font-size:13.5px;margin:3px 0;cursor:pointer;border-radius:8px;padding:3px 4px}.leg:hover{background:#f3f7ff}
.leg i{width:12px;height:12px;border-radius:3px}
.res{border-radius:16px;padding:16px;min-width:0}.res.R{background:var(--Rbg);border:1px solid #cfdcfb}.res.M{background:var(--Mbg);border:1px solid var(--Mbd)}.res.A{background:var(--Abg);border:1px solid var(--Abd)}
.res .hd{font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}.res .box{background:#fff;border-radius:12px;padding:12px}
.res .big{font-size:36px;font-weight:700;line-height:1.2}.res .big small{font-size:16px}.res.R .big{color:var(--R)}.res.M .big{color:var(--M)}.res.A .big{color:var(--A)}
.res .mini{font-size:14px;margin-top:8px;color:var(--text)}
.tag{width:22px;height:22px;border-radius:6px;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700}
.lbl{font-size:13px;color:var(--soft);margin-bottom:4px}
.inp{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff;font-size:17px;width:100%;display:flex;align-items:center;gap:6px}
.inp input{border:0;outline:0;width:100%;background:transparent;font-size:17px;min-width:0}.inp span{color:var(--faint);font-size:14px}
.inp:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(22,119,242,.15)}.inp.auto{background:var(--Abg);border-color:var(--Abd)}
select.f,input.f{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;width:100%;font-size:15px}
.errmsg{color:var(--bad);font-size:13px;margin-top:4px}
.note{background:#f3f7ff;border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--soft)}
.note.warn{background:var(--Mbg);color:var(--Mtx)}.note.bad{background:var(--badbg);color:var(--bad)}.note.ok{background:var(--Abg);color:var(--Atx)}
.rv{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:16px;align-items:start}.rv>div{display:flex;flex-direction:column;gap:16px;min-width:0}
.fml{font-size:13.5px;line-height:1.7}.fml b{display:block}
.rng{width:100%;accent-color:var(--navy)}
.good{color:var(--A);font-weight:600}.badc{color:var(--bad);font-weight:600}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.ov.open{display:flex}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:960px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mbox.sm{max-width:480px}.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:18px;font-weight:700;color:var(--navy);gap:10px}
.mx{border:0;background:#f1f4f9;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.mb{padding:18px 22px;overflow:auto;flex:1;min-height:0}.mf{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:transparent;padding:12px 14px;border-radius:0;white-space:nowrap;color:var(--text)}.tabs button.on{box-shadow:inset 0 -3px 0 var(--blue);color:var(--navy);font-weight:700}.tabs button.lk{color:var(--faint)}
.step{display:flex;gap:12px;margin-bottom:14px}.step>b{background:var(--navy);color:#fff;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}.step h4{margin:0}.step p{margin:2px 0 0;color:var(--soft)}
.fld{margin-bottom:12px}.fld label{display:block;font-size:13.5px;color:var(--soft);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;z-index:200;display:none;max-width:90vw}
.drop{border:2px dashed #b9c9ee;border-radius:14px;padding:30px;text-align:center;color:var(--soft);background:#f8faff}
.hidden{display:none!important}
.code{background:#0f1a33;color:#d7e3ff;border-radius:12px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:420px;white-space:pre}
.ok-t{color:var(--Atx);font-weight:600}.bad-t{color:var(--bad);font-weight:600}
.scrim{position:fixed;inset:0;background:rgba(15,26,51,.4);z-index:49;display:none}
/* trend */
.bars{display:flex;gap:3px;align-items:flex-end;height:210px;border-bottom:1px solid var(--line);position:relative;margin-top:12px}
.bars .c{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}.bars .c i{display:block;width:100%;background:#2f5bb7;border-radius:3px 3px 0 0}.bars .c:hover i{background:var(--blue)}
.bars .c span{font-size:10.5px;color:var(--soft)}.bars .avg{position:absolute;left:0;right:0;border-top:1.5px dashed var(--M)}
.axl{display:flex;gap:3px;font-size:10.5px;color:var(--soft)}.axl span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
.pa{display:grid;grid-template-columns:minmax(90px,200px) 1fr 40px 46px;gap:10px;align-items:center;font-size:14px;padding:5px 4px;border-radius:8px;cursor:pointer}.pa:hover{background:#f3f7ff}
.pa .tr{height:10px;background:var(--line2);border-radius:6px;overflow:hidden}.pa .tr i{display:block;height:100%;background:#2f5bb7;border-radius:6px}.pa.dim .tr i{background:#9db6ea}.pa.dim{color:var(--soft)}
.p80{border-top:1.5px dashed var(--bad);color:var(--bad);font-size:11.5px;margin:3px 0 6px;line-height:1}
.pb{height:10px;border-radius:6px;background:var(--line2);overflow:hidden}.pb i{display:block;height:100%;border-radius:6px;background:#2f5bb7}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.rv{grid-template-columns:1fr}}
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-105%);transition:.25s;box-shadow:none}
 body.drawer .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.3)}body.drawer .scrim{display:block}
 .menu-btn{display:inline-flex}.top{padding:0 14px}.content{padding:16px 14px 50px}.g3,.g2{grid-template-columns:1fr}.who,.hide-m{display:none}
}
@media(max-width:560px){.g4{gap:10px}.card{padding:14px}.v{font-size:26px}h1{font-size:22px}.donutw{flex-direction:column;align-items:flex-start}.leg{grid-template-columns:14px minmax(0,1fr) 30px 46px}.leg .rp{display:none}.hbar{grid-template-columns:90px 1fr 60px}.pa{grid-template-columns:minmax(70px,120px) 1fr 34px 40px}}
/* print */
#printReport{display:none}
@media print{
 body{background:#fff}.side,.top,.scrim,.ov,.toast,.info,.menu-btn,.bar .btn,.noprint{display:none!important}.app{display:block}.content{padding:0;max-width:none}
 .card{box-shadow:none;break-inside:avoid}.print-h{display:block!important}
 body.rep .app{display:none}body.rep #printReport{display:block}
 @page{size:A4;margin:12mm}
}
.print-h{display:none;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:14px}
#printReport{font-size:12px}#printReport h2{font-size:14px;margin:12px 0 4px}#printReport table{font-size:11px}#printReport .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#printReport .kv div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}

.fld label.inp{display:flex;color:var(--text);font-size:17px;margin:0}
</style></head><body>

<div class="scrim" id="scrim"></div>
<div class="app">
<aside class="side" id="side">
  <div class="logo"><img id="logoImg" alt="RAM"><div>RAM<span>Sight</span></div></div>
  <div class="sec">สถานี</div>
  <div id="stnBtns" style="display:flex;flex-direction:column;gap:6px"></div>

  <div class="sec">จัดการข้อมูล</div>

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k, v){ try{ if(v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){} }

const p2 = n => String(n).padStart(2, '0');
function fmtIso(ms){ if(ms == null) return ''; const d = new Date(ms); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }
function fmtTh(ms){ if(ms == null) return '–'; const d = new Date(ms); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }
function fmtThD(ms){ if(ms == null) return '–'; const d = new Date(ms); return `${p2(d.getUTCDate())}/${p2(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543}`; }
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const yrTh = y => `${y+543} (${y})`;
function parseTime(v){
  if(v == null || v === '') return null;
  if(v instanceof Date){ if(isNaN(v)) return null; return Math.round(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes()) / 60000) * 60000; }
  if(typeof v === 'number'){ if(!isFinite(v) || v < 1) return null; return Math.round((v - 25569) * 1440) * 60000; }
  const s = String(v).trim(); let m;
  let Y, Mo, D, h = 0, mi = 0;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/))){ Y = +m[1]; Mo = +m[2]; D = +m[3]; h = +(m[4]||0); mi = +(m[5]||0); }
  else if((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[ T](\d{1,2}):(\d{2}))?/))){ D = +m[1]; Mo = +m[2]; Y = +m[3]; h = +(m[4]||0); mi = +(m[5]||0); }
  else return null;
  if(Y > 2400) Y -= 543;
  if(Mo < 1 || Mo > 12 || D < 1 || D > 31) return null;
  return Date.UTC(Y, Mo - 1, D, h, mi);
}

function cyrb53(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

function workType(r){ const s = r.summary || ''; if(/^\s*\[PM\]/i.test(s)) return 'PM'; if(/^\s*\[CM\]/i.test(s)) return 'CM'; return r.prio === 4 ? 'PM' : 'CM'; }
function unitOf(r){
  let m = (r.loc || '').match(/\(([^()]+)\)/); if(m && /[A-Za-z]+-/.test(m[1])) return m[1].trim().toUpperCase();
  m = (r.loc || '').match(/\b([A-Za-z]{1,4}-TR\.?\d+)\b/i) || (r.summary || '').match(/\b([A-Za-z]{1,4}-TR\.?\d+)\b/i);
  return m ? m[1].toUpperCase() : '';
}
function cleanData(rows){
  const rep = {read:rows.length, pm:0, cm:0, dup:0, drops:{}, samples:{}, startEq:0, events:0};
  const seen = new Set(), ev = [];
  const drop = (why, r) => { rep.drops[why] = (rep.drops[why] || 0) + 1; (rep.samples[why] = rep.samples[why] || []).length < 3 && rep.samples[why].push(r.sr || r.loc || '(ไม่มีเลข)'); };
  rows.forEach((r, i) => {
    if(workType(r) === 'PM'){ rep.pm++; return; }
    rep.cm++;
    const key = r.sr || `${r.loc}|${r.start}|${r.finish}`;
    if(seen.has(key)){ rep.dup++; return; } seen.add(key);
    const s = parseTime(r.start), f = parseTime(r.finish);
    if(s == null || f == null){ drop('ไม่มีเวลาเริ่มหรือเวลาเสร็จ', r); return; }
    if(f < s){ drop('เวลาเสร็จก่อนเวลาเริ่ม', r); return; }
    const h = (f - s) / 3600000;
    if(h > MAX_REPAIR_H){ drop('ซ่อมนานเกิน 8,760 ชม.', r); return; }
    const unit = unitOf(r);
    if(!unit){ drop('ไม่พบรหัสหม้อแปลง', r); return; }
    const rp = parseTime(r.reported);

    if(h === 0) rep.startEq++;

}

/* ---------- สูตรคำนวณ ---------- */
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function calc(evs){
  const by = {};
  evs.forEach(e => (by[e.unit] = by[e.unit] || []).push(e));
  const units = {}, perEv = {}; let allGaps = [];
  Object.keys(by).forEach(u => {
    const l = by[u].slice().sort((a, b) => a.s - b.s || a.f - b.f);
    const gaps = [];
    l.forEach((e, i) => { if(i){ const g = (e.s - l[i-1].f) / 3600000; perEv[e.id] = {gap:g, prev:l[i-1]}; if(g > 0) gaps.push(g); } });
    const mtbf = gaps.length ? mean(gaps) : null, mttr = mean(l.map(e => e.h));
    units[u] = {unit:u, stn:l[0].stn, n:l.length, gaps:gaps.length, mtbf, mttr, A:mtbf != null ? mtbf / (mtbf + mttr) * 100 : null, eq:l.filter(e => e.eq).length, evs:l};
    allGaps = allGaps.concat(gaps);
    l.forEach(e => { const pe = perEv[e.id] = perEv[e.id] || {gap:null, prev:null}; pe.mt = mtbf; pe.A = mtbf != null ? mtbf / (mtbf + e.h) * 100 : null; });
  });
  const mts = [], As = [];
  evs.forEach(e => { const pe = perEv[e.id]; if(pe && pe.mt != null){ mts.push(pe.mt); As.push(pe.A); } });
  const mtbf = mean(mts), mttr = mean(evs.map(e => e.h)), A = mean(As);
  return {units, perEv, N:evs.length, mtbf, mtbfDays:mtbf != null ? mtbf / 24 : null, pooled:mean(allGaps), pooledDays:allGaps.length ? mean(allGaps) / 24 : null, mttr, A, nA:As.length,
    R:(t) => mtbf != null ? Math.exp(-t / mtbf) * 100 : null, M:(t) => mttr ? (1 - Math.exp(-t / mttr)) * 100 : null};
}

const PL = {unit:'', R:'', M:'', A:'', hold:'mttr', mtbfS:4320, mttrS:18, last:null};
function planBase(){
  const evs = scopeEv({noStn:true}); const c = calc(evs);
  const u = PL.unit && c.units[PL.unit];
  if(u && u.mtbf != null) return {mtbf:u.mtbf, mttr:u.mttr, A:u.A, src:PL.unit, ok:true};
  return {mtbf:4320, mttr:18, A:4320 / 4338 * 100, src:u ? PL.unit + ' (ยังไม่มี MTBF จึงใช้ค่าตั้งต้น)' : 'ค่าตั้งต้น', ok:false};
}
function solvePlan(b, tR, tM){
  const R = PL.R === '' ? null : +PL.R, M = PL.M === '' ? null : +PL.M, A = PL.A === '' ? null : +PL.A;
  const bad = v => v != null && (!isFinite(v) || v <= 0 || v >= 100);
  const res = {mtbf:b.mtbf, mttr:b.mttr, R:null, M:null, A:null, auto:{}, err:null, nA:false};
  if(bad(R) || bad(M) || bad(A)){ res.err = 'กรอกค่าเป็นเปอร์เซ็นต์ระหว่าง 0 ถึง 100 (ไม่รวม 0 และ 100)'; return res; }
  let mtbf = b.mtbf, mttr = b.mttr;
  if(R != null && M != null){ mtbf = -tR / Math.log(R / 100); mttr = -tM / Math.log(1 - M / 100); res.R = R; res.M = M; res.A = mtbf / (mtbf + mttr) * 100; res.auto.A = true; }
  else if(R != null && A != null){ mtbf = -tR / Math.log(R / 100); mttr = mtbf * (100 - A) / A; res.R = R; res.A = A; res.M = (1 - Math.exp(-tM / mttr)) * 100; res.auto.M = true; }
  else if(M != null && A != null){ mttr = -tM / Math.log(1 - M / 100); mtbf = (A / 100 * mttr) / (1 - A / 100); res.M = M; res.A = A; res.R = Math.exp(-tR / mtbf) * 100; res.auto.R = true; }
  else if(R != null){ mtbf = -tR / Math.log(R / 100); res.R = R; res.M = (1 - Math.exp(-tM / mttr)) * 100; res.auto.M = true; res.nA = true; }
  else if(M != null){ mttr = -tM / Math.log(1 - M / 100); res.M = M; res.R = Math.exp(-tR / mtbf) * 100; res.auto.R = true; res.nA = true; }
  else if(A != null){
    if(PL.hold === 'mttr') mtbf = (A / 100 * mttr) / (1 - A / 100); else mttr = mtbf * (100 - A) / A;
    res.A = A; res.R = Math.exp(-tR / mtbf) * 100; res.M = (1 - Math.exp(-tM / mttr)) * 100; res.auto.R = res.auto.M = true;
  } else { res.R = Math.exp(-tR / mtbf) * 100; res.M = (1 - Math.exp(-tM / mttr)) * 100; res.A = b.A; res.auto.R = res.auto.M = res.auto.A = true; res.none = true; }
  res.mtbf = mtbf; res.mttr = mttr; return res;
}

  if(list.length > 12){ const rest = list.slice(11); list = list.slice(0, 11); list.push({k:'อื่น ๆ', n:rest.reduce((s, x) => s + x.n, 0), evs:[].concat(...rest.map(x => x.evs)), other:true}); }

  else ys.forEach(y => { for(let q = 0; q < 4; q++) periods.push({l:q === 0 ? `ปี${String(y + 543).slice(2)}` : '',tl:`Q${q + 1}/${y + 543}`, evs:evs.filter(e => e.year === y && Math.floor(new Date(e.s).getUTCMonth() / 3) === q)}); });

  const vals = periods.map(mv), mx = Math.max(1, ...vals.filter(v => v != null)), avg = mean(vals.filter(v => v != null));

    h += `<div class="card" style="margin-bottom:16px"><h2>เปรียบเทียบสองปี</h2><div class="bar" style="margin:10px 0">ปี ${sl('cmpA', RK.cmpA)} เทียบกับ ปี ${sl('cmpB', RK.cmpB)}</div>${tbl(['ตัวชี้วัด', '>ปี ' + (RK.cmpA + 543), '>ปี ' + (RK.cmpB + 543), '>ผลต่าง'], [cr('จำนวนเหตุ', v => fmt(v, 0), ca.N, cb.N, true), cr('MTBF เฉลี่ย (วัน)', v => fmt(v), ca.mtbfDays, cb.mtbfDays), cr('MTTR (ชม.)', v => fmt(v), ca.mttr, cb.mttr, true), cr('A (%)', v => fmt(v, 3), ca.A, cb.A)])}</div>`;

function handleFile(file){

    try{
      const wb = XLSX.read(fr.result, {type:'array', cellDates:false});
      const names = wb.SheetNames.slice().sort((a, b) => (b === 'Service Requests') - (a === 'Service Requests'));
      let res = null, used = '';
      for(const n of names){ const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}); const r = sheetToRows(aoa); if(r && r.rows.length){ res = r; used = n; break; } }

      const badT = res.rows.filter(x => x._bad.s || x._bad.f).length;
      openM(1, 'รายงานการนำเข้าข้อมูล', `<div class="note ok" style="margin-bottom:12px">อ่านจากชีต “${esc(used)}” · ไฟล์ ${esc(file.name)}</div>${dqHtml(r)}${res.missing.length ? `<div class="note bad" style="margin-top:12px">ไม่พบคอลัมน์: ${res.missing.join(', ')}</div>` : ''}${badT ? `<div class="note warn" style="margin-top:12px">มี ${badT} แถวที่อ่านรูปแบบวันเวลาไม่ได้</div>` : ''}${Object.keys(r.drops).length ? `<h2 style="margin:16px 0 6px">แถวที่ตัดทิ้ง</h2>${tbl(['เหตุผล', '>จำนวน', 'ตัวอย่างเลขที่'], Object.keys(r.drops).map(w => `<tr><td>${esc(w)}</td><td class="r">${r.drops[w]}</td><td>${esc(r.samples[w].join(', '))}</td></tr>`))}` : ''}<div class="note" style="margin-top:12px">การนำเข้าจะแทนที่ข้อมูลเดิมทั้งหมด และต้องกด “บันทึกการเปลี่ยนแปลง” อีกครั้งเพื่อเก็บถาวร</div>`, `<button class="btn" data-close="ov1">ยกเลิก</button><button class="btn pri" data-a="doimport" data-v="${esc(file.name)}"${res.missing.length ? ' disabled' : ''}>นำเข้าข้อมูล</button>`);
    }catch(err){ openM(2, 'อ่านไฟล์ไม่ได้', `<div class="note bad">${esc(err.message || err)}</div>`, '<button class="btn pri" data-close="ov2">ปิด</button>'); }
  };

}

/* ---------- Python ---------- */
const PYCODE = `import json, re
from datetime import datetime
def _t(s):
    if not s: return None
    try: return datetime.strptime(s, '%Y-%m-%d %H:%M')
    except Exception: return None
def _unit(r):
    m = re.search(r'\\(([^()]+)\\)', r.get('loc') or '')
    if m and re.search(r'[A-Za-z]+-', m.group(1)): return m.group(1).strip().upper()
    m = re.search(r'\\b([A-Za-z]{1,4}-TR\\.?\\d+)\\b', r.get('loc') or '') or re.search(r'\\b([A-Za-z]{1,4}-TR\\.?\\d+)\\b', r.get('summary') or '')
    return m.group(1).upper() if m else ''
def _mean(a): return sum(a)/len(a) if a else None
def analyze(js):
    rows = json.loads(js); seen = set(); ev = []
    for r in rows:
        s = r.get('summary') or ''
        if re.match(r'\\s*\\[PM\\]', s, re.I): continue
        if not re.match(r'\\s*\\[CM\\]', s, re.I) and r.get('prio') == 4: continue
        key = r.get('sr') or ((r.get('loc') or '') + '|' + (r.get('start') or '') + '|' + (r.get('finish') or ''))
        if key in seen: continue
        seen.add(key)
        a = _t(r.get('start')); b = _t(r.get('finish'))
        if a is None or b is None or b < a: continue
        h = (b - a).total_seconds() / 3600
        if h > 8760: continue
        u = _unit(r)
        if not u: continue
        ev.append(dict(u=u, a=a, b=b, h=h, p=r.get('prob') or '(ไม่ระบุ)', c=r.get('cause') or '(ไม่ระบุ)', pr=r.get('prio')))
    by = {}
    for e in ev: by.setdefault(e['u'], []).append(e)
    gaps = []; mt = []; As = {}; stn = {}
    for u, l in by.items():
        l.sort(key=lambda e: (e['a'], e['b']))
        g = [(l[i]['a'] - l[i-1]['b']).total_seconds() / 3600 for i in range(1, len(l))]
        g = [x for x in g if x > 0]; gaps += g
        m = _mean(g)
        for e in l:
            if m is not None:
                A = m / (m + e['h']) * 100
                mt.append(m); As.setdefault(u.split('-')[0], []).append(A)
    allA = [x for v in As.values() for x in v]
    def top(k):
        d = {}
        for e in ev: d[e[k]] = d.get(e[k], 0) + 1
        return sorted(d.items(), key=lambda kv: (-kv[1], kv[0]))[0][0] if d else '-'
    return json.dumps(dict(events=len(ev), units=len(by), mtbf=_mean(mt)/24, pooled=_mean(gaps)/24, mttr=_mean([e['h'] for e in ev]), A=_mean(allA), AKO=_mean(As.get('KO', [])), APR=_mean(As.get('PR', [])), prob=top('p'), cause=top('c'), p1=sum(1 for e in ev if e['pr'] == 1), eq=sum(1 for e in ev if e['h'] == 0)), ensure_ascii=False)
`;
function jsCheck(){
  const ev = CLEAN.ev, c = calc(ev), st = k => { const x = calc(ev.filter(e => e.stn === k)); return x.A; };
  return {events:c.N, units:Object.keys(c.units).length, mtbf:c.mtbfDays, pooled:c.pooledDays, mttr:c.mttr, A:c.A, AKO:st('KO'), APR:st('PR'), prob:(topList(ev, 'prob')[0] || {}).k, cause:(topList(ev, 'cause')[0] || {}).k, p1:ev.filter(e => e.prio === 1).length, eq:ev.filter(e => e.eq).length};
}
const PYITEMS = [['events', 'เหตุที่ใช้คำนวณ', 0], ['units', 'จำนวนหม้อแปลง', 0], ['mtbf', 'MTBF เฉลี่ย (วัน)', 3], ['pooled', 'MTBF รวมทุกช่วง (วัน)', 3], ['mttr', 'MTTR เฉลี่ย (ชม.)', 4], ['A', 'A เฉลี่ย (%)', 4], ['AKO', 'A สถานี KO (%)', 4], ['APR', 'A สถานี PR (%)', 4], ['prob', 'รหัสปัญหาที่พบมากสุด', -1], ['cause', 'สาเหตุที่พบมากสุด', -1], ['p1', 'เหตุ Priority 1', 0], ['eq', 'เหตุเริ่ม = เสร็จ', 0]];
let PYO = null, PYRES = null;
function renderPy(){
  const el = $('page-py');
  el.innerHTML = `<h1>${ic('code')} ตรวจสอบด้วย Python</h1><div class="card" style="margin-bottom:16px"><p style="margin-top:0">ให้ Python (รันในเบราว์เซอร์ผ่าน Pyodide) อ่านข้อมูลดิบทุกแถวแล้วคำนวณใหม่ด้วยโค้ดแยกต่างหาก เพื่อเทียบกับตัวเลขของหน้าเว็บ 12 รายการ ตัวเลขชุดนี้ไม่ขึ้นกับตัวกรองสถานีและปี</p><button class="btn pri" data-a="runpy" id="btnPy"${DB.rows.length ? '' : ' disabled'}>${ic('play')} เริ่มตรวจสอบ</button> <span class="sub" id="pyStat">${DB.rows.length ? 'ครั้งแรกต้องโหลด Python ประมาณ 10 MB' : 'ยังไม่มีข้อมูล'}</span></div><div id="pyOut">${PYRES || ''}</div><div class="card" style="margin-top:16px"><h2>โค้ด Python ที่ใช้</h2><div class="code" style="margin-top:8px">${esc(PYCODE)}</div></div>`;
}
async function runPy(){
  const st = $('pyStat'), btn = $('btnPy'); btn.disabled = true;
  try{
    if(!PYO){
      st.textContent = 'กำลังโหลด Python…';
      if(typeof loadPyodide === 'undefined') await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js'; s.onload = ok; s.onerror = () => no(new Error('โหลด Pyodide ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)')); document.head.appendChild(s); });
      PYO = await loadPyodide(); PYO.runPython(PYCODE);
    }
    st.textContent = 'กำลังคำนวณ…';
    const out = JSON.parse(PYO.globals.get('analyze')(JSON.stringify(DB.rows))), js = jsCheck(); let okAll = true;
    const rows = PYITEMS.map(([k, n, d]) => { let a = js[k], b = out[k], ok = d < 0 ? a === b : (a != null && b != null && Math.abs(a - b) < 1e-6 * Math.max(1, Math.abs(a))); if(!ok) okAll = false; const f = v => d < 0 ? esc(v == null ? '–' : (k === 'prob' ? probName(v) : causeName(v))) : fmt(v, d); return `<tr><td>${n}</td><td class="r">${f(a)}</td><td class="r">${f(b)}</td><td>${ok ? '<span class="badge b-ok">' + ic('check') + 'ตรงกัน</span>' : '<span class="badge b-bad">ไม่ตรง</span>'}</td></tr>`; });
    PYRES = `<div class="note ${okAll ? 'ok' : 'bad'}" style="margin-bottom:12px"><b>${okAll ? 'ตรงกันทั้ง 12 รายการ' : 'มีรายการที่ไม่ตรงกัน'}</b></div><div class="card">${tbl(['รายการ', '>เว็บ (JavaScript)', '>Python', 'ผล'], rows)}</div>`;
    $('pyOut').innerHTML = PYRES; st.textContent = 'ตรวจสอบเสร็จแล้ว';
  }catch(e){ st.textContent = 'เกิดข้อผิดพลาด: ' + (e.message || e); }
  btn.disabled = false;
}
