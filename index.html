<style>
:root{
  --navy:#0b2160; --navy2:#1c3a7a; --blue:#1677f2; --sky:#0ea0e6;
  --bg:#f3f6fb; --card:#fff; --line:#e3e9f3; --line2:#eef2f8; --text:#14213d; --soft:#5d6b86; --faint:#8a96ad;
  --R:#2563eb; --Rbg:#eaf1ff; --Rbd:#c7d8fb; --M:#e07a1f; --Mtx:#b85f10; --Mbg:#fff2e5; --Mbd:#f6d3b0;
  --A:#2e8b57; --Atx:#23704a; --Abg:#e8f6ee; --Abd:#bfe3cd; --bad:#c2413b; --badbg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,#fff 0,#fff 267px,var(--line) 267px,var(--line) 268px,transparent 268px)}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.logo img{height:34px;width:auto}
.logo b{font-size:21px;letter-spacing:-.2px;color:var(--navy)}
.logo b span{color:var(--blue)}
.sec{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.3px;margin:12px 6px 4px}
.stn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;background:#fafcff;text-align:left;width:100%}
.stn:hover{border-color:#c8d4ea}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stn .t{font-weight:600;font-size:15px;display:block}.stn .s{font-size:12.5px;color:var(--soft);display:block}.stn.on .s{color:#c6d3ef}
.stn svg.ic{margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--soft);font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:#f3f6fc;color:var(--text)}
.nav.on{background:#e8eefb;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;font-size:14.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#c3cee3;background:#f8faff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.danger{color:var(--bad);border-color:#f0c9c6}
.btn.save{background:var(--A);color:#fff;border-color:var(--A)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.side .btn{width:100%;justify-content:flex-start}
.pill{margin-top:8px;border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;background:#f1f4f9;color:var(--soft)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:7px;flex:none}
.pill.ok{background:var(--Abg);color:var(--Atx)}.pill.ok i{background:var(--A)}
.foot{margin-top:auto;padding-top:10px}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);font-size:14px}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e8eefb;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--M)}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;display:flex;align-items:center;gap:10px;color:var(--navy);line-height:1.3}
h1 svg.ic{width:26px;height:26px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:500;color:var(--soft);background:none;border:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--navy);color:#fff}
.sel{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 12px;font-weight:500}
.sel label{color:var(--soft);font-weight:400;font-size:14px}
.sel select{border:0;background:transparent;padding:5px 6px;font-weight:500;max-width:100%;outline:none}
select.fld,input.fld{border:1px solid #cfd8e8;border-radius:10px;padding:9px 12px;background:#fff;width:100%;outline:none}
select.fld:focus,input.fld:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;min-width:0}
.card h3{font-size:16.5px;display:flex;align-items:center;gap:8px;line-height:1.35}
.sub{color:var(--soft);font-size:13.5px;margin-top:2px}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);color:var(--faint);font-size:11.5px;font-weight:700;font-family:Georgia,serif;font-style:italic;background:#fff;flex:none;padding:0}
.info:hover{border-color:var(--blue);color:var(--blue)}
.kpi .ico{width:40px;height:40px;border-radius:11px;background:#eaf0fb;display:grid;place-items:center;color:var(--navy);margin-bottom:12px}
.kpi .lb{font-size:14px;color:var(--soft);font-weight:500}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;margin-top:2px}.kpi .v small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.kpi .n{font-size:13px;color:var(--faint)}
.kpi .info{position:absolute;right:16px;top:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.badge svg.ic{width:14px;height:14px}
.ok{background:var(--Abg);color:var(--Atx)}.bad{background:var(--badbg);color:var(--bad)}.mute{background:#eef2f8;color:var(--soft)}.warn{background:#fff2e5;color:var(--Mtx)}
.rk{display:flex;align-items:center;gap:10px;margin-top:12px}

}

# RAM Insight — ตรวจสอบด้วย Python (ใช้ไลบรารีมาตรฐานเท่านั้น)
# RAW_JSON = แถวต้นฉบับทุกแถวจาก Excel (Service Request ของหม้อแปลง)
# ใช้เฉพาะงาน [CM] · เวลาซ่อม = Actual Start → Actual Finish · หน่วย = หม้อแปลงแต่ละลูก
import json, re, math
from datetime import datetime, timedelta
from statistics import mean
from collections import Counter, defaultdict

rows = json.loads(RAW_JSON)
EPOCH = datetime(1970, 1, 1)

def to_time(v):
    """แปลงเวลาเป็น datetime ปัดเป็นนาที: เลขซีเรียลของ Excel (นับจาก 1899-12-30) หรือข้อความวันที่"""
    if v is None or v == '':
        return None
    if isinstance(v, (int, float)):
        minutes = math.floor((v - 25569) * 1440 + 0.5)
        return EPOCH + timedelta(minutes=minutes)
    s = str(v).strip()
    m = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$', s)
    if m:
        d = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
    else:
        m = re.match(r'^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$', s)
        if m:
            y = int(m[3])
            if len(m[3]) == 2:            # ปี 2 หลัก: <= 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
                y = 2000 + y if y <= 50 else 2500 + y
            if y > 2400:
                y -= 543
            d = datetime(y, int(m[2]), int(m[1]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
        elif re.match(r'^\d+(\.\d+)?$', s):
            return to_time(float(s))
        else:
            return None
    return EPOCH + timedelta(minutes=math.floor((d - EPOCH).total_seconds() / 60 + 0.5))

def hours(a, b):
    return (b - a).total_seconds() / 3600

def is_pm(r):
    s = str(r.get('summary') or '').strip()
    if re.match(r'^\[\s*PM\s*\]', s, re.I):
        return True
    if re.match(r'^\[\s*CM\s*\]', s, re.I):
        return False
    return str(r.get('prio')).strip() == '4'

def unit_of(r):
    m = re.search(r'\(([^)]+)\)', str(r.get('loc') or ''))
    if m:
        return m[1].strip()
    m = re.search(r'\b([A-Z]{1,6}-?TR\.?\s*\d+)\b', str(r.get('summary') or ''), re.I)
    if m:
        return re.sub(r'\s+', '', m[1].upper())
    return str(r.get('loc') or '').strip()

def prefix(code):
    m = re.match(r'^([A-Za-z]+)', str(code or '').strip())
    return m[1].upper() if m else ''

# ---------- ① ตัดงาน PM + ตัดแถวซ้ำ + ตรวจคุณภาพ ----------
pm = sum(1 for r in rows if is_pm(r))
seen, uniq = set(), []
for r in rows:
    if is_pm(r):
        continue
    f, t = to_time(r.get('start')), to_time(r.get('finish'))
    sr = str(r.get('sr') or '').strip()
    key = ('SR', sr) if sr else (r.get('loc'), f or ('x', str(r.get('start'))), t or ('x', str(r.get('finish'))))
    if key not in seen:
        seen.add(key)
        uniq.append({'r': r, 'f': f, 't': t})
missing = reversed_ = zero = too_long = 0
good = []
for u in uniq:
    if u['f'] is None or u['t'] is None:
        missing += 1
    elif u['t'] == u['f']:      # เริ่ม = เสร็จ: ไม่ตัดทิ้ง นับเป็นซ่อม 0 นาทีตามที่กรอก
        zero += 1
        good.append(u)
    elif u['t'] < u['f']:
        reversed_ += 1
    elif hours(u['f'], u['t']) > 8760:
        too_long += 1
    else:
        good.append(u)

events = []
for u in good:
    r = u['r']; unit = unit_of(r) or '(ไม่ระบุหม้อแปลง)'
    events.append({'unit': unit, 'stn': prefix(unit) or '?', 'from': u['f'], 'to': u['t'], 'dur': hours(u['f'], u['t']),
                   'prob': str(r.get('prob') or '').strip(), 'cause': str(r.get('cause') or '').strip(),
                   'prio': str(r.get('prio')).strip(), 'zero': u['t'] == u['f']})

# ---------- ② สูตร R ตามเครื่องมือคำนวณของหน่วยงาน (Weibull / Exponential) ----------
def wb_fit(t):
    s = sorted(t); n = len(s)
    X = [math.log(v) for v in s]
    Y = [math.log(-math.log(1 - (i + 1 - 0.3) / (n + 0.4))) for i in range(n)]
    mx = sum(X) / n; my = sum(Y) / n
    sxx = sum((x - mx) ** 2 for x in X); sxy = sum((x - mx) * (y - my) for x, y in zip(X, Y))
    if sxx == 0:
        return None
    b = sxy / sxx; a = my - b * mx; eta = math.exp(-a / b)
    return {'beta': b, 'eta': eta, 'mtbf': eta * math.gamma(1 + 1 / b)}

def rel_model(gaps):
    n = len(gaps)
    mtbf_e = sum(gaps) / n if n else None
    if n < 3:
        return {'ok': False, 'n': n, 'mtbf': mtbf_e, 'rec': None, 'w': None, 'mtbf_e': mtbf_e}
    w = wb_fit(gaps)
    # ตัวเลขหลักใช้ Exponential (MTBF = ค่าเฉลี่ยของ TBF) · Weibull (β, η) เป็นข้อมูลเสริม
    return {'ok': True, 'n': n, 'mtbf_e': mtbf_e, 'w': w, 'rec': 'exp', 'mtbf': mtbf_e}

def rel_R(m, t):
    if not m['ok']:
        return None
    if m['rec'] == 'wb':
        return math.exp(-(t / m['w']['eta']) ** m['w']['beta'])
    return math.exp(-t / m['mtbf_e'])

# ---------- ③ สูตร: หน่วย = สถานี + รหัสหม้อแปลง ----------
def top(counter):
    items = sorted(((k or 'ไม่ระบุ', n) for k, n in counter.items()), key=lambda x: (-x[1], x[0]))
    return f'{items[0][0]} {items[0][1]}' if items else '– 0'

def analyse(evs):
    by_unit = defaultdict(list)
    for e in evs:
        by_unit[(e['stn'], e['unit'])].append(e)
    units, ev_mtbf, ev_A, all_gaps = [], [], [], []
    for (stn, unit), es in by_unit.items():
        es.sort(key=lambda e: e['from'])
        gaps = []
        for i in range(1, len(es)):
            g = hours(es[i - 1]['to'], es[i]['from'])
            if g > 0:
                gaps.append(g)
        all_gaps += gaps
        mttr = mean(e['dur'] for e in es)
        mtbf = rel_model(gaps)['mtbf'] if gaps else None
        if mtbf is not None:
            for e in es:
                ev_mtbf.append(mtbf)
                ev_A.append(mtbf / (mtbf + e['dur']) * 100)
        units.append({'unit': unit, 'stn': stn, 'n': len(es), 'ngaps': len(gaps), 'mtbf': mtbf, 'mttr': mttr,
                      'A': (mtbf / (mtbf + mttr) * 100) if mtbf is not None else None})
    units.sort(key=lambda u: (-u['n'], u['A'] if u['A'] is not None else 999, u['unit']))
    agg = rel_model(all_gaps)
    r_year = rel_R(agg, 8760)
    return {
        'beta': agg['w']['beta'] if agg['w'] else None,
        'eta': agg['w']['eta'] if agg['w'] else None,
        'rec': ('Weibull' if agg['rec'] == 'wb' else 'Exponential') if agg['ok'] else '–',
        'mtbf_rep': agg['mtbf'],
        'R_year': r_year * 100 if r_year is not None else None,
        'n': len(evs),
        'units_n': len(units),
        'mtbf_days': agg['mtbf'] / 24 if all_gaps else None,
        'pooled_days': mean(all_gaps) / 24 if all_gaps else None,
        'mttr': mean(e['dur'] for e in evs) if evs else None,
        'A': mean(ev_A) if ev_A else None,
        'top_prob': top(Counter(e['prob'] for e in evs)),
        'top_cause': top(Counter(e['cause'] for e in evs)),
        'p1': sum(1 for e in evs if e['prio'] == '1'),
        'zero': sum(1 for e in evs if e['zero']),
        'units': units,
    }

T = analyse(events)
by_stn = {s: analyse([e for e in events if e['stn'] == s]) for s in sorted({e['stn'] for e in events})}

}, ensure_ascii=False)

let MODEL = null;
const S = {

             fix:'mttr', fixVal:'', tR:'', tM:'', tCalc:'', rc:{ tab:'mtbf', method:'', R:'90', res:null }, gMethod:'', mMethod:'', gSub:'improve', bT:'', sMtbf:null, sMttr:null, sView:'month', cost:20000, asset:30000000 };
}

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fin = v => typeof v === 'number' && isFinite(v);
function fmt(v, d = 1){ return fin(v) ? v.toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d }) : '–'; }
const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : NaN;

/* ---------- สูตร R ตามเครื่องมือคำนวณค่า R (Weibull / Exponential) ที่ได้รับจากหน่วยงาน ----------
   คงสูตรตามไฟล์ต้นฉบับ: TBF = Actual Start ครั้งถัดไป − Actual Finish ครั้งก่อน (> 0)
   Exponential: MTBF = ΣTBF ÷ n · R(t) = e^(−t/MTBF) · t ตามเป้า = −MTBF·ln(R)
   Weibull 2 พารามิเตอร์ (Median Rank Regression): F = (i − 0.3)/(n + 0.4) (Bernard) · regression y = ln(−ln(1−F)) บน x = ln(t)
     β = slope · η = exp(−b/β) · MTBF = η·Γ(1+1/β) · R(t) = exp(−(t/η)^β) · t ตามเป้า = η·(−ln R)^(1/β)
   เลือกวิธี: n < 10 หรือ 0.9 ≤ β ≤ 1.1 → Exponential · นอกนั้น → Weibull · n < 3 คำนวณไม่ได้ */
function gammaFn(z){
  const g = 7, c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if(z < 0.5) return Math.PI / (Math.sin(Math.PI * z) * gammaFn(1 - z));
  z -= 1; let x = c[0]; const t = z + g + 0.5;
  for(let i = 1; i < g + 2; i++) x += c[i] / (z + i);
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}
function wbFit(t){
  const s = t.slice().sort((a, b) => a - b), n = s.length, X = [], Y = [];
  for(let i = 0; i < n; i++){ const F = (i + 1 - 0.3) / (n + 0.4); X.push(Math.log(s[i])); Y.push(Math.log(-Math.log(1 - F))); }
  const mx = X.reduce((a, b) => a + b, 0) / n, my = Y.reduce((a, b) => a + b, 0) / n; let sxx = 0, sxy = 0, syy = 0;
  for(let i = 0; i < n; i++){ sxx += (X[i] - mx) * (X[i] - mx); sxy += (X[i] - mx) * (Y[i] - my); syy += (Y[i] - my) * (Y[i] - my); }
  if(sxx === 0) return null;
  const b = sxy / sxx, a = my - b * mx;
  return { beta: b, eta: Math.exp(-a / b), r2: syy ? sxy * sxy / (sxx * syy) : 1, mtbf: Math.exp(-a / b) * gammaFn(1 + 1 / b) };
}
const wbModeTxt = b => b < 0.95 ? 'β < 1: เสียช่วงต้น (infant mortality)' : b > 1.05 ? 'β > 1: เสียจากการสึกหรอ (wear-out)' : 'β ≈ 1: เสียแบบสุ่ม (เหมาะกับ Exponential)';
function relModel(gaps){
  const n = gaps.length, mtbfE = n ? gaps.reduce((a, b) => a + b, 0) / n : NaN;
  if(n < 3) return { ok:false, n, mtbfE, mtbf: mtbfE, why:`มีค่า TBF ${n} ค่า (น้อยกว่า 3) คำนวณ R ไม่ได้` };
  const w = wbFit(gaps); let rec, why;
  if(!w){ rec = 'exp'; why = 'ข้อมูลไม่พอสำหรับ Weibull'; }
  else if(n < 10){ rec = 'exp'; why = `มีค่า TBF เพียง ${n} ค่า (น้อยกว่า 10) ค่า β ของ Weibull จึงยังไม่เสถียร`; }
  else if(w.beta >= 0.9 && w.beta <= 1.1){ rec = 'exp'; why = `β = ${fmt(w.beta, 2)} ใกล้ 1 แสดงว่าอัตราการเสียค่อนข้างคงที่ (เสียแบบสุ่ม)`; }
  else if(w.beta > 1.1){ rec = 'wb'; why = `β = ${fmt(w.beta, 2)} มากกว่า 1 แสดงว่าเสียมากขึ้นตามอายุ (สึกหรอ)`; }
  else { rec = 'wb'; why = `β = ${fmt(w.beta, 2)} น้อยกว่า 1 แสดงว่าเสียมากในช่วงต้นของอายุ`; }
  /* ตัวเลขหลักทั้งเว็บใช้ Exponential (MTBF = ค่าเฉลี่ยของ TBF) ตามระเบียบวิธีของโครงงาน · Weibull เก็บเป็นข้อมูลเสริม (recW) */
  const note = rec === 'wb' ? `ข้อมูลเสริมจาก Weibull: ${why}` : why;
  return { ok:true, n, mtbfE, w, rec:'exp', recW: rec, why: `ตัวเลขหลักใช้ Exponential (ค่าเฉลี่ยของ TBF) · ${note}`, mode: w ? wbModeTxt(w.beta) : '', mtbf: mtbfE };
}
const recName = m => m && m.ok ? (m.rec === 'wb' ? 'Weibull' : 'Exponential') : '–';
/* M(t): แบบจำลองเวลาซ่อม (TTR) · กฎเลือกเหมือน R: n < 10 → Exponential · 0.9 ≤ β ≤ 1.1 → Exponential · อื่น ๆ → Weibull (ติดป้ายแนะนำเท่านั้น) */
function mttrModel(durs){
  const all = durs.filter(fin), n0 = all.length, mttrE = n0 ? all.reduce((a, b) => a + b, 0) / n0 : NaN, d = all.filter(x => x > 0), n = d.length;
  if(!(mttrE > 0)) return { ok:false, n, mttrE, w:null, rec:'exp', why:'ไม่มีเวลาซ่อม' };
  const w = n >= 3 ? wbFit(d) : null; let rec = 'exp', why;
  if(!w) why = `มีเวลาซ่อมที่เป็นบวก ${n} ค่า (น้อยกว่า 3) จึงใช้ Exponential`;
  else if(n < 10) why = `มีเวลาซ่อมเพียง ${n} ค่า (น้อยกว่า 10) ค่า β ของ Weibull ยังไม่เสถียร`;
  else if(w.beta >= 0.9 && w.beta <= 1.1) why = `β = ${fmt(w.beta, 2)} ใกล้ 1 เวลาซ่อมกระจายแบบสุ่ม`;
  else { rec = 'wb'; why = `β = ${fmt(w.beta, 2)} ${w.beta > 1.1 ? 'มากกว่า 1 งานซ่อมส่วนใหญ่ใช้เวลาใกล้ค่ากลาง ไม่ได้กระจายแบบสุ่ม' : 'น้อยกว่า 1 งานส่วนใหญ่เสร็จเร็วแต่มีบางงานที่ใช้เวลานานมาก'}`; }
  return { ok:true, n, mttrE, w, rec, why };
}
/* ฟังก์ชัน M(t) ตามวิธีที่เลือก (B.mmeth) · mttr (ถ้ามี): Weibull คง β แล้วปรับ η = MTTR ÷ Γ(1+1/β) · ไม่ใส่ = ใช้ η ที่ fit จากข้อมูลจริง */
function mEta(B, mttr){ const w = B.tt && B.tt.w; return fin(mttr) && Math.abs(mttr - B.mttr) > 1e-9 ? mttr / gammaFn(1 + 1 / w.beta) : w.eta; }
function mFwd(B, T, mttr){ // → % ซ่อมเสร็จภายใน T ชม.
  if(B.mmeth === 'wb' && B.tt && B.tt.w) return (1 - Math.exp(-Math.pow(T / mEta(B, mttr), B.tt.w.beta))) * 100;
  return (1 - Math.exp(-T / (fin(mttr) ? mttr : B.mttr))) * 100; }
function mInv(B, M, mttr){ // M% → เวลาซ่อม t (ชม.)
  if(M <= 0) return 0; const L = -Math.log(1 - M / 100);
  if(B.mmeth === 'wb' && B.tt && B.tt.w) return mEta(B, mttr) * Math.pow(L, 1 / B.tt.w.beta);
  return (fin(mttr) ? mttr : B.mttr) * L; }
function mLim(B, T, M){ // MTTR สูงสุดที่ทำให้ M(T) = M
  if(M <= 0) return Infinity; const L = -Math.log(1 - M / 100);
  if(B.mmeth === 'wb' && B.tt && B.tt.w) return T / Math.pow(L, 1 / B.tt.w.beta) * gammaFn(1 + 1 / B.tt.w.beta);
  return T / L; }
/* R (โอกาสไม่เสีย, 0–1) ที่เวลา t ตามวิธีที่เลือก · mtbf ใหม่ (ถ้ามี): Weibull คง β แล้วปรับ η = MTBF ÷ Γ(1+1/β) */
function relR(m, t, mtbf){
  if(!m || !m.ok) return NaN;
  if(m.rec === 'wb'){ const eta = fin(mtbf) ? mtbf / gammaFn(1 + 1 / m.w.beta) : m.w.eta; return Math.exp(-Math.pow(t / eta, m.w.beta)); }
  return Math.exp(-t / (fin(mtbf) ? mtbf : m.mtbfE));
}
const relRE = (m, t) => m && m.ok ? Math.exp(-t / m.mtbfE) : NaN;
const relRW = (m, t) => m && m.ok && m.w ? Math.exp(-Math.pow(t / m.w.eta, m.w.beta)) : NaN;
const relTE = (m, r) => m && m.ok ? -m.mtbfE * Math.log(r) : NaN;
const relTW = (m, r) => m && m.ok && m.w ? m.w.eta * Math.pow(-Math.log(r), 1 / m.w.beta) : NaN;
/* สูตร R ที่ใช้ (HTML) พร้อมตัวเลขแทนค่า */
function relFormula(m, t){
  if(!m || !m.ok) return 'R คำนวณไม่ได้ (TBF น้อยกว่า 3 ค่า)';
  const T = Number(t).toLocaleString('en-US');
  return m.rec === 'wb' ? `Weibull: R = e<sup>−(${T}/${fmt(m.w.eta, 1)})<sup>${fmt(m.w.beta, 3)}</sup></sup> × 100`
    : `Exponential: R = e<sup>−(${T}/${fmt(m.mtbfE, 1)})</sup> × 100`;
}
const ic = (n, st = '') => `<svg class="ic" ${st ? `style="${st}"` : ''}><use href="#i-${n}"/></svg>`;
const info = k => `<button class="info" type="button" data-info="${k}" aria-label="คำอธิบาย">i</button>`;
const pad = n => String(n).padStart(2, '0');
function fmtDate(ms){ if(!fin(ms)) return '–'; const d = new Date(ms); return `${pad(d.getUTCDate())}/${pad(d.getUTCMonth()+1)}/${d.getUTCFullYear()+543}`; }
function fmtTime(ms){ if(!fin(ms)) return '–'; const d = new Date(ms); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; }
function fmtDT(ms){ return fin(ms) ? fmtDate(ms) + ' ' + fmtTime(ms) : '–'; }
function monLabel(ym){ const [y, m] = ym.split('-').map(Number); return TH_MON[m-1] + ' ' + ((y + 543) % 100); }
function qLabel(yq){ const [y, q] = yq.split('-Q').map(Number); return `ไตรมาส ${q}/${(y + 543) % 100}`; }
const yLabel = y => 'ปี ' + (+y + 543);
/* สถานีที่แสดง = รหัสที่พบในข้อมูล + สถานีที่แอดมินเพิ่มเอง (เรียงตามลำดับในตั้งค่า) */
function stationCodes(){
  const set = new Set((MODEL ? MODEL.events : []).map(e => e.stn));
  SETTINGS.stations.forEach(st => { if(st.added) set.add(st.code); });
  const ord = c => { const i = SETTINGS.stations.findIndex(x => x.code === c); return i < 0 ? 999 : i; };

}

/* ---------------- time parsing (เวลาแบบ wall-clock เก็บเป็น UTC ms, ปัดเป็นนาที) ---------------- */
function toMs(v){
  if(v === null || v === undefined || v === '') return NaN;
  let ms = NaN;
  if(typeof v === 'number') ms = (v - 25569) * 86400000;                 // Excel serial (นับจาก 1899-12-30)
  else if(v instanceof Date) ms = Date.UTC(v.getFullYear(), v.getMonth(), v.getDate(), v.getHours(), v.getMinutes(), v.getSeconds());
  else {
    const s = String(v).trim(); let m;
    if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$/)))
      ms = Date.UTC(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    else if((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$/))){
      let y = +m[3];
      if(m[3].length === 2) y = y <= 50 ? 2000 + y : 2500 + y;   // ปี 2 หลัก: ≤ 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
      if(y > 2400) y -= 543;
      ms = Date.UTC(y, +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0), +(m[6]||0));
    } else if(/^\d+(\.\d+)?$/.test(s)) ms = (parseFloat(s) - 25569) * 86400000;
  }
  return fin(ms) ? Math.round(ms / 60000) * 60000 : NaN;
}
const msToSerial = ms => ms / 86400000 + 25569;
const rowTimes = r => [toMs(r.start), toMs(r.finish)];
const rowKey = r => { const sr = String(r.sr || '').trim(); if(sr) return 'SR|' + sr; const [f, t] = rowTimes(r); return [r.loc, fin(f) ? f : 'x' + r.start, fin(t) ? t : 'x' + r.finish].join('|'); };
/* งาน PM: Summary ขึ้นต้นด้วย [PM] (ถ้าไม่มีป้าย [CM]/[PM] ดู Priority 4 = งานตามแผน) */
function isPM(r){
  const s = String(r.summary || '').trim();
  if(/^\[\s*PM\s*\]/i.test(s)) return true;
  if(/^\[\s*CM\s*\]/i.test(s)) return false;
  return String(r.prio).trim() === '4';
}
/* รหัสหม้อแปลง: ในวงเล็บของสถานที่ติดตั้ง เช่น "คอต่อ (KO-TR.1)" → KO-TR.1 · ถ้าไม่มี หาจาก Summary */
function unitOf(r){
  let m = String(r.loc || '').match(/\(([^)]+)\)/); if(m) return m[1].trim();
  m = String(r.summary || '').match(/\b([A-Z]{1,6}-?TR\.?\s*\d+)\b/i); if(m) return m[1].toUpperCase().replace(/\s+/g, '');
  return String(r.loc || '').trim();
}
const locName = r => String(r.loc || '').replace(/\([^)]*\)/, '').trim();

/* ---------------- Excel reading ---------------- */
function normKey(k){ return String(k).trim().toLowerCase().replace(/[\s.]+/g, '_'); }
const KEY_ALIAS = { service_request:'sr', sr:'sr', summary:'summary', 'สถานที่ติดตั้ง':'loc', location:'loc', failure_code:'fail', problem_code:'prob', cause:'cause', cause_code:'cause',
  priority:'prio', actual_start:'start', actual_finish:'finish', work_center:'wc', status:'status', reported:'reported', reported_date:'reported', reported_by:'by' };
/* หาแถวหัวตาราง: แถวแรก (ใน 15 แถวแรก) ที่มีคอลัมน์ที่รู้จักอย่างน้อย 3 คอลัมน์ รองรับไฟล์ที่มีชื่อฟอร์ม/หัวกระดาษอยู่ด้านบน */
const colKey = k => { const nk = normKey(k); return KEY_ALIAS[nk] || nk; };
function headerRow(wb, name){
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'', raw:true, blankrows:true });
  for(let i = 0; i < Math.min(15, aoa.length); i++){ if(aoa[i].filter(k => FIELDS.includes(colKey(k))).length >= 3) return { idx: i, cols: aoa[i].map(colKey).filter(k => FIELDS.includes(k)) }; }
  return { idx: 0, cols: (aoa[0] || []).map(colKey).filter(k => FIELDS.includes(k)) };
}
function sheetCols(wb, name){ return headerRow(wb, name).cols; }
function sheetRows(wb, name){
  const h = headerRow(wb, name);
  const json = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:'', raw:true, range: h.idx });
  return json.map(r => {
    const o = { sheet: name };
    Object.keys(r).forEach(k => { const nk = colKey(k); if(FIELDS.includes(nk) && !(nk in o)) o[nk] = r[k]; });
    FIELDS.forEach(f => { if(!(f in o)) o[f] = ''; });
    ['sr','summary','loc','fail','prob','cause','wc','status','by'].forEach(f => { if(typeof o[f] === 'string') o[f] = o[f].trim(); });
    return o;
  }).filter(o => o.sr || o.loc || o.summary);
}

/* ---------------- cleaning + model ---------------- */
function prefixOf(code){ const m = String(code || '').trim().match(/^([A-Za-z]+)/); return m ? m[1].toUpperCase() : ''; }
function buildModel(rawRows){
  const sheetCount = {}; rawRows.forEach(r => { sheetCount[r.sheet] = (sheetCount[r.sheet] || 0) + 1; });
  // 1) ตัดแถวซ้ำ: เลข Service Request เดียวกัน (ถ้าไม่มีเลข ใช้สถานที่ + เวลาเริ่ม + เวลาเสร็จ)
  const map = new Map(), order = [];
  let pm = 0;
  rawRows.forEach(r => {
    if(isPM(r)){ pm++; return; }                                       // งาน PM ไม่นำมาคำนวณ (ปกติตัดไปแล้วตอนอัปโหลด)
    const key = rowKey(r), [f, t] = rowTimes(r);
    if(!map.has(key)){ map.set(key, { r, f, t }); order.push(key); }
  });
  const uniq = order.map(k => map.get(k));
  const ex = { missing:0, reversed:0, zero:0, long:0 }, exSample = { missing:[], reversed:[], zero:[], long:[] };
  const good = [];
  const bad = (k, u) => { ex[k]++; if(exSample[k].length < 3) exSample[k].push(u.r); };
  uniq.forEach(u => {
    if(!fin(u.f) || !fin(u.t)){ bad('missing', u); return; }          // 2) ไม่มีเวลาเริ่มหรือเวลาเสร็จ
    if(u.t === u.f){ ex.zero++; if(exSample.zero.length < 3) exSample.zero.push(u.r); u.zero = true; good.push(u); return; } // start = finish: เก็บไว้ (ซ่อม 0 นาทีตามที่กรอก) + ติดธง
    if(u.t < u.f){ bad('reversed', u); return; }                       // 3) เสร็จก่อนเริ่ม
    if((u.t - u.f) / 3600000 > 8760){ bad('long', u); return; }        // 4) ซ่อมเกิน 1 ปี
    good.push(u);
  });
  const stnNames = {};
  const events = []; let id = 0;
  good.forEach(u => {
    const r = u.r, dur = (u.t - u.f) / 3600000, unit = unitOf(r) || '(ไม่ระบุหม้อแปลง)', stn = prefixOf(unit) || '?';
    if(!stnNames[stn] && locName(r)) stnNames[stn] = locName(r);
    events.push({ id: 'e' + (id++), grp:'T', unit, stn, from: u.f, to: u.t, dur, cause: r.cause || '', comp: r.prob || '', prio: r.prio === '' ? '' : +r.prio || r.prio,
      sr: r.sr || '', sheet: '', raw: r, rawRows: [r], q: u.zero ? 1 : 0 });
  });
  events.sort((a, b) => a.from - b.from);
  events.forEach(e => { const d = new Date(e.from); e.ym = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); e.yq = d.getUTCFullYear() + '-Q' + (Math.floor(d.getUTCMonth() / 3) + 1); e.yy = String(d.getUTCFullYear()); e.sheet = e.yy; });
  const years = [...new Set(events.map(e => e.yy))].sort();
  return { rawCount: rawRows.length, pm, uniqCount: uniq.length, dupes: rawRows.length - pm - uniq.length, rowsT: good.length, ex, exSample, events, sheets: years, stnNames };
}

/* สูตร: จัดกลุ่มตาม สถานี + รหัสหม้อแปลง, ช่วงห่างของแต่ละเหตุ = เริ่ม(i) − เสร็จ(i−1) (> 0) */
/* ชั่วโมงในช่วงที่เลือก: ตั้งแต่ปีแรกถึงปีสุดท้ายของเหตุชุดนี้ ตัดให้อยู่ในช่วงข้อมูลจริง (เดือนแรก–เดือนสุดท้ายของข้อมูล) */
function spanHours(evs){
  if(!evs.length || !MODEL || !MODEL.events.length) return NaN;
  let a = Infinity, b = -Infinity; MODEL.events.forEach(e => { if(e.from < a) a = e.from; if(e.to > b) b = e.to; });
  const d0 = new Date(a), d1 = new Date(b), ds = new Date(d0.getFullYear(), d0.getMonth(), 1).getTime(), de = new Date(d1.getFullYear(), d1.getMonth() + 1, 1).getTime();
  let y0 = Infinity, y1 = -Infinity; evs.forEach(e => { const y = new Date(e.from).getFullYear(); if(y < y0) y0 = y; if(y > y1) y1 = y; });
  const s = Math.max(new Date(y0, 0, 1).getTime(), ds), en = Math.min(new Date(y1 + 1, 0, 1).getTime(), de);
  return en > s ? (en - s) / 3600000 : NaN;
}
function computeUnits(evs){
  const g = new Map(), H = spanHours(evs);
  evs.forEach(e => { const k = e.grp + '|' + e.stn + '|' + e.unit; if(!g.has(k)) g.set(k, []); g.get(k).push(e); });
  const units = [], per = new Map();
  g.forEach((arr, k) => {
    arr.sort((a, b) => a.from - b.from);
    const gaps = [];
    arr.forEach((e, i) => {
      let gap = NaN;
      if(i > 0){ const gp = (e.from - arr[i-1].to) / 3600000; if(gp > 0){ gap = gp; gaps.push(gp); } }
      per.set(e.id, { gap, first: i === 0 });
    });
    let model = relModel(gaps), mtbf = gaps.length ? model.mtbf : NaN, fb = '';
    const mttr = mean(arr.map(e => e.dur)), dt = arr.reduce((s, e) => s + e.dur, 0);
    let A = fin(mtbf) ? mtbf / (mtbf + mttr) * 100 : NaN;
    // สูตรสำรอง (ไม่ให้ขึ้น "–"): เหตุไม่ถึง 2 ครั้ง → MTBF = ชั่วโมงในช่วงที่เลือก ÷ จำนวนเหตุ · A = (ชั่วโมงในช่วง − Downtime) ÷ ชั่วโมงในช่วง
    if(!fin(mtbf) && fin(H) && H > 0){ mtbf = H / arr.length; A = Math.max(0, (H - dt) / H * 100); fb = 'span'; }
    // TBF ไม่ถึง 3 ค่า → R ใช้ Exponential e^(−t/MTBF) จาก MTBF ข้างบน

    arr.forEach(e => { const p = per.get(e.id); p.mtbf = mtbf; p.A = fb === 'span' ? A : fin(mtbf) ? mtbf / (mtbf + e.dur) * 100 : NaN; });
    units.push({ key:k, unit: arr[0].unit, stn: arr[0].stn, grp: arr[0].grp, events: arr, n: arr.length, mtbf, mttr, A, gaps, model, fb, spanH: H });
  });

}
function stats(evs){
  const { units, per } = computeUnits(evs);

  const comp = {}, cause = {}, prio = {};
  evs.forEach(e => { const c = compLabel(e.comp); comp[c] = (comp[c] || 0) + 1; const k = causeLabel(e.cause); cause[k] = (cause[k] || 0) + 1; const p = prioLabel(e.prio); prio[p] = (prio[p] || 0) + 1; });

  if(!model.ok && fin(mtbfH)) model = { ok:true, n: gaps.length, mtbfE: mtbfH, mtbf: mtbfH, w:null, rec:'exp', why:`มีค่า TBF ${gaps.length} ค่า (น้อยกว่า 3) จึงใช้ Exponential e^(−t/MTBF)`, mode:'', fb: true };

}

  ramcard:['R / A / M ของขอบเขตที่เลือก','<b>R (Reliability)</b> โอกาสที่หม้อแปลงจะไม่เสียเลยตลอดช่วง t (ยิ่งสูงยิ่งดี) ตามเครื่องมือคำนวณของหน่วยงาน<br>· Exponential: R = e<sup>−(t/MTBF)</sup> · Weibull: R = e<sup>−(t/η)<sup>β</sup></sup><br>· ระบบเลือกวิธีเอง: TBF น้อยกว่า 10 ค่า หรือ β อยู่ระหว่าง 0.9–1.1 ใช้ Exponential นอกนั้นใช้ Weibull · TBF น้อยกว่า 3 ค่าคำนวณไม่ได้<br><b>M (Maintainability)</b> = (1 − e<sup>−(t/MTTR)</sup>) × 100 โอกาสที่ซ่อมเสร็จภายในเวลา t<br><b>A (Availability)</b> = ค่าเดียวกับการ์ด Availability เฉลี่ย (เฉลี่ยทีละเหตุจาก MTBF ÷ (MTBF + MTTR))<br>MTBF และ MTTR ใช้ค่าเฉลี่ยในการ์ดด้านบน<br><b>รายเดือน</b>: t = 720 ชม. (R) และ 12 ชม. (M)<br><b>รายปี</b>: R = <b>สัดส่วนเดือนที่ไม่มีเหตุ [CM] เลย</b> นับจากข้อมูลจริง (เลือกปีเดียว = 12 เดือนของปีนั้น · ทุกปี = ตั้งแต่เดือนแรกถึงเดือนสุดท้ายของข้อมูล) แล้วเฉลี่ยต่อหม้อแปลง 1 ลูก · M ใช้ t = 24 ชม.<br>R รายปีแบบนี้ไม่ได้ใช้สูตร e<sup>−t/MTBF</sup> เพราะสูตรที่ t = 8,760 ชม. ให้ค่าต่ำมาก (โอกาสไม่เสียเลยทั้งปี) · หน้าวางแผนเป้าหมายยังใช้สูตรเดิมทั้งรายเดือนและรายปี<br>ปุ่มรายเดือน/รายปีนี้ใช้กับการ์ดสถานะหม้อแปลงรายลูกด้านล่างด้วย · คลิกการ์ดเพื่อดูค่า R/A/M ของหม้อแปลงแต่ละลูก'],

/* ---------------- modal ---------------- */
function openModal(title, body, foot = '', wide = false){
  const m = $('modal');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = `<div class="mh"><h3>${title}</h3><button class="xbtn" data-close aria-label="ปิด">${ic('x')}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}`;
  $('ovl').classList.add('open');
  return m;
}
function closeModal(){ $('ovl').classList.remove('open'); $('modal').innerHTML = ''; }
$('ovl').addEventListener('click', e => { if(e.target.id === 'ovl' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('ovl').classList.contains('open')) closeModal(); });
document.addEventListener('click', e => {
  const gt = e.target.closest('[data-gto]'); if(gt){ const t = $(gt.dataset.gto); if(t) t.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  const b = e.target.closest('[data-info]'); if(!b) return;
  const it = INFO[b.dataset.info]; if(it) openModal(it[0], `<div style="line-height:1.75">${it[1]}</div>`);
});

function gaugeSvg(v, tgt){
  const lo = Math.min(90, Math.floor(Math.min(fin(v) ? v : 90, tgt) / 10) * 10), hi = 100, cx = 150, cy = 135, r = 100;
  const ang = x => Math.PI * (1 - Math.min(1, Math.max(0, (x - lo) / (hi - lo)))), pt = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  let s = ''; const N = 40;
  for(let i = 0; i < N; i++){
    const a0 = Math.PI * (1 - i / N), a1 = Math.PI * (1 - (i + 1) / N), x = lo + (hi - lo) * (i + .5) / N, t = Math.max(0, Math.min(1, (x - lo) / Math.max(.001, tgt - lo)));
    const c = x >= tgt ? '#3a9a66' : `rgb(${Math.round(200 - t * 20)},${Math.round(110 + t * 60)},90)`;
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1 + .004, r);
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${c}" stroke-width="20" fill="none"/>`;
  }
  [[lo, Math.PI], [hi, 0]].forEach(([l, a]) => { const [x, y] = pt(a, r + 30); s += `<text x="${x}" y="${y + 4}" font-size="12" fill="#8a96ad" text-anchor="middle">${l}%</text>`; });
  const [t0x, t0y] = pt(ang(tgt), r - 16), [t1x, t1y] = pt(ang(tgt), r + 16), [tlx, tly] = pt(ang(tgt), r + 28);
  s += `<line x1="${t0x}" y1="${t0y}" x2="${t1x}" y2="${t1y}" stroke="#14213d" stroke-width="3"/><text x="${tlx}" y="${tly}" font-size="12" fill="#14213d" text-anchor="middle" font-weight="600">${tgt}%</text>`;
  if(fin(v)){ const [nx, ny] = pt(ang(v), r - 18); s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#0b2160" stroke-width="4" stroke-linecap="round"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="8" fill="#0b2160"/>`;
  return `<svg viewBox="0 0 300 150" width="100%" style="max-width:320px" role="img" aria-label="Availability ${fmt(v, 2)}%">${s}</svg>`;
}

const MIX_COL = ['#2563eb', '#e07a1f', '#2e8b57', '#7c4dbd', '#d0544c', '#1c9aa8', '#b58a1b', '#5d6b86', '#c2477f', '#4f7a28', '#8a96ad', '#3d5a99'];
function donutSvg(arr, T){
  let a = -Math.PI / 2, s = ''; const r = 78, cx = 95, cy = 95;
  arr.forEach(([k, v], i) => {
    if(!v) return; const c = MIX_COL[i % MIX_COL.length];
    const frac = v / T, b = a + 2 * Math.PI * frac;
    if(frac >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></circle>`;
    else { const l = (b - a) > Math.PI ? 1 : 0, gap = Math.min(.012, (b - a) / 4);
      s += `<path d="M${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}A${r} ${r} 0 ${l} 1 ${(cx + r * Math.cos(b - gap)).toFixed(2)} ${(cy + r * Math.sin(b - gap)).toFixed(2)}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></path>`; }
    a = b;
  });
  return `<svg width="190" height="190" viewBox="0 0 190 190">${s}<text x="95" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#14213d">${T}</text><text x="95" y="118" text-anchor="middle" font-size="12.5" fill="#5d6b86">เหตุทั้งหมด</text></svg>`;

/* R รายปีที่หน้าหลัก = สัดส่วนเดือนที่ไม่มีเหตุ [CM] เลย (นับจากข้อมูลจริง)
   ช่วงเดือน: เลือกปีเดียว = 12 เดือนของปีนั้น · ทุกปี = ตั้งแต่เดือนแรกถึงเดือนสุดท้ายของข้อมูลในขอบเขต */
function yearFreeR(st){
  const all = st.units.flatMap(u => u.events);
  if(!all.length) return { avg: NaN, total: 0, per: new Map() };
  let months = [];
  const allYm = MODEL.events.map(e => e.ym).sort(), lo = allYm[0], hi = allYm[allYm.length - 1];   // ไม่นับเดือนที่อยู่นอกช่วงข้อมูล (เช่น เดือนที่ยังมาไม่ถึง)
  if(S.sheet !== 'ALL') months = Array.from({ length: 12 }, (_, i) => S.sheet + '-' + pad(i + 1)).filter(k => k >= lo && k <= hi);
  else { const ys = all.map(e => e.ym).sort(); let [y, m] = ys[0].split('-').map(Number); const [y1, m1] = ys[ys.length - 1].split('-').map(Number);
    while(y < y1 || (y === y1 && m <= m1)){ months.push(y + '-' + pad(m)); m++; if(m > 12){ m = 1; y++; } } }
  if(!months.length) return { avg: NaN, total: 0, per: new Map() };
  const per = new Map();
  st.units.forEach(u => { const hit = new Set(u.events.map(e => e.ym)), free = months.filter(k => !hit.has(k)).length; per.set(u.key, { pct: free / months.length * 100, free, total: months.length }); });
  const vals = [...per.values()];
  return { avg: mean(vals.map(v => v.pct)), freeAvg: mean(vals.map(v => v.free)), total: months.length, per };
}

/* ผลลัพธ์ของ M (MTTR / เวลาซ่อม): ต่ำกว่า 1 ชม. แสดงเป็นนาที */
const hmBig = (h, d = 2) => fin(h) && h < 1 ? [fmt(h * 60, 1), 'นาที'] : [fmt(h, d), 'ชม.'];

function planBase(){
  const P = S.plan, evs = scoped();
  const units = computeUnits(evs).units;
  const u = units.find(x => x.key === P.unit);
  if(!u) return { tt: { ok:false, n:0, w:null, rec:'exp', mttrE: DEFAULT_MTTR }, units, u:null, comps:[], mtbf: DEFAULT_MTBF, mttr: DEFAULT_MTTR, src:'ค่าเริ่มต้น', model: { ok:true, n:0, mtbfE: DEFAULT_MTBF, w:null, rec:'exp', why:'ค่าเริ่มต้น', mode:'', mtbf: DEFAULT_MTBF, fallback:true } };
  const comps = [...new Set(u.events.map(e => compLabel(e.comp)))].sort();
  if(P.comp && !comps.includes(P.comp)) P.comp = '';
  let mtbf = u.mtbf, mttr = u.mttr, src = u.unit, note = '', model = u.model;
  if(P.comp){
    const cu = computeUnits(u.events.filter(e => compLabel(e.comp) === P.comp)).units[0];
    src = u.unit + ' · ' + P.comp;
    if(cu){ mttr = cu.mttr; if(fin(cu.mtbf)){ mtbf = cu.mtbf; model = cu.model; } else { note = `ปัญหานี้มีเหตุ ${cu.n} ครั้ง คำนวณ MTBF ไม่ได้ ใช้ MTBF ของทั้งหม้อแปลง`; } }
  }
  let noMtbf = false;
  if(!fin(mtbf)){ mtbf = DEFAULT_MTBF; model = null; noMtbf = true; note = 'หม้อแปลงนี้มีเหตุครั้งเดียว คำนวณ MTBF ไม่ได้ จึงคำนวณ R และ A ไม่ได้ (คำนวณได้เฉพาะ M และ MTTR)'; }
  const raw = model;   // โมเดลตามไฟล์ต้นฉบับ (ไม่เติมค่าแทน) ใช้ในโหมดคำนวณ MTBF / เวลา t
  // TBF น้อยกว่า 3 ค่า (ไฟล์ต้นฉบับคำนวณ R ไม่ได้) → ในหน้าวางแผนใช้ Exponential จาก MTBF เพื่อให้กรอกเป้าได้
  if(!model || !model.ok){ if(model && model.n > 0) note = (note ? note + ' · ' : '') + `มี TBF ${model.n} ค่า (น้อยกว่า 3) จึงใช้ Exponential จาก MTBF`; model = { ok:true, n: model ? model.n : 0, mtbfE: mtbf, w: null, rec:'exp', why:'ข้อมูล TBF น้อยกว่า 3 ค่า', mode:'', mtbf, fallback:true }; }
  const tt = mttrModel((P.comp ? u.events.filter(e => compLabel(e.comp) === P.comp) : u.events).map(e => e.dur));
  return { units, u, comps, mtbf, mttr, src, note, model, raw, noMtbf, tt };
}

  const sts = rows.map(r => { const s0 = cmpState(r[2], r[3], r[5]); return s0 !== null && r[4](r[2]) === r[4](r[3]) ? 0 : s0; }), N = sts.slice(0, K).filter(x => x !== null).length, nUp = sts.slice(0, K).filter(x => x === 1).length;

function capYearCard(o, B){

/* ส่วนปรับค่าจำลอง: วาดตัวควบคุมครั้งเดียว ตอนเลื่อนแถบอัปเดตเฉพาะตัวเลข (เลื่อนลื่น ไม่สะดุด) */

/* =====================================================================

function rcSource(B){
  if(B.u) return { m: B.raw, src: B.src };

function paintRcalc(out){

  if(!m || !m.ok){
    out.innerHTML = `<div class="card">${head}<div class="errbox" style="margin-top:12px">ข้อมูล TBF น้อยกว่า 3 ค่า คำนวณไม่ได้ ลองเลือกหม้อแปลงอื่น ไม่เลือกชนิดปัญหา หรือขยายช่วงปี</div></div>`;

        ${stale ? '<div class="warnbox" style="margin-top:10px">ค่าที่กรอกเปลี่ยนแล้ว กด "คำนวณ" เพื่ออัปเดตผล</div>' : ''}

function paintSlideRes(B){

function paretoData(evs, by){
  const keyf = PARETO_BY[by][1], o = {};
  evs.forEach(e => { const k = keyf(e); (o[k] = o[k] || []).push(e); });
  let arr = Object.entries(o).map(([k, list]) => ({ k, n: list.length, list })).sort((a, b) => b.n - a.n || a.k.localeCompare(b.k));
  const MAX = 12;
  if(arr.length > MAX){ const rest = arr.slice(MAX - 1); arr = arr.slice(0, MAX - 1).concat([{ k: `อื่น ๆ (${rest.length} รายการ)`, n: rest.reduce((t, r) => t + r.n, 0), list: rest.flatMap(r => r.list), other: true }]); }
  const T = evs.length; let cum = 0;
  arr.forEach(a => { a.before = cum / T * 100; cum += a.n; a.cum = cum / T * 100; a.pct = a.n / T * 100; a.vital = a.before < 80 && !a.other; });
  return arr;
}

const PY_CODE = document.getElementById('pyCode').textContent.replace(/^\n/, '');
function jsValues(){
  const evs = MODEL.events, t = stats(evs);
  const topCode = key => { const o = {}; evs.forEach(e => { const k = String(e[key] || '').trim() || 'ไม่ระบุ'; o[k] = (o[k] || 0) + 1; }); const a = Object.entries(o).sort((x, y) => y[1] - x[1] || (x[0] < y[0] ? -1 : 1))[0]; return a ? a[0] + ' ' + a[1] : '– 0'; };
  const stn = {}; [...new Set(evs.map(e => e.stn))].sort().forEach(c => { const x = stats(evs.filter(e => e.stn === c)); stn[c] = { n: x.n, A: x.A, mtbf: x.mtbfH / 24 }; });
  const m = t.model;
  return { beta: m && m.w ? m.w.beta : NaN, eta: m && m.w ? m.w.eta : NaN, rec: recName(m), mtbfRep: t.mtbfH, Ry: relR(m, 8760) * 100,
    n: t.n, units: t.nUnits, mtbf: t.mtbfH / 24, pooled: t.pooledH / 24, mttr: t.mttrH, A: t.A, topProb: topCode('comp'), topCause: topCode('cause'),
    p1: evs.filter(e => +e.prio === 1).length, zero: t.nQ, stn };
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('load failed')); document.head.appendChild(s); }); }
let pyodideP = null;
async function runPython(){
  S.py = { status:'loading', result:null, err:'' }; renderPy();
  try{
    if(!pyodideP) pyodideP = (async () => { if(typeof loadPyodide === 'undefined') await loadScript(PYODIDE_URL + 'pyodide.js'); return await loadPyodide({ indexURL: PYODIDE_URL }); })();
    const py = await pyodideP.catch(e => { pyodideP = null; throw e; });
    py.globals.set('RAW_JSON', JSON.stringify(DATA.rows));
    const res = JSON.parse(py.runPython(PY_CODE));
    S.py = { status:'done', result: res, err:'' };
    audit('รันตรวจสอบด้วย Python', '');
  }catch(e){
    S.py = { status:'error', result:null, err: String(e && e.message || e) };
  }
  if(S.page === 'py') renderPy();
}

  const rd = new FileReader();

const isDefAdmin = a => a && a.name === DEF_ADMIN.name && a.h === hashPw(DEF_ADMIN.name, DEF_ADMIN.pw);

function cyrb53Legacy(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}

  const tabs = [['about','เกี่ยวกับระบบ'],['stations','จัดการสถานี'],['thr','เกณฑ์ความพร้อมใช้งาน (A)']].concat(S.admin ? [['menus','เมนูที่แสดง'],['data','จัดการข้อมูล'],['log','ประวัติการใช้งาน']] : []);
  if(!tabs.find(t => t[0] === tab)) tab = 'about';
  const m = $('modal'); m.className = 'modal wide';
  m.innerHTML = `<div class="mh"><h3>${ic('gear')} ตั้งค่า</h3><button class="xbtn" data-close aria-label="ปิด">${ic('x')}</button></div>
    <div class="stabs">${tabs.map(([k, n]) => `<button data-stab="${k}" class="${k === tab ? 'on' : ''}">${n}</button>`).join('')}</div><div class="mb" id="stBody"></div>`;
  $('ovl').classList.add('open');
  m.querySelectorAll('[data-stab]').forEach(b => b.onclick = () => openSettings(b.dataset.stab));
  const B = $('stBody');
  if(false){}
  else if(tab === 'about') B.innerHTML = `<div style="display:flex;gap:14px;align-items:center"><img src="${document.querySelector('.logo img').src}" style="height:44px" alt=""><div><b style="font-size:18px">RAM Insight</b><div class="sub">วิเคราะห์ Reliability · Availability · Maintainability ของหม้อแปลง</div></div></div>
    <p style="line-height:1.8">โครงงานสหกิจศึกษา สาขาวิศวกรรมอุตสาหการและการจัดการ มหาวิทยาลัยศรีปทุม · ข้อมูลจากรายการ Service Request งานซ่อมหม้อแปลงของสถานีไฟฟ้า${SETTINGS.stations.map(s => s.name).join(' และ ')}</p>
    <dl class="kv"><dt>เทคโนโลยี</dt><dd>HTML + CSS + JavaScript ไฟล์เดียว · Chart.js 4.4.1 · SheetJS 0.18.5 · Pyodide 0.26.4</dd>
    <dt>ที่เก็บข้อมูล</dt><dd>localStorage ของเบราว์เซอร์ (คีย์ขึ้นต้น ramsight_)</dd>
    <dt>ข้อมูลปัจจุบัน</dt><dd>${DATA.source ? esc(DATA.source) + ' · ' : ''}${(DATA.rows || []).length} แถว (งาน CM)${DATA.pmDropped ? ` · ตัดงาน PM ${DATA.pmDropped} แถว` : ''}${DATA.uploadedAt ? ' · อัปโหลด ' + new Date(DATA.uploadedAt).toLocaleString('th-TH') : ''}</dd></dl>`;
  else if(tab === 'stations'){
    const codes = stationCodes();
    const cnt = c => { const u = new Set(); let n = 0; (MODEL ? MODEL.events : []).forEach(e => { if(e.stn === c){ u.add(e.unit); n++; } }); return [u.size, n]; };
    B.innerHTML = `<div class="sub">สถานีดูจากตัวอักษรนำหน้ารหัสหม้อแปลงในวงเล็บของสถานที่ติดตั้ง (เช่น คอต่อ (KO-TR.1) → KO) ตั้งชื่อเต็มของแต่ละรหัสได้ที่นี่</div>
      <div class="tbl-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อสถานี</th><th class="n">หม้อแปลง</th><th class="n">เหตุ (CM)</th>${S.admin ? '<th></th>' : ''}</tr></thead><tbody>
      ${codes.map(c => { const [f, l] = cnt(c), st = SETTINGS.stations.find(x => x.code === c);
        return `<tr><td><b>${esc(c)}</b>${st && st.added ? ' <span class="badge mute" style="font-size:11px">เพิ่มเอง</span>' : ''}</td><td>${S.admin ? `<input class="fld" data-stcode="${esc(c)}" value="${esc(stnName(c) === c ? '' : stnName(c))}" placeholder="ชื่อสถานี">` : esc(stnName(c))}</td><td class="n">${f}</td><td class="n">${l}</td>
          ${S.admin ? `<td class="n">${st && st.added ? `<button class="btn sm danger" data-delstn="${esc(c)}">${ic('trash')}ลบ</button>` : ''}</td>` : ''}</tr>`; }).join('') || `<tr><td colspan="5" class="note">ยังไม่มีสถานี</td></tr>`}</tbody></table></div>
      ${S.admin ? `<div><button class="btn pri" id="stSave">${ic('save')}บันทึกชื่อสถานี</button></div>
      <div style="border:1px dashed #cfd8e8;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px">
        <div class="lbl" style="margin:0">เพิ่มสถานี</div>
        <div class="form-grid" style="grid-template-columns:140px 1fr auto;align-items:end">
          <div><div class="lbl">รหัส</div><input class="fld" id="stNewCode" maxlength="6" placeholder="เช่น BP" style="text-transform:uppercase"></div>
          <div><div class="lbl">ชื่อสถานี</div><input class="fld" id="stNewName" placeholder="เช่น บางพลี"></div>
          <div><button class="btn pri" id="stAdd">${ic('plus')}เพิ่มสถานี</button></div>
        </div>
        <div class="note">รหัสต้องตรงกับตัวอักษรนำหน้ารหัสหม้อแปลงในไฟล์ Excel เช่น บางพลี (BP-TR.1) → รหัส BP เมื่ออัปโหลดข้อมูลที่มีรหัสนี้ เหตุจะเข้าสถานีนี้อัตโนมัติ</div>
        <div id="stErr"></div>
      </div>` : '<div class="note">เข้าสู่ระบบแอดมินเพื่อแก้ไขหรือเพิ่มสถานี</div>'}`;
    if(S.admin){
      const saveNames = () => {
        B.querySelectorAll('[data-stcode]').forEach(inp => {
          const c = inp.dataset.stcode, name = inp.value.trim() || c, st = SETTINGS.stations.find(x => x.code === c);
          if(st) st.name = name; else SETTINGS.stations.push({ code: c, name });
        });
      };
      $('stSave').onclick = () => { saveNames(); store.set(K_SET, SETTINGS); audit('แก้ชื่อสถานี'); paintChrome(); renderPage(); toast('บันทึกชื่อสถานีแล้ว'); };
      $('stAdd').onclick = () => {
        const code = $('stNewCode').value.trim().toUpperCase(), name = $('stNewName').value.trim();
        const err = m => { $('stErr').innerHTML = `<div class="errbox">${m}</div>`; };

        if(!name) return err('กรอกชื่อสถานี');
        if(stationCodes().includes(code)) return err(`มีสถานีรหัส ${code} อยู่แล้ว แก้ชื่อได้ในตารางด้านบน`);
        saveNames();
        const st = SETTINGS.stations.find(x => x.code === code);
        if(st){ st.name = name; st.added = true; } else SETTINGS.stations.push({ code, name, added: true });
        store.set(K_SET, SETTINGS); audit('เพิ่มสถานี', `${code} ${name}`); paintChrome(); renderPage(); openSettings('stations'); toast(`เพิ่มสถานี ${name} (${code}) แล้ว`);
      };
      B.querySelectorAll('[data-delstn]').forEach(b => b.onclick = () => {
        const c = b.dataset.delstn, [f, l] = cnt(c);
        if(!confirm(f + l ? `สถานี ${stnName(c)} (${c}) ยังมีข้อมูล ${f} หม้อแปลง ${l} เหตุ ถ้าลบ สถานีจะยังแสดงตามรหัสในข้อมูล แต่ชื่อจะหายไป ลบเลยไหม?` : `ลบสถานี ${stnName(c)} (${c})?`)) return;

        store.set(K_SET, SETTINGS); audit('ลบสถานี', c); paintChrome(); renderPage(); openSettings('stations'); toast('ลบสถานีแล้ว');
      });

  else if(tab === 'thr'){
    B.innerHTML = `<div style="max-width:260px"><div class="lbl">เกณฑ์ผ่าน: Availability ≥</div><div class="inp"><input type="number" id="thrIn" step="0.1" min="0" max="100" value="${SETTINGS.threshold}" ${S.admin ? '' : 'disabled'}><span>%</span></div></div>
      <div class="note">ใช้เกณฑ์เดียวกันทุกเมนู: มาตรวัดและป้ายผ่าน/ไม่ผ่านในหน้าหลัก · การ์ด A ในวางแผนเป้าหมาย · ธง "ต่ำกว่าเกณฑ์" ในจัดอันดับ · สถานะในตรวจสอบด้วย Python · คอลัมน์สถานะใน Export Excel</div>
      ${S.admin ? `<div><button class="btn pri" id="thrSave">${ic('save')}บันทึกเกณฑ์</button> <button class="btn" id="thrDef">คืนค่า 96%</button></div>` : '<div class="note">เข้าสู่ระบบแอดมินเพื่อแก้ไข</div>'}`;
    if(S.admin){
      const save = v => { const x = parseFloat(v); if(!(x > 0 && x < 100)){ alert('ใส่ค่าระหว่าง 0 ถึง 100'); return; } SETTINGS.threshold = x; store.set(K_SET, SETTINGS); audit('ปรับเกณฑ์ A', x + '%'); renderPage(); openSettings('thr'); toast('บันทึกเกณฑ์แล้ว'); };
      $('thrSave').onclick = () => save($('thrIn').value); $('thrDef').onclick = () => save(96);
    }
  }
  else if(tab === 'data'){
    B.innerHTML = `<div class="sub">ข้อมูลปัจจุบัน: ${(DATA.rows || []).length} แถว${DATA.source ? ' จาก ' + esc(DATA.source) : ''}${S.dirty ? ' · <b style="color:var(--Mtx)">มีการเปลี่ยนแปลงที่ยังไม่ได้บันทึก</b>' : ''}</div>
      <div class="grid g2">
        <button class="btn" id="dExp">${ic('down')}ส่งออกข้อมูล (JSON)</button>
        <button class="btn" id="dImp">${ic('up')}นำเข้าข้อมูล (JSON)</button>
        <button class="btn" id="dReset">${ic('reset')}คืนค่าข้อมูลตั้งต้น</button>
        <button class="btn danger" id="dClear">${ic('trash')}ล้างข้อมูลทั้งหมด</button>
      </div><input type="file" id="dImpFile" class="hidden-file" accept=".json,application/json">
      <div class="note">ส่งออก/นำเข้า JSON ใช้ย้ายข้อมูลระหว่างเครื่อง · คืนค่าข้อมูลตั้งต้น = กลับไปใช้ข้อมูล 350 รายการที่ฝังในไฟล์เว็บ (Transformer_KO_PR_2017_2026.xlsx) · การแก้ของแอดมินเก็บในเบราว์เซอร์นี้เท่านั้น</div>
      <div class="lbl" style="margin-top:8px">แอดมินในเบราว์เซอร์นี้</div>
      ${hasDefAdmin() ? `<div class="warnbox" style="background:#fff8ec;border-color:var(--Mbd);color:#7a4310">ยังมีบัญชีตั้งต้น (ชื่อ ${DEF_ADMIN.name}) อยู่ ควรเปลี่ยนชื่อและรหัสผ่านทันที <button class="btn sm" id="aDefChg" style="margin-left:6px">เปลี่ยนตอนนี้</button></div>` : ''}
      <div class="tbl-wrap"><table><tbody>${admins().map(a => `<tr><td>${esc(a.name)}</td><td class="n">${a.name === S.admin ? '<span class="badge mute">คุณ</span>' : `<button class="btn sm danger" data-deladm="${esc(a.name)}">ลบ</button>`}</td></tr>`).join('')}</tbody></table></div>
      <div class="form-grid"><input class="fld" id="aName" placeholder="ชื่อแอดมินใหม่"><input class="fld" id="aPw" type="password" placeholder="รหัสผ่าน"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="aAdd">${ic('plus')}เพิ่มแอดมิน</button><button class="btn" id="aChg">เปลี่ยนรหัสผ่านของฉันเป็นค่านี้</button></div>`;
    $('dExp').onclick = () => {
      const blob = new Blob([JSON.stringify({ app:'RAMSight-TR', exportedAt: new Date().toISOString(), data: DATA, settings: SETTINGS }, null, 1)], { type:'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ramsight_backup_${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      audit('ส่งออกข้อมูล (JSON)');
    };
    $('dImp').onclick = () => $('dImpFile').click();
    $('dImpFile').onchange = e => {
      const f = e.target.files[0]; if(!f) return; const rd = new FileReader();
      rd.onload = () => { try{ const j = JSON.parse(rd.result); if(!j.data || !Array.isArray(j.data.rows)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง'); if(j.app === 'RAMSight') throw new Error('ไฟล์นี้เป็นข้อมูลสายป้อน/สายส่งของรุ่นก่อน ใช้กับเว็บหม้อแปลงไม่ได้');
        if(!confirm(`นำเข้า ${j.data.rows.length} แถว แทนข้อมูลที่มีอยู่?`)) return;
        DATA = j.data; if(j.settings) SETTINGS = Object.assign({}, DEFAULT_SETTINGS, j.settings); SETTINGS.menus = Object.assign({}, DEFAULT_MENUS, SETTINGS.menus || {}); store.set(K_SET, SETTINGS);
        audit('นำเข้าข้อมูล (JSON)', f.name); closeModal(); markDirty(); rebuild(); toast('นำเข้าแล้ว — อย่าลืมกดบันทึก'); }catch(err){ alert('นำเข้าไม่ได้: ' + err.message); } };
      rd.readAsText(f);
    };
    $('dReset').onclick = () => { if(!confirm('คืนค่าข้อมูลตั้งต้น? ข้อมูลที่บันทึกไว้ในเบราว์เซอร์นี้จะถูกลบ')) return; store.del(K_DATA); DATA = readSeed(); S.dirty = false; audit('คืนค่าข้อมูลตั้งต้น'); closeModal(); rebuild(); toast('คืนค่าแล้ว'); };
    $('dClear').onclick = () => { if(!confirm('ล้างข้อมูลทั้งหมด? (กดบันทึกเพื่อยืนยันการลบถาวร)')) return; DATA = { rows: [], source:'', uploadedAt: Date.now() }; audit('ล้างข้อมูลทั้งหมด'); closeModal(); markDirty(); rebuild(); };
    B.querySelectorAll('[data-deladm]').forEach(b => b.onclick = () => { if(!confirm('ลบแอดมิน ' + b.dataset.deladm + '?')) return; store.set('admins', admins().filter(a => a.name !== b.dataset.deladm)); audit('ลบแอดมิน', b.dataset.deladm); openSettings('data'); });
    if($('aDefChg')) $('aDefChg').onclick = () => { closeModal(); setTimeout(openChangeDefault, 60); };
    $('aAdd').onclick = () => { const n = $('aName').value.trim(), p = $('aPw').value; if(!n || p.length < 4){ alert('กรอกชื่อ และรหัสผ่านอย่างน้อย 4 ตัวอักษร'); return; }
      if(admins().some(a => a.name.toLowerCase() === n.toLowerCase())){ alert('มีชื่อนี้แล้ว'); return; }
      store.set('admins', admins().concat([{ name:n, h: hashPw(n, p) }])); audit('เพิ่มแอดมิน', n); openSettings('data'); toast('เพิ่มแอดมินแล้ว'); };
    $('aChg').onclick = () => { const p = $('aPw').value; if(p.length < 4){ alert('รหัสผ่านอย่างน้อย 4 ตัวอักษร'); return; }
      store.set('admins', admins().map(a => a.name === S.admin ? { name:a.name, h: hashPw(a.name, p) } : a)); audit('เปลี่ยนรหัสผ่าน'); $('aPw').value = ''; toast('เปลี่ยนรหัสผ่านแล้ว'); };
  }
  else if(tab === 'menus'){
    const items = [['home','หน้าหลัก','home', null], ['plan','วางแผนเป้าหมาย R/A/M','target', null], ['rank','จัดอันดับ & แนวโน้ม','trend', 'Pareto · แนวโน้ม · ตารางจัดอันดับ · เปรียบเทียบช่วงเวลา'], ['py','ตรวจสอบด้วย Python','code', 'คำนวณซ้ำด้วย Python เพื่อยืนยันตัวเลข']];
    B.innerHTML = `<div class="sub">เลือกเมนูที่จะแสดงที่แถบซ้าย เมนูที่ปิดไว้จะซ่อนจากทุกคน รวมถึงแอดมิน ข้อมูลไม่หาย เปิดกลับได้ทุกเมื่อ</div>
      ${items.map(([k, n, icn, d]) => `<label class="chk-row" style="${d ? '' : 'opacity:.6;cursor:default'}"><input type="checkbox" data-menu="${k}" ${d ? '' : 'disabled'} ${!d || menuOn(k) ? 'checked' : ''}>${ic(icn)}<span style="flex:1"><b>${n}</b>${d ? `<span class="note" style="display:block">${d}</span>` : '<span class="note" style="display:block">แสดงเสมอ</span>'}</span></label>`).join('')}
      <div><button class="btn pri" id="menuSave">${ic('save')}บันทึกเมนูที่แสดง</button></div>
      <div class="note">ค่านี้เก็บในเบราว์เซอร์เครื่องนี้ ถ้าย้ายไปเครื่องอื่น ใช้ ส่งออก/นำเข้าข้อมูล (JSON) ค่าจะติดไปด้วย</div>`;
    $('menuSave').onclick = () => {
      B.querySelectorAll('[data-menu]:not([disabled])').forEach(c => { SETTINGS.menus[c.dataset.menu] = c.checked; });
      store.set(K_SET, SETTINGS); audit('ตั้งค่าเมนูที่แสดง', Object.entries(SETTINGS.menus).map(([k, v]) => `${k}:${v ? 'แสดง' : 'ซ่อน'}`).join(' '));
      renderPage(); openSettings('menus'); toast('บันทึกเมนูที่แสดงแล้ว');
    };
  }
  else if(tab === 'log'){
    const log = store.get('audit', []).slice().reverse();
    B.innerHTML = `<div class="bar"><span class="sub">${log.length} รายการล่าสุด (เก็บสูงสุด 500)</span><button class="btn sm right" id="logXls">${ic('down')}ดาวน์โหลด Excel</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead><tbody>${log.slice(0, 200).map(x => `<tr><td style="white-space:nowrap">${new Date(x.t).toLocaleString('th-TH')}</td><td>${esc(x.who)}</td><td>${esc(x.act)}</td><td>${esc(x.detail)}</td></tr>`).join('') || '<tr><td colspan="4" class="note">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div>`;
    $('logXls').onclick = () => { if(typeof XLSX === 'undefined') return alert('โหลดไลบรารี Excel ไม่ได้'); const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(log.map(x => ({ เวลา: new Date(x.t).toLocaleString('th-TH'), ผู้ใช้: x.who, การกระทำ: x.act, รายละเอียด: x.detail }))), 'ประวัติ'); XLSX.writeFile(wb, 'ramsight_audit.xlsx'); };
  }
}

/* --- export --- */
$('exportExcelBtn').onclick = () => {
  if(!MODEL || !MODEL.events.length){ alert('ยังไม่มีข้อมูล'); return; }
  if(typeof XLSX === 'undefined'){ alert('โหลดไลบรารี Excel ไม่ได้'); return; }
  const wb = XLSX.utils.book_new(), scope = `สถานี: ${S.stn === 'ALL' ? 'ทุกสถานี' : stnName(S.stn)} · ปี: ${S.sheet === 'ALL' ? 'ทุกปี' : yLabel(S.sheet)}`;
  const evs = scoped(), t = stats(evs), num = (v, d) => fin(v) ? +v.toFixed(d) : '';
  const sum = [['RAM Insight · สรุปผลหม้อแปลง (งาน CM)'], [scope], [], ['ตัวชี้วัด', 'ค่า'],
    ['จำนวนเหตุ', t.n], ['จำนวนหม้อแปลง', t.nUnits], ['MTBF เฉลี่ย (ชม.)', num(t.mtbfH, 2)], ['MTBF เฉลี่ย (วัน)', num(t.mtbfH / 24, 2)],
    ['MTTR เฉลี่ย (ชม.)', num(t.mttrH, 2)], ['Availability เฉลี่ย (%)', num(t.A, 2)], ['เกณฑ์ A (%)', SETTINGS.threshold], ['เหตุที่เวลาเริ่ม = เสร็จ', t.nQ],
    [], ['ชนิดปัญหา', 'จำนวนเหตุ']].concat(t.comp.map(([k, v]) => [k, v])).concat([[], ['สาเหตุ', 'จำนวนเหตุ']]).concat(t.cause.map(([k, v]) => [k, v]));

function doPrint(which){
  closeModal();
  document.body.classList.toggle('print-report', which === 'report');
  if(which === 'report') renderReport();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('print-on', p.id === (which === 'report' ? 'page-report' : 'page-' + S.page)));
  $('printMeta').textContent = `${$('crumb').textContent} · หม้อแปลง · สถานี: ${S.stn === 'ALL' ? 'ทุกสถานี' : stnName(S.stn)} · ${S.sheet === 'ALL' ? 'ทุกปี' : yLabel(S.sheet)} · พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}`;
  audit('Export PDF', which === 'report' ? 'รายงานสรุป 1 หน้า' : S.page);
  const pg = which === 'report' ? null : $('page-' + S.page), shut = pg ? [...pg.querySelectorAll('details:not([open])')] : [];   // กางกล่องที่พับไว้ (เช่น ดูสูตรที่ใช้) ให้พิมพ์ครบ
  shut.forEach(d => d.open = true);
  const back = () => { window.removeEventListener('afterprint', back); shut.forEach(d => d.open = false); };

}

/* ---------- คู่มือการสร้าง: โค้ดจริงทีละส่วน (ดึงจาก #codeSnips ที่ build.py สร้าง) ---------- */
let CODE_SNIPS = null;
function codeSnips(){ if(!CODE_SNIPS){ try{ CODE_SNIPS = JSON.parse(document.getElementById('codeSnips').textContent); }catch(e){ CODE_SNIPS = {}; } } return CODE_SNIPS; }
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
function hlCode(line, py){
  /* หาจุดเริ่มคอมเมนต์จากข้อความดิบ (ไม่นับ # หรือ // ที่อยู่ในเครื่องหมายคำพูด) */
  let q = '', cm = -1;
  for(let k = 0; k < line.length; k++){ const ch = line[k];
    if(q){ if(ch === '\\'){ k++; continue; } if(ch === q) q = ''; continue; }
    if(ch === "'" || ch === '"' || ch === '`'){ q = ch; continue; }
    if(py ? ch === '#' : (ch === '/' && line[k + 1] === '/' && line[k - 1] !== ':')){ cm = k; break; } }
  const code = cm >= 0 ? line.slice(0, cm) : line, tail = cm >= 0 ? `<span class="cc">${esc(line.slice(cm))}</span>` : '';
  return esc(code).replace(/\b(function|const|let|return|if|else|for|def|import|try|catch|new|true|false|None|null|in|of|lambda)\b/g, '<span class="ck">$1</span>') + tail;
}
/* แสดงโค้ด 1 ชุดแบบหน้าจอโปรแกรมเขียนโค้ด · notes = [[ข้อความที่อยู่ในบรรทัด, คำอธิบาย]] → ใส่วงเลขที่บรรทัดนั้น */
function codeCap(id, notes){
  const S0 = codeSnips()[id];
  if(!S0) return gTip('ไม่พบโค้ดส่วนนี้ในไฟล์ (รอตรวจสอบ: รัน build.py ใหม่)', 'warn');
  const py = /\.py$/.test(S0.file), mark = {}, used = new Set();
  notes.forEach(([m], i) => { S0.segs.some((sg, si) => sg.lines.some((l, li) => { const key = si + ':' + li; if(l.includes(m)){ mark[key] = (mark[key] || '') + CIRC[i]; used.add(key); return true; } return false; })); });
  const last = S0.segs[S0.segs.length - 1], rng = `บรรทัด ${S0.segs[0].start}–${last.start + last.lines.length - 1}`;
  const body = S0.segs.map((sg, si) => (si ? '<div class="cgap">⋮</div>' : '') + sg.lines.map((l, li) => { const k = si + ':' + li;
    return `<div class="cl${mark[k] ? ' hit' : ''}"><span class="cn">${sg.start + li}</span><span class="cm">${mark[k] || ''}</span><code>${hlCode(l, py) || ' '}</code></div>`; }).join('')).join('');
  return `<div class="ccap"><div class="cbar"><i></i><i></i><i></i><b>${S0.file}</b><span>${rng}</span></div><div class="cbody">${body}</div></div>
    <ol class="cnotes">${notes.map(([m, t], i) => `<li><span class="cmk">${CIRC[i]}</span><span>${t}</span></li>`).join('')}</ol>`;
}

function renderGuide(){
  const el = $('page-guide');
  if(!GUIDE_TABS.find(t => t[0] === S.guideTab)) S.guideTab = 'user';
  const pr = S.guidePrint, tab = S.guideTab;
  const body = { user: guideUser, dev: guideDev, debug: guideDebug };
  const today = new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
  const logo = (document.querySelector('.logo img') || {}).src || '';
  const part = k => { const t = GUIDE_TABS.find(x => x[0] === k); return `<div class="gpart" data-part="${k}"><div class="gphead"><img src="${logo}" alt=""><div><b>${t[1]}</b><span>${t[2]} · ระบบวิเคราะห์ R/A/M หม้อแปลง RAM Insight</span></div></div>${body[k]()}</div>`; };
  const parts = pr === 'all' ? GUIDE_TABS.map(t => t[0]) : [pr || tab];
  el.innerHTML = `<h1>${ic('book')}คู่มือการใช้งาน</h1>
  <div class="gcover"><img src="${logo}" alt=""><h1>${pr === 'all' ? 'คู่มือระบบ RAM Insight' : GUIDE_TABS.find(t => t[0] === parts[0])[1]}</h1>
    <p>ระบบวิเคราะห์ Reliability · Availability · Maintainability ของหม้อแปลง</p>
    <ul>${parts.map((k, i) => `<li>${i + 1}. ${GUIDE_TABS.find(t => t[0] === k)[1]} <span>${GUIDE_TABS.find(t => t[0] === k)[2]}</span></li>`).join('')}</ul><small>พิมพ์เมื่อ ${today}</small></div>
  <div class="ghead no-print">
    <div class="gtabs" role="tablist">${GUIDE_TABS.map(([k, n, d, i], x) => `<button role="tab" aria-selected="${k === tab}" data-gtab="${k}" class="${k === tab ? 'on' : ''}"><span class="gtn">${'①②③'[x]}</span>${ic(i)}<span><b>${n}</b><small>${d}</small></span></button>`).join('')}</div>
    <div class="gtool"><div class="gnav">${GUIDE_SEC[tab].map(([id, n], i) => `<button class="gchip" data-gto="${id}">${i + 1}. ${n}</button>`).join('')}</div>
      <div class="gpdf"><button class="btn sm" data-gpdf="one">${ic('down')}บันทึกส่วนนี้เป็น PDF</button><button class="btn sm" data-gpdf="all">${ic('file')}ทั้ง 3 ส่วนเป็น PDF</button></div></div>
  </div>
  ${parts.map(part).join('')}
  <div class="gback no-print"><button class="btn sm" data-gtop>${ic('chev')}กลับไปเมนูคู่มือด้านบน</button></div>`;
}
function printGuide(which){
  S.guidePrint = which === 'all' ? 'all' : S.guideTab; renderGuide();
  const pg = $('page-guide');
  pg.querySelectorAll('details').forEach(d => d.open = true);
  document.body.classList.add('print-guide');
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('print-on', p === pg));
  audit('Export PDF', 'คู่มือ · ' + (which === 'all' ? 'ทั้ง 3 ส่วน' : GUIDE_TABS.find(t => t[0] === S.guideTab)[1]));
  const done = () => { window.removeEventListener('afterprint', done); document.body.classList.remove('print-guide'); S.guidePrint = null; if(S.page === 'guide') renderGuide(); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 80);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-gtab]'); if(t){ S.guideTab = t.dataset.gtab; renderGuide(); const h = document.querySelector('#page-guide .ghead'); if(h && h.getBoundingClientRect().top < 0) window.scrollTo({ top: 0 }); return; }
  const p = e.target.closest('[data-gpdf]'); if(p){ printGuide(p.dataset.gpdf); return; }
  if(e.target.closest('[data-gtop]')) window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderPage(){
  if(!menuOn(S.page)){ S.page = 'home'; try{ history.replaceState(null, '', '#home'); }catch(_){} }
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== 'page-' + S.page; if(p.hidden) p.innerHTML = ''; });
  if(S.page !== 'rank') destroyChart('trend'); if(S.page !== 'py') destroyChart('lowA');
  ({ home: renderHome, plan: renderPlan, rank: renderRank, py: renderPy, guide: renderGuide })[S.page]();
  paintChrome();
}
function rebuild(){ MODEL = buildModel(DATA.rows || []); renderPage(); }
document.addEventListener('click', e => {
  const n = e.target.closest('.nav[data-page]');
  if(n){ S.page = n.dataset.page; document.body.classList.remove('nav-open'); renderPage(); window.scrollTo(0, 0); try{ history.replaceState(null, '', '#' + S.page); }catch(_){} return; }
  const s = e.target.closest('[data-stn]');
  if(s){ S.stn = s.dataset.stn; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; document.body.classList.remove('nav-open'); renderPage(); return; }
  const a = e.target.closest('[data-act]');
  if(a){ if(a.dataset.act === 'upload') $('uploadBtn').click(); else openLogin(); }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-stnsel]')){ S.stn = e.target.value; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; renderPage(); return; }
  if(e.target.matches('[data-sheetsel]')){ S.sheet = e.target.value; S.home.open.clear(); S.plan.sMtbf = S.plan.sMttr = null; renderPage(); }
});
$('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('scrim').onclick = () => document.body.classList.remove('nav-open');
window.addEventListener('afterprint', () => document.querySelectorAll('.page').forEach(p => p.classList.remove('print-on')));

/* ---------------- boot ---------------- */
(function boot(){
  const who = sess.get(); if(who && admins().some(a => a.name === who)) S.admin = who;
  const h = (location.hash || '').slice(1); if(TITLES[h]) S.page = h;
  rebuild();
})();

</script>
