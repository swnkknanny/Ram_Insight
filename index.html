<style>
:root{
  --navy:#0b2160; --navy2:#1c3a7a; --blue:#1677f2; --sky:#0ea0e6;
  --bg:#f3f6fb; --card:#fff; --line:#e3e9f3; --line2:#eef2f8; --text:#14213d; --soft:#5d6b86; --faint:#8a96ad;
  --R:#2563eb; --Rbg:#eaf1ff; --Rbd:#c7d8fb; --M:#e07a1f; --Mtx:#b85f10; --Mbg:#fff2e5; --Mbd:#f6d3b0;
  --A:#2e8b57; --Atx:#23704a; --Abg:#e8f6ee; --Abd:#bfe3cd; --bad:#c2413b; --badbg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,#fff 0,#fff 267px,var(--line) 267px,var(--line) 268px,transparent 268px)}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.logo img{height:34px;width:auto}
.logo b{font-size:21px;letter-spacing:-.2px;color:var(--navy)}
.logo b span{color:var(--blue)}
.sec{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.3px;margin:12px 6px 4px}
.stn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;background:#fafcff;text-align:left;width:100%}
.stn:hover{border-color:#c8d4ea}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stn .t{font-weight:600;font-size:15px;display:block}.stn .s{font-size:12.5px;color:var(--soft);display:block}.stn.on .s{color:#c6d3ef}
.stn svg.ic{margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--soft);font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:#f3f6fc;color:var(--text)}
.nav.on{background:#e8eefb;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;font-size:14.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#c3cee3;background:#f8faff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.danger{color:var(--bad);border-color:#f0c9c6}
.btn.save{background:var(--A);color:#fff;border-color:var(--A)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.side .btn{width:100%;justify-content:flex-start}
.pill{margin-top:8px;border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;background:#f1f4f9;color:var(--soft)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:7px;flex:none}
.pill.ok{background:var(--Abg);color:var(--Atx)}.pill.ok i{background:var(--A)}
.foot{margin-top:auto;padding-top:10px}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);font-size:14px}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e8eefb;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--M)}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;display:flex;align-items:center;gap:10px;color:var(--navy);line-height:1.3}
h1 svg.ic{width:26px;height:26px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:500;color:var(--soft);background:none;border:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--navy);color:#fff}
.sel{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 12px;font-weight:500}
.sel label{color:var(--soft);font-weight:400;font-size:14px}
.sel select{border:0;background:transparent;padding:5px 6px;font-weight:500;max-width:100%;outline:none}
select.fld,input.fld{border:1px solid #cfd8e8;border-radius:10px;padding:9px 12px;background:#fff;width:100%;outline:none}
select.fld:focus,input.fld:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;min-width:0}
.card h3{font-size:16.5px;display:flex;align-items:center;gap:8px;line-height:1.35}
.sub{color:var(--soft);font-size:13.5px;margin-top:2px}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);color:var(--faint);font-size:11.5px;font-weight:700;font-family:Georgia,serif;font-style:italic;background:#fff;flex:none;padding:0}
.info:hover{border-color:var(--blue);color:var(--blue)}
.kpi .ico{width:40px;height:40px;border-radius:11px;background:#eaf0fb;display:grid;place-items:center;color:var(--navy);margin-bottom:12px}
.kpi .lb{font-size:14px;color:var(--soft);font-weight:500}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;margin-top:2px}.kpi .v small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.kpi .n{font-size:13px;color:var(--faint)}
.kpi .info{position:absolute;right:16px;top:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.badge svg.ic{width:14px;height:14px}
.ok{background:var(--Abg);color:var(--Atx)}.bad{background:var(--badbg);color:var(--bad)}.mute{background:#eef2f8;color:var(--soft)}.warn{background:#fff2e5;color:var(--Mtx)}
.rk{display:flex;align-items:center;gap:10px;margin-top:12px}

.gtabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.gtabs button.on b,.gtabs button.on small,.gtabs button.on .gtn{color:#fff}
.gtabs button:focus-visible,.gstep summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.gtool{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gtool .gnav{position:static;margin:0;padding:0;flex:1;background:none}
.gpdf{display:flex;gap:6px;flex-wrap:wrap}
.gpart{display:flex;flex-direction:column;gap:22px}
.gphead,.gcover{display:none}
.gsec2{scroll-margin-top:190px;display:flex;flex-direction:column;gap:10px}
.gsec-h h2{font-size:20px;color:var(--navy);margin:0}
.gsec-h p{margin:2px 0 0;font-size:14px;color:var(--soft)}
.gcard{padding:18px 20px}
.gsteps2{display:flex;flex-direction:column;gap:10px}
.gstep{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gstep summary{list-style:none;display:grid;grid-template-columns:52px 46px minmax(0,1fr) 24px;gap:14px;align-items:center;padding:14px 18px;cursor:pointer}
.gstep summary::-webkit-details-marker{display:none}
.gstep summary:hover{background:#f7f9fd}
.gno{font-size:26px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.gico{width:42px;height:42px;border-radius:11px;background:#eaf1ff;color:var(--navy);display:flex;align-items:center;justify-content:center}
.gico .ic{width:21px;height:21px}
.gtx b{display:block;font-size:16.5px;color:var(--navy)}
.gtx span{display:block;font-size:14.5px;color:var(--soft);line-height:1.6;margin-top:2px}
.gchev{color:var(--faint);transition:transform .2s}.gchev .ic{width:18px;height:18px}
.gstep[open] .gchev{transform:rotate(180deg)}
.gstep[open] summary{border-bottom:1px solid var(--line2)}
.gbody{padding:14px 20px 18px 132px;font-size:14.5px;line-height:1.75}
.glist,.gul{margin:0;padding-left:22px;line-height:1.8;font-size:14.5px}
.glist li,.gul li{margin:2px 0}
.gtip{margin-top:10px;background:#f2f6fd;border:1px solid #d9e4f7;border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.7;color:var(--text)}
.gtip.warn{background:#fff8ec;border-color:var(--Mbd);color:#7a4310}
.gtbl td,.gtbl th{font-size:14px;vertical-align:top}
.gmap{display:flex;flex-direction:column;gap:6px;background:#f5f7fb;border:1px dashed #cfd8e8;border-radius:12px;padding:12px;margin-bottom:12px}
.gmr{display:flex;gap:6px}
.gmb{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--soft);display:flex;align-items:center;gap:8px}
.gmb i{font-style:normal;flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gmb.k{background:#eaf1ff;color:var(--navy)}.gmb.s{background:var(--Abg);color:var(--Atx)}.gmb.w{background:#fff3e6;color:var(--Mtx)}
.gflow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.gfl{flex:1;min-width:110px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:#fff}
.gfl b{color:var(--navy);font-size:14.5px}.gfl small{font-size:12px;color:var(--faint)}
.garr{display:flex;align-items:center;color:var(--faint)}
.gtag{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;margin-bottom:4px}
.gtag.sym{background:#fdecea;color:var(--bad)}.gtag.cau{background:#fff3e6;color:var(--Mtx)}.gtag.chk{background:#eaf1ff;color:var(--navy)}.gtag.fix{background:var(--Abg);color:var(--Atx)}
.gdbg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.gdbg p{margin:0}
.gdleg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.gdleg .gtag{margin:0}
.gdleg .gtag:not(:last-child)::after{content:' →';color:var(--faint)}
.gcode{background:#0f1b3d;color:#e7ecf7;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.7;overflow:auto;white-space:pre}
.gback{display:flex;justify-content:center;margin-top:6px}
.gback .ic{transform:rotate(180deg)}
@media (max-width:900px){.gtabs{grid-template-columns:1fr}.gtabs button small{white-space:normal}.ghead{position:static}}
@media (max-width:700px){.gstep summary{grid-template-columns:34px minmax(0,1fr) 20px;gap:10px;padding:12px 14px}.gstep summary .gico{display:none}.gno{font-size:20px}.gbody{padding:12px 14px 16px}.gdbg{grid-template-columns:1fr}.gmr{flex-wrap:wrap}.gmb{flex:1 1 45%}.garr{display:none}.gfl{flex:1 1 40%}.gcard{padding:14px}}

/* ===== พิมพ์คู่มือเป็น PDF ===== */

/* ===== คู่มือการสร้าง: โค้ดจริงทีละส่วน ===== */
.cpart{display:flex;flex-direction:column;gap:12px}

/* ===== คู่มือ PDF: ไม่ตัดกรอบข้ามหน้า · ข้อความไม่ล้น ===== */
@media print{
  body.print-guide{font-size:11.5px}
  body.print-guide .gpart,body.print-guide .gsec2,body.print-guide .gsteps2,body.print-guide .cpart{display:block}

  body.print-guide .cph,body.print-guide .gflow,body.print-guide .gcode,body.print-guide .gkv > dt,body.print-guide .gdbg > div,body.print-guide .rdocs li,

  body.print-guide .gstep,body.print-guide .gmap,body.print-guide .gtip,body.print-guide .ccap,body.print-guide .cweb,body.print-guide .gflow,body.print-guide .gcode{margin:0 0 8px}
  body.print-guide .cpart{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #d6dded}
  body.print-guide .cph{margin-bottom:6px}
  body.print-guide .gsec-h,body.print-guide .cph,body.print-guide .lbl{break-after:avoid;page-break-after:avoid}
  body.print-guide .gsec2{margin-bottom:16px}
  body.print-guide .gsec-h h2{font-size:15px;border-bottom:2px solid var(--navy);padding-bottom:3px}
  /* ตาราง: ไม่เลื่อน ไม่ตัดขอบ ตัดคำได้ หัวตารางซ้ำทุกหน้า */

  body.print-guide .gtbl{width:100%;table-layout:auto;border-collapse:collapse}

  body.print-guide .gkv dd{break-before:avoid}

  body.print-guide .gstep .gico{width:28px;height:28px}.gstep .gico .ic{width:15px;height:15px}
  body.print-guide .gno{font-size:18px}
  body.print-guide .gtx b{font-size:13px}.gtx span{font-size:11px}
  body.print-guide .gbody{padding:6px 12px 8px 82px;font-size:11px}
  body.print-guide .glist,body.print-guide .gul{font-size:11px;line-height:1.6}
  body.print-guide .gtip{font-size:10.5px;padding:6px 10px}
  body.print-guide .gdbg{grid-template-columns:1fr 1fr;gap:6px 14px}

  body.print-guide .gflow{flex-wrap:nowrap}.gfl{min-width:0;padding:6px}.gfl b{font-size:11px}

  body.print-guide img{max-width:100%}
}

<script id="pyCode" type="text/x-python">
# RAM Insight — ตรวจสอบด้วย Python (ใช้ไลบรารีมาตรฐานเท่านั้น)
# RAW_JSON = แถวต้นฉบับทุกแถวจาก Excel (Service Request ของหม้อแปลง)
# ใช้เฉพาะงาน [CM] · เวลาซ่อม = Actual Start → Actual Finish · หน่วย = หม้อแปลงแต่ละลูก
import json, re, math
from datetime import datetime, timedelta
from statistics import mean
from collections import Counter, defaultdict

rows = json.loads(RAW_JSON)
EPOCH = datetime(1970, 1, 1)

def to_time(v):
    """แปลงเวลาเป็น datetime ปัดเป็นนาที: เลขซีเรียลของ Excel (นับจาก 1899-12-30) หรือข้อความวันที่"""
    if v is None or v == '':
        return None
    if isinstance(v, (int, float)):
        minutes = math.floor((v - 25569) * 1440 + 0.5)
        return EPOCH + timedelta(minutes=minutes)
    s = str(v).strip()
    m = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$', s)
    if m:
        d = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
    else:
        m = re.match(r'^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$', s)
        if m:
            y = int(m[3])
            if len(m[3]) == 2:            # ปี 2 หลัก: <= 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
                y = 2000 + y if y <= 50 else 2500 + y
            if y > 2400:
                y -= 543
            d = datetime(y, int(m[2]), int(m[1]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
        elif re.match(r'^\d+(\.\d+)?$', s):
            return to_time(float(s))
        else:
            return None
    return EPOCH + timedelta(minutes=math.floor((d - EPOCH).total_seconds() / 60 + 0.5))

def hours(a, b):
    return (b - a).total_seconds() / 3600

def is_pm(r):
    s = str(r.get('summary') or '').strip()
    if re.match(r'^\[\s*PM\s*\]', s, re.I):
        return True
    if re.match(r'^\[\s*CM\s*\]', s, re.I):
        return False
    return str(r.get('prio')).strip() == '4'

def unit_of(r):
    m = re.search(r'\(([^)]+)\)', str(r.get('loc') or ''))
    if m:
        return m[1].strip()
    m = re.search(r'\b([A-Z]{1,6}-?TR\.?\s*\d+)\b', str(r.get('summary') or ''), re.I)
    if m:
        return re.sub(r'\s+', '', m[1].upper())
    return str(r.get('loc') or '').strip()

def prefix(code):
    m = re.match(r'^([A-Za-z]+)', str(code or '').strip())
    return m[1].upper() if m else ''

# ---------- ① ตัดงาน PM + ตัดแถวซ้ำ + ตรวจคุณภาพ ----------
pm = sum(1 for r in rows if is_pm(r))
seen, uniq = set(), []
for r in rows:
    if is_pm(r):
        continue
    f, t = to_time(r.get('start')), to_time(r.get('finish'))
    sr = str(r.get('sr') or '').strip()
    key = ('SR', sr) if sr else (r.get('loc'), f or ('x', str(r.get('start'))), t or ('x', str(r.get('finish'))))
    if key not in seen:
        seen.add(key)
        uniq.append({'r': r, 'f': f, 't': t})
missing = reversed_ = zero = too_long = 0
good = []
for u in uniq:
    if u['f'] is None or u['t'] is None:
        missing += 1
    elif u['t'] == u['f']:      # เริ่ม = เสร็จ: ไม่ตัดทิ้ง นับเป็นซ่อม 0 นาทีตามที่กรอก
        zero += 1
        good.append(u)
    elif u['t'] < u['f']:
        reversed_ += 1
    elif hours(u['f'], u['t']) > 8760:
        too_long += 1
    else:
        good.append(u)

events = []
for u in good:
    r = u['r']; unit = unit_of(r) or '(ไม่ระบุหม้อแปลง)'
    events.append({'unit': unit, 'stn': prefix(unit) or '?', 'from': u['f'], 'to': u['t'], 'dur': hours(u['f'], u['t']),
                   'prob': str(r.get('prob') or '').strip(), 'cause': str(r.get('cause') or '').strip(),
                   'prio': str(r.get('prio')).strip(), 'zero': u['t'] == u['f']})

# ---------- ② สูตร R ตามเครื่องมือคำนวณของหน่วยงาน (Weibull / Exponential) ----------
def wb_fit(t):
    s = sorted(t); n = len(s)
    X = [math.log(v) for v in s]
    Y = [math.log(-math.log(1 - (i + 1 - 0.3) / (n + 0.4))) for i in range(n)]
    mx = sum(X) / n; my = sum(Y) / n
    sxx = sum((x - mx) ** 2 for x in X); sxy = sum((x - mx) * (y - my) for x, y in zip(X, Y))
    if sxx == 0:
        return None
    b = sxy / sxx; a = my - b * mx; eta = math.exp(-a / b)
    return {'beta': b, 'eta': eta, 'mtbf': eta * math.gamma(1 + 1 / b)}

def rel_model(gaps):
    n = len(gaps)
    mtbf_e = sum(gaps) / n if n else None
    if n < 3:
        return {'ok': False, 'n': n, 'mtbf': mtbf_e, 'rec': None, 'w': None, 'mtbf_e': mtbf_e}
    w = wb_fit(gaps)
    rec = 'exp' if (w is None or n < 10 or 0.9 <= w['beta'] <= 1.1) else 'wb'
    return {'ok': True, 'n': n, 'mtbf_e': mtbf_e, 'w': w, 'rec': rec, 'mtbf': w['mtbf'] if rec == 'wb' else mtbf_e}

def rel_R(m, t):
    if not m['ok']:
        return None
    if m['rec'] == 'wb':
        return math.exp(-(t / m['w']['eta']) ** m['w']['beta'])
    return math.exp(-t / m['mtbf_e'])

# ---------- ③ สูตร: หน่วย = สถานี + รหัสหม้อแปลง ----------
def top(counter):
    items = sorted(((k or 'ไม่ระบุ', n) for k, n in counter.items()), key=lambda x: (-x[1], x[0]))
    return f'{items[0][0]} {items[0][1]}' if items else '– 0'

def analyse(evs):
    by_unit = defaultdict(list)
    for e in evs:
        by_unit[(e['stn'], e['unit'])].append(e)
    units, ev_mtbf, ev_A, all_gaps = [], [], [], []
    for (stn, unit), es in by_unit.items():
        es.sort(key=lambda e: e['from'])
        gaps = []
        for i in range(1, len(es)):
            g = hours(es[i - 1]['to'], es[i]['from'])
            if g > 0:
                gaps.append(g)
        all_gaps += gaps
        mttr = mean(e['dur'] for e in es)
        mtbf = rel_model(gaps)['mtbf'] if gaps else None
        if mtbf is not None:
            for e in es:
                ev_mtbf.append(mtbf)
                ev_A.append(mtbf / (mtbf + e['dur']) * 100)
        units.append({'unit': unit, 'stn': stn, 'n': len(es), 'ngaps': len(gaps), 'mtbf': mtbf, 'mttr': mttr,
                      'A': (mtbf / (mtbf + mttr) * 100) if mtbf is not None else None})
    units.sort(key=lambda u: (-u['n'], u['A'] if u['A'] is not None else 999, u['unit']))
    agg = rel_model(all_gaps)
    r_year = rel_R(agg, 8760)
    return {
        'beta': agg['w']['beta'] if agg['w'] else None,
        'eta': agg['w']['eta'] if agg['w'] else None,
        'rec': ('Weibull' if agg['rec'] == 'wb' else 'Exponential') if agg['ok'] else '–',
        'mtbf_rep': agg['mtbf'],
        'R_year': r_year * 100 if r_year is not None else None,
        'n': len(evs),
        'units_n': len(units),
        'mtbf_days': agg['mtbf'] / 24 if all_gaps else None,
        'pooled_days': mean(all_gaps) / 24 if all_gaps else None,
        'mttr': mean(e['dur'] for e in evs) if evs else None,
        'A': mean(ev_A) if ev_A else None,
        'top_prob': top(Counter(e['prob'] for e in evs)),
        'top_cause': top(Counter(e['cause'] for e in evs)),
        'p1': sum(1 for e in evs if e['prio'] == '1'),
        'zero': sum(1 for e in evs if e['zero']),
        'units': units,
    }

T = analyse(events)
by_stn = {s: analyse([e for e in events if e['stn'] == s]) for s in sorted({e['stn'] for e in events})}
json.dumps({
    'quality': {'raw': len(rows), 'pm': pm, 'unique': len(uniq), 'dupes': len(rows) - pm - len(uniq),
                'missing': missing, 'reversed': reversed_, 'zero': zero, 'long': too_long, 'used': len(events)},
    'T': T,
    'stn': {s: {'n': v['n'], 'units_n': v['units_n'], 'mtbf_days': v['mtbf_days'], 'mttr': v['mttr'], 'A': v['A']} for s, v in by_stn.items()},
}, ensure_ascii=False)

const DEFAULT_MENUS = { rank: false, py: true };   // เมนูที่แอดมินเปิด/ปิดได้ (จัดอันดับซ่อนไว้เป็นค่าเริ่มต้น)

/* ---------------- time parsing (เวลาแบบ wall-clock เก็บเป็น UTC ms, ปัดเป็นนาที) ---------------- */
function toMs(v){

    else if((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$/))){

/* สูตร: จัดกลุ่มตาม สถานี + รหัสหม้อแปลง, ช่วงห่างของแต่ละเหตุ = เริ่ม(i) − เสร็จ(i−1) (> 0) */

/* ---------------- modal ---------------- */
function openModal(title, body, foot = '', wide = false){
  const m = $('modal');
  m.className = 'modal' + (wide ? ' wide' : '');
  m.innerHTML = `<div class="mh"><h3>${title}</h3><button class="xbtn" data-close aria-label="ปิด">${ic('x')}</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}`;
  $('ovl').classList.add('open');
  return m;
}
function closeModal(){ $('ovl').classList.remove('open'); $('modal').innerHTML = ''; }
$('ovl').addEventListener('click', e => { if(e.target.id === 'ovl' || e.target.closest('[data-close]')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('ovl').classList.contains('open')) closeModal(); });
document.addEventListener('click', e => {
  const gt = e.target.closest('[data-gto]'); if(gt){ const t = $(gt.dataset.gto); if(t) t.scrollIntoView({ behavior:'smooth', block:'start' }); return; }
  const b = e.target.closest('[data-info]'); if(!b) return;
  const it = INFO[b.dataset.info]; if(it) openModal(it[0], `<div style="line-height:1.75">${it[1]}</div>`);
});

/* ---------------- shared UI ---------------- */
function ctrlBar(){
  const evAll = scoped({ sheet:'ALL' });
  const yCnt = {}; evAll.forEach(e => { yCnt[e.yy] = (yCnt[e.yy] || 0) + 1; });
  const years = MODEL.sheets.filter(y => yCnt[y]);
  if(S.sheet !== 'ALL' && !years.includes(S.sheet)) S.sheet = 'ALL';
  return `<div class="bar no-print">
    <div class="sel"><label for="sheetSel">ปี:</label><select id="sheetSel" data-sheetsel>
      <option value="ALL">ทุกปี (${years.length} ปี) · ${evAll.length} เหตุ</option>
      ${years.map(y => `<option value="${esc(y)}" ${S.sheet === y ? 'selected' : ''}>${yLabel(y)} (${y}) · ${yCnt[y]} เหตุ</option>`).join('')}
    </select></div>${stnSelect()}</div>`;
}
function stnSelect(){
  const evs = MODEL ? MODEL.events : [], codes = stationCodes();
  if(S.stn !== 'ALL' && !codes.includes(S.stn)) S.stn = 'ALL';
  const cnt = c => { const u = new Set(); let n = 0; evs.forEach(e => { if(c === 'ALL' || e.stn === c){ u.add(e.stn + e.unit); n++; } }); return `${u.size} ลูก · ${n} เหตุ`; };
  return `<div class="sel"><label for="stnSel">สถานี:</label><select id="stnSel" data-stnsel>
      <option value="ALL">${codes.length ? 'ทั้ง ' + codes.length + ' สถานี' : 'ทุกสถานี'} · ${cnt('ALL')}</option>
      ${codes.map(c => `<option value="${esc(c)}" ${S.stn === c ? 'selected' : ''}>${esc(stnName(c))} (${esc(c)}) · ${cnt(c)}</option>`).join('')}
    </select></div>`;
}

function gaugeSvg(v, tgt){
  const lo = Math.min(90, Math.floor(Math.min(fin(v) ? v : 90, tgt) / 10) * 10), hi = 100, cx = 150, cy = 135, r = 100;
  const ang = x => Math.PI * (1 - Math.min(1, Math.max(0, (x - lo) / (hi - lo)))), pt = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  let s = ''; const N = 40;
  for(let i = 0; i < N; i++){
    const a0 = Math.PI * (1 - i / N), a1 = Math.PI * (1 - (i + 1) / N), x = lo + (hi - lo) * (i + .5) / N, t = Math.max(0, Math.min(1, (x - lo) / Math.max(.001, tgt - lo)));
    const c = x >= tgt ? '#3a9a66' : `rgb(${Math.round(200 - t * 20)},${Math.round(110 + t * 60)},90)`;
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1 + .004, r);
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${c}" stroke-width="20" fill="none"/>`;
  }
  [[lo, Math.PI], [hi, 0]].forEach(([l, a]) => { const [x, y] = pt(a, r + 30); s += `<text x="${x}" y="${y + 4}" font-size="12" fill="#8a96ad" text-anchor="middle">${l}%</text>`; });
  const [t0x, t0y] = pt(ang(tgt), r - 16), [t1x, t1y] = pt(ang(tgt), r + 16), [tlx, tly] = pt(ang(tgt), r + 28);
  s += `<line x1="${t0x}" y1="${t0y}" x2="${t1x}" y2="${t1y}" stroke="#14213d" stroke-width="3"/><text x="${tlx}" y="${tly}" font-size="12" fill="#14213d" text-anchor="middle" font-weight="600">${tgt}%</text>`;
  if(fin(v)){ const [nx, ny] = pt(ang(v), r - 18); s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#0b2160" stroke-width="4" stroke-linecap="round"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="8" fill="#0b2160"/>`;
  return `<svg viewBox="0 0 300 150" width="100%" style="max-width:320px" role="img" aria-label="Availability ${fmt(v, 2)}%">${s}</svg>`;
}
/* สีของชนิดปัญหา: เรียงตามจำนวน ใช้ชุดสีเดิมของเว็บ (น้ำเงิน เขียว ส้ม …) */
const MIX_COL = ['#2563eb', '#e07a1f', '#2e8b57', '#7c4dbd', '#d0544c', '#1c9aa8', '#b58a1b', '#5d6b86', '#c2477f', '#4f7a28', '#8a96ad', '#3d5a99'];
function donutSvg(arr, T){
  let a = -Math.PI / 2, s = ''; const r = 78, cx = 95, cy = 95;
  arr.forEach(([k, v], i) => {
    if(!v) return; const c = MIX_COL[i % MIX_COL.length];
    const frac = v / T, b = a + 2 * Math.PI * frac;
    if(frac >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></circle>`;
    else { const l = (b - a) > Math.PI ? 1 : 0, gap = Math.min(.012, (b - a) / 4);
      s += `<path d="M${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}A${r} ${r} 0 ${l} 1 ${(cx + r * Math.cos(b - gap)).toFixed(2)} ${(cy + r * Math.sin(b - gap)).toFixed(2)}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></path>`; }
    a = b;
  });
  return `<svg width="190" height="190" viewBox="0 0 190 190">${s}<text x="95" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#14213d">${T}</text><text x="95" y="118" text-anchor="middle" font-size="12.5" fill="#5d6b86">เหตุทั้งหมด</text></svg>`;
}
/* R รายปีที่หน้าหลัก = สัดส่วนเดือนที่ไม่มีเหตุ [CM] เลย (นับจากข้อมูลจริง)
   ช่วงเดือน: เลือกปีเดียว = 12 เดือนของปีนั้น · ทุกปี = ตั้งแต่เดือนแรกถึงเดือนสุดท้ายของข้อมูลในขอบเขต */
function yearFreeR(st){
  const all = st.units.flatMap(u => u.events);
  if(!all.length) return { avg: NaN, total: 0, per: new Map() };
  let months = [];
  const allYm = MODEL.events.map(e => e.ym).sort(), lo = allYm[0], hi = allYm[allYm.length - 1];   // ไม่นับเดือนที่อยู่นอกช่วงข้อมูล (เช่น เดือนที่ยังมาไม่ถึง)
  if(S.sheet !== 'ALL') months = Array.from({ length: 12 }, (_, i) => S.sheet + '-' + pad(i + 1)).filter(k => k >= lo && k <= hi);
  else { const ys = all.map(e => e.ym).sort(); let [y, m] = ys[0].split('-').map(Number); const [y1, m1] = ys[ys.length - 1].split('-').map(Number);
    while(y < y1 || (y === y1 && m <= m1)){ months.push(y + '-' + pad(m)); m++; if(m > 12){ m = 1; y++; } } }
  if(!months.length) return { avg: NaN, total: 0, per: new Map() };
  const per = new Map();
  st.units.forEach(u => { const hit = new Set(u.events.map(e => e.ym)), free = months.filter(k => !hit.has(k)).length; per.set(u.key, { pct: free / months.length * 100, free, total: months.length }); });
  const vals = [...per.values()];
  return { avg: mean(vals.map(v => v.pct)), freeAvg: mean(vals.map(v => v.free)), total: months.length, per };
}
const ramOf = (model, mttr, v) => { const V = VIEWS[v]; return { R: relR(model, V.m) * 100, M: fin(mttr) && mttr > 0 ? (1 - Math.exp(-V.r / mttr)) * 100 : fin(mttr) ? 100 : NaN }; };

const hmBig = (h, d = 2) => fin(h) && h < 1 ? [fmt(h * 60, 1), 'นาที'] : [fmt(h, d), 'ชม.'];
const hm = (h, d = 2) => hmBig(h, d).join(' ');
function planBase(){
  const P = S.plan, evs = scoped();
  const units = computeUnits(evs).units;
  const u = units.find(x => x.key === P.unit);
  if(!u) return { units, u:null, comps:[], mtbf: DEFAULT_MTBF, mttr: DEFAULT_MTTR, src:'ค่าเริ่มต้น', model: { ok:true, n:0, mtbfE: DEFAULT_MTBF, w:null, rec:'exp', why:'ค่าเริ่มต้น', mode:'', mtbf: DEFAULT_MTBF, fallback:true } };
  const comps = [...new Set(u.events.map(e => compLabel(e.comp)))].sort();
  if(P.comp && !comps.includes(P.comp)) P.comp = '';
  let mtbf = u.mtbf, mttr = u.mttr, src = u.unit, note = '', model = u.model;
  if(P.comp){
    const cu = computeUnits(u.events.filter(e => compLabel(e.comp) === P.comp)).units[0];
    src = u.unit + ' · ' + P.comp;
    if(cu){ mttr = cu.mttr; if(fin(cu.mtbf)){ mtbf = cu.mtbf; model = cu.model; } else { note = `ปัญหานี้มีเหตุ ${cu.n} ครั้ง คำนวณ MTBF ไม่ได้ ใช้ MTBF ของทั้งหม้อแปลง`; } }
  }
  let noMtbf = false;
  if(!fin(mtbf)){ mtbf = DEFAULT_MTBF; model = null; noMtbf = true; note = 'หม้อแปลงนี้มีเหตุครั้งเดียว คำนวณ MTBF ไม่ได้ จึงคำนวณ R และ A ไม่ได้ (คำนวณได้เฉพาะ M และ MTTR)'; }
  const raw = model;   // โมเดลตามไฟล์ต้นฉบับ (ไม่เติมค่าแทน) ใช้ในโหมดคำนวณ MTBF / เวลา t
  // TBF น้อยกว่า 3 ค่า (ไฟล์ต้นฉบับคำนวณ R ไม่ได้) → ในหน้าวางแผนใช้ Exponential จาก MTBF เพื่อให้กรอกเป้าได้
  if(!model || !model.ok){ if(model && model.n > 0) note = (note ? note + ' · ' : '') + `มี TBF ${model.n} ค่า (น้อยกว่า 3) จึงใช้ Exponential จาก MTBF`; model = { ok:true, n: model ? model.n : 0, mtbfE: mtbf, w: null, rec:'exp', why:'ข้อมูล TBF น้อยกว่า 3 ค่า', mode:'', mtbf, fallback:true }; }
  return { units, u, comps, mtbf, mttr, src, note, model, raw, noMtbf };
}

       : o.A && o.A.capCur ? card('A', 'Availability', 'A ของหม้อแปลงนี้ (ค่าจริง)', pctTxt(o.A.A, 2), '%', `${passBadge(o.A.A)}<div style="margin-top:8px">A = MTBF จริง ÷ (MTBF จริง + MTTR จริง) = ${fmt(B.mtbf, 1)} ÷ (${fmt(B.mtbf, 1)} + ${fmt(B.mttr, 2)})</div><div class="note" style="margin-top:6px">มุมมองนี้ใช้ R/M หาเวลา t จากค่าจริงของหม้อแปลง ไม่ได้ตั้งเป้าใหม่ A จึงเป็นค่าจริง · ถ้าต้องการตั้งเป้า A ให้เลือกมุมมอง<b>รายเดือน</b>หรือ<b>รายปี</b></div>`)
       : o.A ? card('A', 'Availability', 'A ปัจจุบัน → A เป้าหมาย', `<span style="font-size:22px;color:var(--soft)">${fmt(o.A0, 2)}% →</span> ${pctTxt(o.A.A, 2)}`, '%', passBadge(o.A.A) + lowerNote(o))
             : card('A', 'Availability', 'A ที่ได้', '–', '', 'กรอก R หรือ M เพื่อดู A หรือกรอก A (%) เพื่อหา MTBF หรือ MTTR ที่ต้องมี');
  } else {
    const V = VIEWS[P.view], fromA = o.A && o.A.fromA;
    const rLbl = o.R ? (o.R.derived ? `MTBF ที่ต้องมี (คำนวณจาก M และ A)` : fromA && !fixM ? 'MTBF (ตรึงไว้)' : 'MTBF ที่ต้องมี') : '';
    const M0 = B.model, isW = M0.rec === 'wb';
    cR = o.R && o.R.timeOnly && P.user.R
      ? card('R', 'โอกาสเสีย (R)', `เวลา t ที่ R(t) = ${pctHtml(100 - o.R.R)}% (${isW ? 'Weibull' : 'Exponential'})`, fmt(o.R.tT, 1), 'ชม.',
          `<div class="rcpar" style="margin:2px 0 6px;background:#fff"><span>MTBF จริงจากข้อมูล</span><b>${fmt(B.mtbf, 1)} ชม.</b></div>เวลา t ไม่ใช่ MTBF · รายละเอียดดูการ์ด "ชั่วโมงที่สอดคล้องกับ R เป้าหมาย"`)
      : o.R && P.user.R ? card('R', 'โอกาสเสีย (R)', `MTBF เป้าหมาย · R ที่ ${V.m.toLocaleString('en-US')} ชม. = ${pctHtml(100 - o.R.R)}% (${isW ? 'Weibull' : 'Exponential'})`, fmt(o.R.mtbf, 1), 'ชม.',
           `MTBF จริงจากข้อมูล <b>${fmt(B.mtbf, 1)} ชม.</b> → เป้าหมาย <b>${fmt(o.R.mtbf, 1)} ชม.</b>${isW && fin(o.R.eta) ? `<br>คง β = ${fmt(M0.w.beta, 3)} · η จริง ${fmt(M0.w.eta, 1)} → เป้าหมาย ${fmt(o.R.eta, 1)} ชม.` : ''}`)
      : o.R ? card('R', 'โอกาสเสีย (R)', `${rLbl} (${isW ? 'Weibull' : 'Exponential'})`, fmt(o.R.mtbf, 1), 'ชม.', `MTBF จริงจากข้อมูล <b>${fmt(B.mtbf, 1)} ชม.</b> · R ${V.name} ${pctHtml(100 - o.R.R)}%`)
             : card('R', 'โอกาสเสีย (R)', P.gSub === 'time' ? 'เวลา t ที่ R(t) = เป้า' : 'MTBF เป้าหมาย', '–', '', P.gSub === 'time' ? `กรอก R (%) เพื่อดูเวลา t ที่สอดคล้องกับ R เป้าหมาย · MTBF จริง ${fmt(B.mtbf, 1)} ชม.` : `กรอก R (%) เพื่อดู MTBF เป้าหมายที่ t = ${V.m.toLocaleString('en-US')} ชม. · MTBF จริง ${fmt(B.mtbf, 1)} ชม. (${isW ? 'Weibull' : 'Exponential'})`);
    const mLbl = o.M ? (o.M.derived ? 'MTTR ต้องไม่เกิน (คำนวณจาก R และ A)' : fromA && fixM ? 'MTTR (ตรึงไว้)' : 'MTTR ต้องไม่เกิน') : '';
    cM = o.M ? card('M', 'Maintainability', mLbl, ...hmBig(o.M.mttr), `ซ่อมเสร็จภายใน ${V.r} ชม. ได้ ≥ ${pctTxt(o.M.M, 2)}% (ปัจจุบัน MTTR ${hm(B.mttr)})`)
             : card('M', 'Maintainability', 'MTTR ต้องไม่เกิน', '–', '', `กรอก M (%) เพื่อดู MTTR ที่ต้องมีที่ t = ${V.r} ชม.`);
    if(o.A && fin(o.A.A)) cA = card('A', 'Availability', o.A.user ? 'A ปัจจุบัน → A เป้าหมาย' : 'A ปัจจุบัน → A ที่ได้', `<span style="font-size:22px;color:var(--soft)">${fmt(o.A0, 2)}% →</span> ${pctTxt(o.A.A, 2)}`, '%', passBadge(o.A.A) + lowerNote(o));
    else if(B.noMtbf) cA = card('A', 'Availability', 'A ที่ได้', '–', '', 'คำนวณไม่ได้ เพราะหม้อแปลงนี้มีเหตุครั้งเดียว (ไม่มี MTBF)');
    else if(o.A && o.A.missing) cA = card('A', 'Availability', 'A ที่ได้', '–', '', `ยังคำนวณไม่ได้ — กรอก ${o.A.missing} เพิ่ม (A ต้องใช้ทั้ง MTBF และ MTTR)`);
    else cA = card('A', 'Availability', 'A ที่ได้', '–', '', 'กรอก R และ M หรือกรอก A');
  }
  const V = VIEWS[P.view] || { m:'t', r:'t' };
  const fx = P.view === 'cap'
    ? `<div><b style="color:var(--R)">${o.R && o.R.custom ? 'MTBF = −t ÷ ln(1 − R/100)' : 't = −MTBF × ln(1 − R/100)'}</b><br>${o.R ? (o.R.custom ? `= −${fmt(o.R.t, 1)} ÷ ln(${pctTxt(o.R.R, 2)} / 100) = ${fmt(o.R.mtbf, 1)} ชม.` : `= −${fmt(B.mtbf, 1)} × ln(${pctTxt(o.R.R, 2)} / 100) = ${fmt(o.R.t, 1)} ชม.`) : 'R(t) = e<sup>−(t/MTBF)</sup> × 100'}</div>
       <div><b style="color:var(--Mtx)">${o.M && o.M.custom ? 'MTTR = −t ÷ ln(1 − M/100)' : 't = −MTTR × ln(1 − M/100)'}</b><br>${o.M ? (o.M.custom ? `= −${fmt(o.M.t, 1)} ÷ ln(1 − ${pctTxt(o.M.M, 2)} / 100) = ${hm(o.M.mttr)}` : `= −${fmt(B.mttr, 2)} × ln(1 − ${pctTxt(o.M.M, 2)} / 100) = ${hm(o.M.t, 1)}`) : 'M(t) = (1 − e<sup>−(t/MTTR)</sup>) × 100'}</div>
       <div><b style="color:var(--text)">อ่านผลอย่างไร</b><br>R: มั่นใจ R% ว่าหม้อแปลงทำงานได้ต่อเนื่องโดยไม่เสียตลอดเวลา t<br>M: มั่นใจ M% ว่าซ่อมเสร็จภายในเวลา t<br>ถ้าต้องการตั้งเป้า A ให้ใช้มุมมองรายเดือนหรือรายปี</div>`
    : `<div>${B.meth === 'wb'
        ? `<b style="color:var(--R)">Weibull: R(t) = (1 − e<sup>−(t/η)<sup>β</sup></sup>) × 100</b> (โอกาสเสีย)<br>ค่าจริง: β = ${fmt(B.model.w.beta, 3)} · η = ${fmt(B.model.w.eta, 1)} ชม. · MTBF = η × Γ(1 + 1/β) = ${fmt(B.mtbf, 1)} ชม.${o.R && fin(o.R.eta) && P.user.R ? `<br>η เป้าหมาย = t ÷ [−ln(1 − R/100)]<sup>1/β</sup><br>= ${V.m.toLocaleString('en-US')} ÷ [−ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100)]<sup>1/${fmt(o.R.beta, 3)}</sup> = ${fmt(o.R.eta, 1)} ชม.<br>MTBF เป้าหมาย = η × Γ(1 + 1/β) = ${fmt(o.R.mtbf, 1)} ชม.` : o.R && !P.user.R ? `<br>R = (1 − e<sup>−(${V.m.toLocaleString('en-US')}/η)<sup>β</sup></sup>) × 100 = ${pctHtml(100 - o.R.R)}% (MTBF ${fmt(o.R.mtbf, 1)} ชม.)` : ''}`
        : `<b style="color:var(--R)">Exponential: R(t) = (1 − e<sup>−(t/MTBF)</sup>) × 100</b> (โอกาสเสีย)<br>ค่าจริง: MTBF = ΣTBF ÷ n = ${fmt(B.mtbf, 1)} ชม.${o.R && P.user.R && !o.R.timeOnly ? `<br>MTBF = −t ÷ ln(1 − R/100)<br>= −${V.m.toLocaleString('en-US')} ÷ ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100) = ${fmt(o.R.mtbf, 1)} ชม.` : o.R && !P.user.R ? `<br>R = (1 − e<sup>−(${V.m.toLocaleString('en-US')}/${fmt(o.R.mtbf, 1)})</sup>) × 100 = ${pctHtml(100 - o.R.R)}%` : ''}`}
         ${o.R && o.R.timeOnly && P.user.R ? `<br><br><b style="color:var(--R)">เวลา t ที่ R(t) = ${pctHtml(100 - o.R.R)}%</b> (คง MTBF จริงและพารามิเตอร์เดิม · ไม่ใช่ MTBF)<br>${B.meth === 'wb' ? `t = η × [−ln(1 − R/100)]<sup>1/β</sup> = ${fmt(B.model.w.eta, 1)} × [−ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100)]<sup>1/${fmt(B.model.w.beta, 3)}</sup>` : `t = −MTBF × ln(1 − R/100) = −${fmt(B.mtbf, 1)} × ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100)`} = ${fmt(o.R.tT, 1)} ชม.` : ''}
         ${o.R && P.user.R && !o.R.timeOnly && !B.noMtbf ? `<br><br><b style="color:var(--R)">เวลาที่รักษา R ${pctHtml(o.R.R)}% ได้ (MTBF จริง)</b><br>${B.meth === 'wb' ? `t = η × (−ln R)<sup>1/β</sup> = ${fmt(B.model.w.eta, 1)} × (−ln ${fmt(o.R.R / 100, 4)})<sup>1/${fmt(B.model.w.beta, 3)}</sup> = ${fmt(relTW(B.model, o.R.R / 100), 1)} ชม.` : `t = −MTBF × ln(R) = −${fmt(B.model.mtbfE, 1)} × ln(${fmt(o.R.R / 100, 4)}) = ${fmt(relTE(B.model, o.R.R / 100), 1)} ชม.`}` : ''}
         ${o.R && o.R.model ? `<br><br><b style="color:var(--R)">ปรับ β (Weibull) ให้ MTBF ไม่สูงกว่าค่าจริง</b><br>β ${fmt(o.R.b0, 3)} → <b>${fmt(o.R.beta, 2)}</b> · η = t ÷ [−ln(R/100)]<sup>1/β</sup> = ${V.m.toLocaleString('en-US')} ÷ [−ln(${fmt(o.R.R / 100, 4)})]<sup>1/${fmt(o.R.beta, 2)}</sup> = ${fmt(o.R.eta, 1)} ชม.<br>MTBF = η × Γ(1 + 1/β) = <b>${fmt(o.R.mtbf, 1)} ชม.</b> · R(${V.m.toLocaleString('en-US')}) = e<sup>−(t/η)<sup>β</sup></sup> = ${pctHtml(o.R.R)}%` : ''}
         <br><br>ระบบแนะนำ <b>${B.rec === 'wb' ? 'Weibull' : 'Exponential'}</b> (TBF < 10 ค่า หรือ 0.9 ≤ β ≤ 1.1 → Exponential)</div>
       <div><b style="color:var(--Mtx)">M(t) = (1 − e<sup>−(t/MTTR)</sup>) × 100</b><br>${o.M && !P.user.M ? `M = (1 − e<sup>−(t/MTTR)</sup>) × 100<br>= (1 − e<sup>−(${V.r}/${fmt(o.M.mttr, 2)})</sup>) × 100 = ${pctHtml(o.M.M)}%` : `MTTR = −t ÷ ln(1 − M/100)${o.M ? `<br>= −${V.r} ÷ ln(1 − ${pctTxt(o.M.M, 2)} / 100) = ${hm(o.M.mttr)}` : ''}`}</div>
       <div><b style="color:var(--Atx)">A = MTBF ÷ (MTBF + MTTR) × 100</b>${o.R && o.M ? `<br>= ${fmt(o.R.mtbf, 1)} ÷ (${fmt(o.R.mtbf, 1)} + ${fmt(o.M.mttr, 2)}) = ${fmt(o.R.mtbf / (o.R.mtbf + o.M.mttr) * 100, 2)}%` : ''}<br>MTTR = MTBF × (100 − A) ÷ A${o.M && o.M.derived ? `<br>= ${fmt(o.R.mtbf, 1)} × (100 − ${fmt(o.A.A, 2)}) ÷ ${fmt(o.A.A, 2)} = ${hm(o.M.mttr)}` : ''}<br>MTBF = (A/100 × MTTR) ÷ (1 − A/100)${o.R && o.R.derived ? `<br>= (${fmt(o.A.A / 100, 4)} × ${fmt(o.M.mttr, 2)}) ÷ ${fmt(1 - o.A.A / 100, 4)} = ${fmt(o.R.mtbf, 1)} ชม.` : ''}${o.A && o.A.fromA ? `<br>(กรอกเฉพาะ A: ตรึง ${fixM ? 'MTTR ' + hm(o.A.mttr) : 'MTBF ' + fmt(o.A.mtbf, 1) + ' ชม.'})` : ''}</div>`;
  const fxEl = out.querySelector('details.fx'); if(fxEl) P.fxOpen = fxEl.open;
  const wasOpen = P.fxOpen !== false;   // แผงสูตรเปิดไว้เป็นค่าเริ่มต้น
  out.innerHTML =
    `${planTimeCard(o, B)}${planModelsCard(o, B)}${planCmpCard(o, B)}
     <div class="grid ${P.view === 'cap' ? 'g2' : 'g3'}">${cR}${cM}${P.view === 'cap' ? '' : cA}</div>
     <details class="card fx" ${wasOpen ? 'open' : ''}><summary><span style="display:flex;gap:8px;align-items:center">${ic('fx')}ดูสูตรที่ใช้</span>${ic('chev', '').replace('class="ic"', 'class="ic chev"')}</summary>
       <div class="grid g3" style="margin-top:14px;font-size:14px;color:var(--soft);line-height:1.7">${fx}</div>
       <div class="note" style="margin-top:10px">e = เลขเนเปียร์ (≈ 2.71828) · รายเดือน t = 720 ชม. (R) / 12 ชม. (M) · รายปี t = 8,760 ชม. (R) / 24 ชม. (M)</div></details>`;
}
/* ---------- โหมด ②: การ์ดชั่วโมงที่สอดคล้องกับ R เป้าหมาย (แยกจากตารางปรับปรุง R) ----------
   สูตรตามไฟล์ต้นฉบับ: Exponential t = −MTBF × ln(1 − R/100) · Weibull t = η × [−ln(1 − R/100)]^(1/β) · คง MTBF, β, η จริง */
function planTimeCard(o, B){
  const P = S.plan;
  if(P.view === 'cap' || P.gSub !== 'time') return '';
  const V = VIEWS[P.view], m = B.model, W = B.meth === 'wb', R0 = relR(m, V.m) * 100;
  const tOf = x => W ? relTW(m, x / 100) : relTE(m, x / 100);
  const has = o.R && o.R.timeOnly && P.user.R;
  const tag = (c, t) => `<span class="ttag ${c}">${t}</span>`;
  return `<div class="card" id="timeCard"><h3>ชั่วโมงที่สอดคล้องกับ R เป้าหมาย · ${esc(B.src)} (${W ? 'Weibull' : 'Exponential'})</h3>
    <div class="warnbox" style="margin-top:8px">โหมดนี้<b>ไม่ใช่การปรับปรุงอุปกรณ์</b> · MTBF, MTTR, β, η คงค่าจริง · เปลี่ยนเฉพาะระยะเวลาประเมิน (t) · R ปัจจุบันวัดที่ ${V.m.toLocaleString('en-US')} ชม. ส่วน R เป้าหมายวัดที่เวลา t จึงไม่นำมาเทียบเป็นดีขึ้นหรือแย่ลง</div>
    <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>ค่า</th><th class="n">ค่า</th><th>ประเภท</th></tr></thead><tbody>
      <tr><td>MTBF</td><td class="n">${fmt(B.mtbf, 1)} ชม.</td><td>${tag('real', 'ข้อมูลจริง · คงที่')}</td></tr>
      ${W ? `<tr><td>β / η</td><td class="n">${fmt(m.w.beta, 3)} / ${fmt(m.w.eta, 1)} ชม.</td><td>${tag('real', 'ข้อมูลจริง · คงที่')}</td></tr>` : ''}
      <tr><td>MTTR</td><td class="n">${hm(B.mttr)}</td><td>${tag('real', 'ข้อมูลจริง · คงที่')}</td></tr>
      <tr><td>R (โอกาสเสีย) ที่ Mission Time ${V.m.toLocaleString('en-US')} ชม.</td><td class="n">${pctTxt(100 - R0, 2)}%</td><td>${tag('real', 'ข้อมูลจริง · คงที่')}</td></tr>
      <tr><td>R (โอกาสเสีย) เป้าหมาย</td><td class="n">${has ? pctTxt(100 - o.R.R, 2) + '%' : '–'}</td><td>${tag('goal', 'เป้าหมาย')}</td></tr>
      <tr><td><b>ชั่วโมงที่ R(t) = R เป้าหมาย</b><div class="note">${W ? 't = η × [−ln(1 − R/100)]<sup>1/β</sup>' : 't = −MTBF × ln(1 − R/100)'}</div></td><td class="n"><b style="font-size:18px;color:var(--R)">${has ? fmt(o.R.tT, 1) + ' ชม.' : '–'}</b>${has && o.R.tT >= 48 ? `<div class="note">≈ ${fmt(o.R.tT / 24, 1)} วัน</div>` : ''}</td><td>${tag('win', 'ระยะเวลาประเมิน · ไม่ใช่ MTBF')}</td></tr>
    </tbody></table></div>
    ${has ? `<div class="note" style="margin-top:8px">${W ? `t = ${fmt(m.w.eta, 1)} × [−ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100)]<sup>1/${fmt(m.w.beta, 3)}</sup>` : `t = −${fmt(B.mtbf, 1)} × ln(1 − ${pctTxt(100 - o.R.R, 2)} / 100)`} = ${fmt(o.R.tT, 1)} ชม.</div>` : '<div class="note" style="margin-top:8px">กรอก R (%) ในข้อ 2 เพื่อดูชั่วโมงที่สอดคล้องกับ R เป้าหมาย</div>'}
    <div class="lbl" style="margin-top:12px">R (โอกาสเสีย) สูงขึ้น → ชั่วโมงเพิ่มขึ้น (MTBF เท่าเดิม)</div>
    <div class="rctbl">${[1, 5, 10, 20, 50].map(x => `<div class="${has && Math.abs(x - (100 - o.R.R)) < 1e-9 ? 'on' : ''}"><span>R ${x}%</span><b>${fmt(tOf(100 - x), 1)} ชม.</b></div>`).join('')}</div>
  </div>`;
}
/* ---------- การ์ดเปรียบเทียบ ก่อน / หลัง ---------- */
/* ป้ายผล (แบบ 2): ทิศทาง + ความหมาย · ดี = ไปทางที่ต้องการ (เขียว) · ควรทบทวน = สวนทาง (ส้ม) */
function dirBadge(x, y, st, isPct){
  if(st === 0) return '<span class="badge mute" style="font-size:12.5px">เท่าเดิม</span>';
  const up = y > x, pc = x !== 0 ? Math.abs((y - x) / x * 100) : NaN;
  const sm = (v, d) => v < Math.pow(10, -d) / 2 ? '<' + Math.pow(10, -d).toFixed(d) : fmt(v, d), amt = isPct ? sm(Math.abs(y - x), 2) + ' จุด' : fin(pc) ? sm(pc, 1) + '%' : '';
  return `<span class="badge ${st > 0 ? 'ok' : 'warn'}" style="font-size:12.5px">${up ? '▲ +' : '▼ −'}${amt} · ${st > 0 ? 'ดี' : 'ควรทบทวน'}</span>`;
}
const cmpState = (x, y, dir) => !fin(x) || !fin(y) ? null : Math.abs(y - x) < 1e-9 ? 0 : (y - x) * dir > 0 ? 1 : -1;   // 1 ดีขึ้น · 0 เท่าเดิม · −1 แย่ลง

  paintSlideRes(B);

function paintSlideRes(B){

}

/* ---------- Pareto (หลัก 80/20) ---------- */
S.rank = { pareto:'comp' };
S.cmp = { a:'', b:'' };
const PARETO_BY = { comp:['ปัญหา', e => compLabel(e.comp)], cause:['สาเหตุ', e => causeLabel(e.cause)], unit:['หม้อแปลง', e => e.unit] };
function paretoData(evs, by){
  const keyf = PARETO_BY[by][1], o = {};
  evs.forEach(e => { const k = keyf(e); (o[k] = o[k] || []).push(e); });
  let arr = Object.entries(o).map(([k, list]) => ({ k, n: list.length, list })).sort((a, b) => b.n - a.n || a.k.localeCompare(b.k));
  const MAX = 12;
  if(arr.length > MAX){ const rest = arr.slice(MAX - 1); arr = arr.slice(0, MAX - 1).concat([{ k: `อื่น ๆ (${rest.length} รายการ)`, n: rest.reduce((t, r) => t + r.n, 0), list: rest.flatMap(r => r.list), other: true }]); }
  const T = evs.length; let cum = 0;
  arr.forEach(a => { a.before = cum / T * 100; cum += a.n; a.cum = cum / T * 100; a.pct = a.n / T * 100; a.vital = a.before < 80 && !a.other; });
  return arr;
}
function paintPareto(evs){
  const el = $('paretoCard'); if(!el) return; destroyChart('pareto');
  const by = S.rank.pareto, arr = paretoData(evs, by), vital = arr.filter(a => a.vital), nCat = new Set(evs.map(PARETO_BY[by][1])).size;
  const vitalPct = vital.length ? vital[vital.length - 1].cum : 0, max = arr.length ? arr[0].n : 1;
  let crossed = false;
  const rows = arr.map((a, i) => {
    let line = '';
    if(!crossed && a.before < 80 && a.cum >= 80){ crossed = true; line = `<div class="p80"><span>ถึง 80% ของเหตุทั้งหมด</span></div>`; }
    return `<div class="prow ${a.vital ? 'vital' : ''}" data-pidx="${i}" title="${esc(a.k)}: ${a.n} เหตุ (${fmt(a.pct, 1)}%) · สะสม ${fmt(a.cum, 1)}%">
      <span class="pl">${esc(a.k)}</span><span class="pb"><i style="width:${a.n / max * 100}%"></i></span><span class="pn">${a.n}</span><span class="pc">${fmt(a.cum, 0)}%</span></div>${line}`;
  }).join('');
  el.innerHTML = `<div class="bar"><h3>Pareto · ${PARETO_BY[by][0]}ที่ทำให้เกิดเหตุ ${info('pareto')}</h3>
      <div class="right seg no-print">${Object.entries(PARETO_BY).map(([k, v]) => `<button data-pareto="${k}" class="${by === k ? 'on' : ''}">${v[0]}</button>`).join('')}</div></div>
    ${vital.length ? `<div class="sub" style="margin-top:4px"><b style="color:var(--text)">${vital.length} จาก ${nCat} ${PARETO_BY[by][0]}</b> ทำให้เกิด <b style="color:var(--text)">${fmt(vitalPct, 0)}%</b> ของเหตุทั้งหมด · แก้กลุ่มสีเข้มก่อนจะลดเหตุได้มากที่สุด</div>` : ''}
    <div class="phead"><span class="pl">${PARETO_BY[by][0]}</span><span class="pb"></span><span class="pn">เหตุ</span><span class="pc">สะสม</span></div>
    <div class="plist">${rows}</div>
    <div class="note" style="margin-top:8px">เรียงจากมากไปน้อย · ตัวเลขขวาสุด = % สะสม · คลิกแถวเพื่อดูรายการเหตุ</div>`;
  el.querySelectorAll('[data-pidx]').forEach(r => r.onclick = () => { const a = arr[+r.dataset.pidx]; openEventList(`${PARETO_BY[by][0]}: ${a.k} · ${a.n} เหตุ (${fmt(a.pct, 1)}%)`, a.list.slice().sort((x, y) => y.from - x.from)); });
}

/* ---------- เปรียบเทียบช่วงเวลา ---------- */
function cmpPeriods(){
  const evs = scoped({ sheet:'ALL' });
  const years = [...new Set(evs.map(e => e.yy))].sort();
  const opts = years.map(y => ({ v:'Y:' + y, label:`ปี ${+y + 543} (${y})` }));
  return { evs, years, sheets: [], opts };
}
function cmpPick(evs, v){ const [t, x] = [v.slice(0, 1), v.slice(2)]; return evs.filter(e => t === 'Y' ? e.yy === x : e.sheet === x); }
function cmpLabel(v){ return v.startsWith('Y:') ? `ปี ${+v.slice(2) + 543}` : 'ชีต ' + v.slice(2); }
function paintCompare(){
  const el = $('cmpCard'); if(!el) return;
  const P = cmpPeriods(), C = S.cmp;
  const valid = v => P.opts.some(o => o.v === v);
  if(!valid(C.a) || !valid(C.b)){
    if(P.years.length >= 2){ C.a = 'Y:' + P.years[P.years.length - 2]; C.b = 'Y:' + P.years[P.years.length - 1]; }
    else if(P.sheets.length >= 2){ C.a = 'S:' + P.sheets[P.sheets.length - 2]; C.b = 'S:' + P.sheets[P.sheets.length - 1]; }
  }
  const head = `<div class="bar"><h3>เปรียบเทียบช่วงเวลา ${info('compare')}</h3></div>`;
  if(P.opts.length < 2 || !C.a){ el.innerHTML = head + '<div class="note" style="margin-top:8px">ต้องมีข้อมูลอย่างน้อย 2 ปี จึงจะเปรียบเทียบได้</div>'; return; }
  const sel = (id, v) => `<select class="fld" id="${id}" style="width:auto;min-width:200px">${P.opts.map(o => `<option value="${esc(o.v)}" ${o.v === v ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
  const LA = cmpPick(P.evs, C.a), LB = cmpPick(P.evs, C.b), A = stats(LA), B = stats(LB);
  const mA = new Set(LA.map(e => e.ym)).size, mB = new Set(LB.map(e => e.ym)).size;
  const cd = mA === mB ? 'down' : null;   // ช่วงยาวไม่เท่ากัน → ยอดรวมเทียบตรง ๆ ไม่ได้ จึงไม่ระบายสีดี/แย่
  const rows = [
    ['จำนวนเหตุ', A.n, B.n, cd, v => fmt(v, 0)],
    ['เดือนที่มีข้อมูล', mA, mB, null, v => fmt(v, 0)],
    ['เหตุต่อเดือน', mA ? A.n / mA : NaN, mB ? B.n / mB : NaN, 'down', v => fmt(v, 1)],
    ['จำนวนหม้อแปลงที่เกิดเหตุ', A.nUnits, B.nUnits, cd, v => fmt(v, 0)],
    ['MTBF เฉลี่ย (วัน)', A.mtbfH / 24, B.mtbfH / 24, 'up', v => fmt(v, 2)],
    ['MTTR เฉลี่ย (ชม.)', A.mttrH, B.mttrH, 'down', v => fmt(v, 2)],
    ['Availability เฉลี่ย (%)', A.A, B.A, 'up', v => fmt(v, 3)],
    ['Priority 1 (เหตุ)', LA.filter(e => +e.prio === 1).length, LB.filter(e => +e.prio === 1).length, cd, v => fmt(v, 0)],
    ['เริ่ม = เสร็จ (% ของเหตุ)', A.n ? A.nQ / A.n * 100 : NaN, B.n ? B.nQ / B.n * 100 : NaN, 'down', v => fmt(v, 1)]
  ];
  const delta = (a, b, dir, f) => {

/* สรุปภาพรวม + สถานะหม้อแปลงรายลูก (เดิมอยู่หน้าภาพรวมหม้อแปลง ย้ายมาหน้าหลัก) ใช้ปุ่มรายเดือน/รายปีของการ์ด R/A/M */
function ovParts(evs, st){
  const V = VIEWS[S.home.ramView], thr = SETTINGS.threshold;
  const nameOnly = s => String(s).replace(/ \([^)]*\)$/, '');
  const YF = V.m === 8760 ? yearFreeR(st) : null;
  const U = st.units.map(u => { const R = YF ? YF.per.get(u.key).pct : relR(u.model, V.m) * 100, M = u.mttr > 0 ? (1 - Math.exp(-V.r / u.mttr)) * 100 : 100;
    const cnt = {}; u.events.forEach(e => { cnt[e.comp] = (cnt[e.comp] || 0) + 1; });
    const top = Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))[0];
    return { u, R, M, A: u.A, top, dt: u.events.reduce((a, e) => a + e.dur, 0) }; });
  const top = ramOf(st.model, st.mttrH, S.home.ramView), aR = YF ? YF.avg : top.R, aM = top.M, aA = st.A;
  const below = x => fin(x.A) && x.A < thr;
  const care = U.slice().sort((a, b) => (below(b) - below(a)) || ((fin(a.R) ? 0 : 1) - (fin(b.R) ? 0 : 1)) || ((a.R || 0) + a.M) - ((b.R || 0) + b.M) || b.u.n - a.u.n);
  const nBelow = U.filter(below).length, worst = care[0], second = care[1];
  const rank = U.slice().sort((a, b) => String(a.u.unit).localeCompare(String(b.u.unit), 'th', { numeric:true }));
  const durBy = {}; evs.forEach(e => { const k = e.comp || ''; durBy[k] = (durBy[k] || 0) + e.dur; });
  const totDur = evs.reduce((a, e) => a + e.dur, 0);
  const longP = Object.entries(durBy).sort((a, b) => b[1] - a[1])[0];
  const years = new Set(evs.map(e => e.yy)).size || 1;
  const box = (bg, fg, lab, title, body) => `<div style="border-radius:12px;padding:12px 14px;background:${bg}"><div class="note">${lab}</div><div style="font-size:16px;font-weight:700;color:${fg};margin-top:4px">${title}</div><div style="font-size:13.5px;margin-top:4px;line-height:1.6">${body}</div></div>`;
  const okAll = fin(st.A) && st.A >= thr && !nBelow;
  const b1 = box(okAll ? 'var(--Abg)' : 'var(--badbg)', okAll ? 'var(--Atx)' : 'var(--bad)', 'ภาพรวม',
    fin(st.A) ? `${okAll ? '✅' : '⚠️'} A เฉลี่ย ${fmt(st.A, 2)}% ${st.A >= thr ? 'ผ่าน' : 'ต่ำกว่า'}เกณฑ์ ${thr}%` : 'A คำนวณไม่ได้ (ข้อมูลไม่พอ)',
    `${nBelow ? `<b>${nBelow} ลูก</b>ต่ำกว่าเกณฑ์` : 'ทุกลูกผ่านเกณฑ์'} · เสียรวม ${st.n} ครั้ง${years > 1 ? `ใน ${years} ปี (≈ ${fmt(st.n / years, 1)} ครั้ง/ปี)` : ''} · MTTR เฉลี่ย ${hm(st.mttrH)}`);
  const b2 = worst ? box('var(--badbg)', 'var(--bad)', 'ลูกที่ควรดูแลก่อน', `⚠️ ${esc(worst.u.unit)} (${esc(stnName(worst.u.stn))})`,
    `เสีย ${worst.u.n} ครั้ง · R ${V.name === 'รายเดือน' ? '1 เดือน' : '1 ปี'} ${fin(worst.R) ? fmt(worst.R, 1) + '%' : '–'} · A ${fin(worst.A) ? fmt(worst.A, 2) + '%' : '–'} · ปัญหาหลัก ${esc(nameOnly(compLabel(worst.top[0])))} (${worst.top[1]} ครั้ง)`) : '';
  const b3 = longP ? box('#fff2e5', 'var(--Mtx)', 'ปัญหาที่ทำให้หยุดนานที่สุด', `🔧 ${esc(nameOnly(compLabel(longP[0])))}`,
    `หยุดรวม ${fmt(longP[1], 1)} ชม. (${fmt(longP[1] / totDur * 100, 0)}% ของเวลาซ่อมทั้งหมด) · ซ่อมเฉลี่ย ${hm(mean(evs.filter(e => (e.comp || '') === longP[0]).map(e => e.dur)))}/ครั้ง${st.comp[0] && st.comp[0][0] !== compLabel(longP[0]) ? ` · ปัญหาที่เกิดบ่อยสุดคือ ${esc(nameOnly(st.comp[0][0]))}` : ''}`) : '';
  const recs = [];
  if(worst) recs.push(`หาสาเหตุ "${esc(nameOnly(compLabel(worst.top[0])))}" ที่ <b>${esc(worst.u.unit)}</b> (เกิด ${worst.top[1]} ครั้ง)`);
  if(longP) recs.push(`เตรียมอะไหล่และขั้นตอนซ่อม <b>"${esc(nameOnly(compLabel(longP[0])))}"</b> เพื่อลด MTTR`);
  if(second) recs.push(`ติดตาม <b>${esc(second.u.unit)}</b> ที่ควรดูแลเป็นอันดับ 2`);
  const pill = (lab, v, a, isA) => { const k = !fin(v) ? 'na' : isA && v < thr ? 'bad' : v >= a ? 'ok' : 'warn';
    const c = { ok:['var(--Abg)','var(--Atx)'], warn:['#fff2e5','var(--Mtx)'], bad:['var(--badbg)','var(--bad)'], na:['var(--line2)','var(--faint)'] }[k];
    return `<div style="flex:1;min-width:0;border-radius:10px;padding:8px 10px;background:${c[0]}"><div style="font-size:12px;color:var(--soft)">${lab}</div><div style="font-size:18px;font-weight:700;color:${c[1]};white-space:nowrap">${fin(v) ? fmt(v, isA ? 2 : 1) + '%' : '–'}</div></div>`; };
  const tR = V.m === 720 ? '1 เดือน' : '1 ปี';
  return { summary: `  <div class="card" style="border:2px solid #1c3a7a">
    <div class="bar"><h3 style="font-size:18px">📋 สรุปภาพรวม ${info('ovsum')}</h3><span class="note" style="margin-left:auto">${esc(scopeTxt())} · อัปเดตอัตโนมัติจากข้อมูล</span></div>
    <div class="grid g3" style="margin-top:12px;gap:12px">${b1}${b2}${b3}</div>
    ${recs.length ? `<div class="warnbox" style="margin-top:12px;background:#f5f8fe;border-color:var(--line);color:var(--text);line-height:1.7"><b>ข้อเสนอแนะ:</b> ${recs.map((r, i) => `${'①②③'[i]} ${r}`).join(' · ')}</div>` : ''}
  </div>`,
    units: `<div class="card"><div class="bar"><h3>สถานะหม้อแปลงรายลูก ${info('ovcards')}</h3></div>
    <div class="note" style="margin-top:4px">เรียงตามชื่อหม้อแปลง · กรอบสีแดงคือลูกที่ควรดูแลก่อน · 🟢 ดีกว่าค่าเฉลี่ย · 🟠 ต่ำกว่าค่าเฉลี่ย · 🔴 ต่ำกว่าเกณฑ์ A · ${YF ? 'R รายปี = สัดส่วนเดือนที่ไม่มีเหตุเสีย (นับจากข้อมูลจริง)' : 'R ' + V.name}</div>
    <div class="grid g3" style="margin-top:12px;gap:12px">${rank.map((x, i) => `<div class="ovcard" data-drillunit="${esc(x.u.key)}" style="border:1px solid ${x === worst ? '#f0c9c6' : 'var(--line)'};border-radius:14px;padding:12px 14px;cursor:pointer">
      <div class="bar"><b style="font-size:16px">${esc(x.u.unit)}</b><span class="note" style="margin-left:auto">${esc(stnName(x.u.stn))} · ${x.u.n} เหตุ</span></div>
      <div style="display:flex;gap:8px;margin-top:10px">${pill('R ' + tR, x.R, aR)}${pill('A', x.A, aA, true)}${pill(`M ${V.r} ชม.`, x.M, aM)}</div>
      <div class="note" style="margin-top:8px">${x.u.model && x.u.model.ok ? `<b style="color:var(--text)">${recName(x.u.model)}</b>${x.u.model.w ? ` · β ${fmt(x.u.model.w.beta, 2)} ${x.u.model.w.beta > 1.05 ? 'เสียจากการสึกหรอ' : x.u.model.w.beta < 0.95 ? 'เสียช่วงต้น' : 'เสียแบบสุ่ม'}` : ''}<br>` : x.u.model && x.u.model.n > 0 ? `<span style="color:var(--Mtx)">TBF ${x.u.model.n} ค่า คำนวณ R ไม่ได้</span><br>` : ''}MTBF ${fin(x.u.mtbf) ? fmt(x.u.mtbf, 0) + ' ชม. · เสียเฉลี่ย ' + fmt(8760 / x.u.mtbf, 1) + ' ครั้ง/ปี' : '– (เหตุครั้งเดียว)'} · MTTR ${hm(x.u.mttr)} · ปัญหาหลัก ${esc(x.top[0] || 'ไม่ระบุ')} (${x.top[1]})</div></div>`).join('')}</div>
    <div class="note" style="margin-top:10px">ค่าเฉลี่ยของทุกลูก: R ${fin(aR) ? fmt(aR, 1) + '%' : '–'} · A ${fin(aA) ? fmt(aA, 2) + '%' : '–'} · M ${fin(aM) ? fmt(aM, 1) + '%' : '–'} · คลิกการ์ดเพื่อดูรายการเหตุ</div></div>` };
}

function requireAdmin(){ if(!S.admin){ openLogin(); return false; } return true; }
$('uploadBtn').onclick = () => { if(requireAdmin()) $('fileInput').click(); };
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('โหลดไลบรารีอ่าน Excel ไม่ได้ (ต้องใช้อินเทอร์เน็ตในการเปิดเว็บครั้งแรก)'); return; }
  const rd = new FileReader();
  rd.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
      const sheets = wb.SheetNames.map(n => ({ name:n, rows: sheetRows(wb, n), cols: sheetCols(wb, n) })).filter(s => s.rows.length);
      if(!sheets.length){ alert('ไม่พบแถวข้อมูลที่มีคอลัมน์ Service Request / Summary / สถานที่ติดตั้ง ในไฟล์นี้'); return; }
      if(sheets.length === 1) ingest(sheets, sheets.map(s => s.name), file.name);
      else openSheetPicker(sheets, file.name);
    }catch(err){ alert('อ่านไฟล์ไม่ได้: ' + err.message); }
  };
  rd.readAsArrayBuffer(file);
});
function openSheetPicker(sheets, fname){
  const m = openModal('เลือกชีตที่จะนำเข้า', `<div class="sub">ไฟล์ ${esc(fname)} มี ${sheets.length} ชีต ติ๊กชีตที่มีทั้ง Actual Start และ Actual Finish ไว้ให้แล้ว ระบบจะตัดแถวซ้ำ (เลข Service Request เดียวกัน) ให้เอง</div>
    <div style="display:flex;gap:8px"><button class="btn sm" id="pkAll">เลือกทั้งหมด</button><button class="btn sm" id="pkNone">ไม่เลือกเลย</button></div>
    ${sheets.map(s => `<label class="chk-row"><input type="checkbox"${s.cols.includes('start') && s.cols.includes('finish') ? ' checked' : ''} value="${esc(s.name)}"><span style="flex:1">${esc(s.name)}</span><span class="note">${s.rows.length} แถว</span></label>`).join('')}`,
    `<button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="pkOk">${ic('up')}นำเข้า</button>`);
  const boxes = () => [...m.querySelectorAll('input[type=checkbox]')];
  $('pkAll').onclick = () => boxes().forEach(b => b.checked = true);
  $('pkNone').onclick = () => boxes().forEach(b => b.checked = false);
  $('pkOk').onclick = () => { const sel = boxes().filter(b => b.checked).map(b => b.value); if(!sel.length){ alert('กรุณาเลือกอย่างน้อย 1 ชีต'); return; } closeModal(); ingest(sheets, sel, fname); };
}
function ingest(sheets, names, fname){
  const all = []; sheets.filter(s => names.includes(s.name)).forEach(s => all.push(...s.rows));
  const rows = all.filter(r => !isPM(r)), pmDropped = all.length - rows.length;   // ตัดงาน PM ออกตั้งแต่ตอนอัปโหลด
  DATA = { rows, source: fname, uploadedAt: Date.now(), pmDropped };
  S.sheet = 'ALL'; S.home.open.clear(); S.py = { status:'idle', result:null, err:'' };
  audit('อัปโหลดไฟล์ Excel', `${fname} · ${names.length} ชีต · ${all.length} แถว (ตัด PM ${pmDropped})`);
  markDirty(); rebuild();
  showImportReport(sheets.filter(s => names.includes(s.name)), fname, all.length, pmDropped);
}
function showImportReport(sheets, fname, nRead, pmDropped){
  const m = MODEL, used = m.events.length;
  const cols = new Set(); sheets.forEach(s => (s.cols || []).forEach(c => cols.add(c)));
  const need = [['loc','รหัสหม้อแปลง'], ['start','เวลาเริ่มซ่อม'], ['finish','เวลาซ่อมเสร็จ'], ['summary','แยกงาน CM/PM']].filter(([c]) => !cols.has(c));
  const show = v => v === '' || v == null ? '(ว่าง)' : typeof v === 'number' && v > 20000 ? fmtDT(toMs(v)) : v;
  const reasons = [['missing','ไม่มี Actual Start หรือ Actual Finish (หรืออ่านรูปแบบวันที่ไม่ได้)'], ['reversed','Actual Finish ก่อน Actual Start'], ['long','ซ่อมนานเกิน 1 ปี']].filter(([k]) => m.ex[k]);
  const sample = r => `${esc(r.sr || unitOf(r))} · ${esc(show(r.start))} → ${esc(show(r.finish))}`;
  const droppedAll = m.uniqCount && !used;
  const units = new Set(m.events.map(e => e.unit)).size;
  openModal('ผลการนำเข้า', `
    <div class="${droppedAll ? 'errbox' : 'warnbox'}" style="${!droppedAll && !reasons.length && !m.ex.zero ? 'background:var(--Abg);border-color:var(--Abd);color:var(--Atx)' : ''}">
      ${droppedAll ? '<b>ไม่มีแถวที่ใช้คำนวณได้เลย</b> ดูสาเหตุด้านล่าง' : `ใช้คำนวณได้ <b>งานซ่อม [CM] ${used} เหตุ · หม้อแปลง ${units} ลูก</b>`}</div>
    <dl class="kv"><dt>ไฟล์</dt><dd>${esc(fname)} · ${sheets.length} ชีต</dd><dt>แถวที่อ่านได้</dt><dd>${nRead} แถว</dd>
      <dt>งาน [PM] ที่ตัดออก</dt><dd>${pmDropped} แถว <span class="note">(บำรุงรักษาตามแผน ไม่นำมาคำนวณ R/A/M)</span></dd>
      <dt>งาน [CM]</dt><dd>${m.rawCount} แถว (ซ้ำ ${m.dupes} → เหลือ ${m.uniqCount})</dd>
      <dt>ช่วงข้อมูล</dt><dd>${m.sheets.length ? `${yLabel(m.sheets[0])} – ${yLabel(m.sheets[m.sheets.length - 1])} (${m.sheets.length} ปี)` : '–'}</dd></dl>
    ${need.length ? `<div class="errbox">ไม่พบคอลัมน์: ${need.map(([c, n]) => `<b>${FIELD_NAME[c]}</b> (${n})`).join(', ')}<br>ชื่อคอลัมน์ต้องตรงกับไฟล์ตัวอย่าง (Service Request, Summary, สถานที่ติดตั้ง, Actual Start, Actual Finish, …) และอยู่ใน 15 แถวแรกของชีต</div>` : ''}
    ${reasons.length ? `<div class="lbl" style="margin-top:4px">แถวที่ตัดออก ${reasons.reduce((s, [k]) => s + m.ex[k], 0)} แถว</div>
      <div class="tbl-wrap"><table><thead><tr><th>สาเหตุ</th><th class="n">แถว</th><th>ตัวอย่าง (SR · เริ่ม → เสร็จ)</th></tr></thead><tbody>
      ${reasons.map(([k, n]) => `<tr><td>${n}</td><td class="n">${m.ex[k]}</td><td class="mono" style="font-size:12px">${m.exSample[k].map(sample).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${m.ex.zero ? `<div class="warnbox"><b>เก็บไว้ ${m.ex.zero} แถว</b> ที่ Actual Start = Actual Finish (ไม่ตัดทิ้ง) นับเป็นซ่อม 0 นาที และติดธง "เริ่ม = เสร็จ" ให้เห็นในหน้าหลัก<div class="mono" style="font-size:12px;margin-top:6px">${m.exSample.zero.map(sample).join('<br>')}</div></div>` : ''}
    <div class="note">ข้อมูลยังไม่ถูกบันทึก กด "บันทึกการเปลี่ยนแปลง" ด้านบนเพื่อเก็บไว้ในเบราว์เซอร์นี้</div>`,
    `<button class="btn pri" data-close>ตกลง</button>`, true);
}
$('addRecordBtn').onclick = () => {

  const opts = (list, lab) => [...new Set(list.filter(Boolean))].sort().map(c => `<option value="${esc(c)}">${esc(lab ? lab(c) : c)}</option>`).join('');
  const units = [...new Set(evs.map(e => e.raw.loc).filter(Boolean))].sort();
  openModal('เพิ่มรายการใหม่ (งานซ่อม CM)', `<div class="form-grid">
    <div><div class="lbl">สถานที่ติดตั้ง</div><input class="fld" id="nLoc" list="dlLoc" placeholder="เช่น คอต่อ (KO-TR.1)"><datalist id="dlLoc">${units.map(u => `<option value="${esc(u)}">`).join('')}</datalist></div>
    <div><div class="lbl">Service Request <span class="note">(ไม่บังคับ)</span></div><input class="fld" id="nSr" placeholder="เช่น SR-2026-00123"></div>
    <div><div class="lbl">เริ่มซ่อม (Actual Start)</div><input class="fld" type="datetime-local" id="nFrom"></div>
    <div><div class="lbl">ซ่อมเสร็จ (Actual Finish)</div><input class="fld" type="datetime-local" id="nTo"></div>
    <div><div class="lbl">ปัญหา (Problem Code)</div><input class="fld" id="nProb" list="dlProb" placeholder="เช่น P-FAN"><datalist id="dlProb">${opts(Object.keys(PROB_TH).concat(evs.map(e => e.comp)), compLabel)}</datalist></div>
    <div><div class="lbl">สาเหตุ (Cause)</div><input class="fld" id="nCause" list="dlCause" placeholder="เช่น C-MOTOR"><datalist id="dlCause">${opts(Object.keys(CAUSE_TH).concat(evs.map(e => e.cause)), causeLabel)}</datalist></div>
    <div><div class="lbl">Priority</div><select class="fld" id="nPrio"><option value="1">1 · เร่งด่วนมาก</option><option value="2" selected>2 · เร่งด่วน</option><option value="3">3 · ปกติ</option></select></div>
    <div><div class="lbl">แจ้งเสีย (Reported) <span class="note">(ไม่บังคับ)</span></div><input class="fld" type="datetime-local" id="nRep"></div>
    <div style="grid-column:1/-1"><div class="lbl">รายละเอียด (Summary)</div><input class="fld" id="nSum" placeholder="เช่น พัดลมหม้อแปลงชำรุด ตรวจสอบและแก้ไขมอเตอร์"></div>
  </div><div id="nErr"></div>`, `<button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="nOk">${ic('plus')}เพิ่มรายการ</button>`, true);
  $('nOk').onclick = () => {
    const loc = $('nLoc').value.trim();
    const f = toMs($('nFrom').value.replace('T', ' ')), t = toMs($('nTo').value.replace('T', ' ')), rep = toMs($('nRep').value.replace('T', ' '));
    const err = [];
    if(!loc) err.push('กรอกสถานที่ติดตั้ง เช่น คอต่อ (KO-TR.1)'); else if(!/\([^)]+\)/.test(loc)) err.push('ใส่รหัสหม้อแปลงในวงเล็บ เช่น คอต่อ (KO-TR.1)');
    if(!fin(f) || !fin(t)) err.push('กรอกเวลาเริ่มซ่อมและซ่อมเสร็จ'); else if(t <= f) err.push('เวลาซ่อมเสร็จต้องหลังเวลาเริ่มซ่อม');
    if(err.length){ $('nErr').innerHTML = `<div class="errbox">${err.join('<br>')}</div>`; return; }
    const unit = loc.match(/\(([^)]+)\)/)[1].trim(), sum = $('nSum').value.trim();
    const row = { sheet: 'เพิ่มเอง', sr: $('nSr').value.trim(), summary: `[CM] ${unit} ${sum}`.trim(), loc, fail: '', prob: $('nProb').value.trim(), cause: $('nCause').value.trim(),
      prio: +$('nPrio').value, start: msToSerial(f), finish: msToSerial(t), wc: '', status: 'CLOSED', reported: fin(rep) ? msToSerial(rep) : '', by: S.admin || '' };
    DATA.rows = (DATA.rows || []).concat([row]);
    audit('เพิ่มรายการ', `${unit} ${fmtDT(f)}`);
    closeModal(); markDirty(); rebuild(); toast('เพิ่มรายการแล้ว — อย่าลืมกดบันทึก');
  };
};

/* บัญชีแอดมินตั้งต้น: ใช้ได้เฉพาะเบราว์เซอร์ที่ยังไม่มีแอดมิน · เข้าแล้วระบบแนะนำให้เปลี่ยนชื่อและรหัสทันที */
const DEF_ADMIN = { name: 'A', pw: '12345678' };
const isDefAdmin = a => a && a.name === DEF_ADMIN.name && a.h === hashPw(DEF_ADMIN.name, DEF_ADMIN.pw);
const hasDefAdmin = () => admins().some(isDefAdmin);
function cyrb53Legacy(str, seed = 0){
  let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function openLogin(){
  const first = !admins().length;
  openModal('เข้าสู่ระบบแอดมิน', `${first ? `<div class="warnbox">เบราว์เซอร์นี้ยังไม่มีแอดมิน ใช้บัญชีตั้งต้น ชื่อ <b>${DEF_ADMIN.name}</b> รหัสผ่าน <b>${DEF_ADMIN.pw}</b> แล้ว<b>เปลี่ยนชื่อและรหัสผ่านทันที</b>หลังเข้าสู่ระบบ</div>` : ''}
    <div><div class="lbl">ชื่อ</div><input class="fld" id="lgName" autocomplete="username"></div>
    <div><div class="lbl">รหัสผ่าน</div><input class="fld" id="lgPw" type="password" autocomplete="current-password"></div>
    <div class="note">ล็อกอินนี้ทำงานในเบราว์เซอร์เท่านั้น ไม่ใช่ระบบความปลอดภัยจริง ใช้กันการแก้ไขข้อมูลโดยไม่ตั้งใจ</div><div id="lgErr"></div>`,
    `<button class="btn" data-close>ยกเลิก</button><button class="btn pri" id="lgOk">${ic('lock')}เข้าสู่ระบบ</button>`);
  const go = () => {
    const n = $('lgName').value.trim(), p = $('lgPw').value;
    if(!n || !p){ $('lgErr').innerHTML = '<div class="errbox">กรอกชื่อและรหัสผ่าน</div>'; return; }
    if(!admins().length){
      if(n !== DEF_ADMIN.name || p !== DEF_ADMIN.pw){ $('lgErr').innerHTML = `<div class="errbox">ครั้งแรกใช้ชื่อ ${DEF_ADMIN.name} รหัสผ่าน ${DEF_ADMIN.pw}</div>`; return; }
      store.set('admins', [{ name: DEF_ADMIN.name, h: hashPw(DEF_ADMIN.name, DEF_ADMIN.pw) }]);
    }
    const a = admins().find(x => x.name.toLowerCase() === n.toLowerCase() && x.h === hashPw(x.name, p));
    if(!a){ $('lgErr').innerHTML = '<div class="errbox">ชื่อหรือรหัสผ่านไม่ถูกต้อง</div>'; return; }
    S.admin = a.name; sess.set(a.name); audit('เข้าสู่ระบบ', isDefAdmin(a) ? 'บัญชีตั้งต้น' : '');
    closeModal(); paintChrome(); renderPage(); toast('เข้าสู่ระบบแล้ว');
    if(isDefAdmin(a)) setTimeout(openChangeDefault, 120);
  };
  $('lgOk').onclick = go;
  $('modal').addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  setTimeout(() => { const x = $('lgName'); if(x) x.focus(); }, 30);
}
/* แนะนำให้เปลี่ยนบัญชีตั้งต้น: สร้างแอดมินใหม่ ลบบัญชี A แล้วเข้าสู่ระบบด้วยชื่อใหม่ */
function openChangeDefault(){
  openModal('แนะนำให้เปลี่ยนชื่อและรหัสผ่านทันที', `<div class="warnbox">ตอนนี้ใช้บัญชีตั้งต้น (ชื่อ ${DEF_ADMIN.name} รหัส ${DEF_ADMIN.pw}) ซึ่งเขียนไว้ในคู่มือ ใครใช้เครื่องนี้ก็เข้าได้ ควรตั้งชื่อและรหัสผ่านของคุณเอง</div>
    <div><div class="lbl">ชื่อใหม่</div><input class="fld" id="cdName" autocomplete="username"></div>
    <div><div class="lbl">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</div><input class="fld" id="cdPw" type="password" autocomplete="new-password"></div>
    <div><div class="lbl">ยืนยันรหัสผ่านใหม่</div><input class="fld" id="cdPw2" type="password" autocomplete="new-password"></div><div id="cdErr"></div>`,
    `<button class="btn" data-close>ไว้ทีหลัง</button><button class="btn pri" id="cdOk">${ic('save')}เปลี่ยนเลย</button>`);
  const err = t => { $('cdErr').innerHTML = `<div class="errbox">${t}</div>`; };
  $('cdOk').onclick = () => {
    const n = $('cdName').value.trim(), p = $('cdPw').value;
    if(!n) return err('กรอกชื่อใหม่');
    if(n.toLowerCase() === DEF_ADMIN.name.toLowerCase()) return err('ตั้งชื่อใหม่ที่ไม่ใช่ ' + DEF_ADMIN.name);
    if(p.length < 8) return err('รหัสผ่านอย่างน้อย 8 ตัวอักษร');
    if(p === DEF_ADMIN.pw) return err('ใช้รหัสผ่านอื่นที่ไม่ใช่รหัสตั้งต้น');
    if(p !== $('cdPw2').value) return err('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
    if(admins().some(a => a.name.toLowerCase() === n.toLowerCase())) return err('มีชื่อนี้แล้ว');
    store.set('admins', admins().filter(a => !isDefAdmin(a)).concat([{ name: n, h: hashPw(n, p) }]));
    S.admin = n; sess.set(n); audit('เปลี่ยนบัญชีตั้งต้นเป็นแอดมินใหม่', n);
    closeModal(); paintChrome(); renderPage(); toast('เปลี่ยนชื่อและรหัสผ่านแล้ว');
  };
  setTimeout(() => { const x = $('cdName'); if(x) x.focus(); }, 30);
}

/* ---------- คู่มือการสร้าง: โค้ดจริงทีละส่วน (ดึงจาก #codeSnips ที่ build.py สร้าง) ---------- */
let CODE_SNIPS = null;
function codeSnips(){ if(!CODE_SNIPS){ try{ CODE_SNIPS = JSON.parse(document.getElementById('codeSnips').textContent); }catch(e){ CODE_SNIPS = {}; } } return CODE_SNIPS; }
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩';
function hlCode(line, py){
  /* หาจุดเริ่มคอมเมนต์จากข้อความดิบ (ไม่นับ # หรือ // ที่อยู่ในเครื่องหมายคำพูด) */
  let q = '', cm = -1;
  for(let k = 0; k < line.length; k++){ const ch = line[k];
    if(q){ if(ch === '\\'){ k++; continue; } if(ch === q) q = ''; continue; }
    if(ch === "'" || ch === '"' || ch === '`'){ q = ch; continue; }
    if(py ? ch === '#' : (ch === '/' && line[k + 1] === '/' && line[k - 1] !== ':')){ cm = k; break; } }
  const code = cm >= 0 ? line.slice(0, cm) : line, tail = cm >= 0 ? `<span class="cc">${esc(line.slice(cm))}</span>` : '';
  return esc(code).replace(/\b(function|const|let|return|if|else|for|def|import|try|catch|new|true|false|None|null|in|of|lambda)\b/g, '<span class="ck">$1</span>') + tail;
}
/* แสดงโค้ด 1 ชุดแบบหน้าจอโปรแกรมเขียนโค้ด · notes = [[ข้อความที่อยู่ในบรรทัด, คำอธิบาย]] → ใส่วงเลขที่บรรทัดนั้น */
function codeCap(id, notes){
  const S0 = codeSnips()[id];
  if(!S0) return gTip('ไม่พบโค้ดส่วนนี้ในไฟล์ (รอตรวจสอบ: รัน build.py ใหม่)', 'warn');
  const py = /\.py$/.test(S0.file), mark = {}, used = new Set();
  notes.forEach(([m], i) => { S0.segs.some((sg, si) => sg.lines.some((l, li) => { const key = si + ':' + li; if(l.includes(m)){ mark[key] = (mark[key] || '') + CIRC[i]; used.add(key); return true; } return false; })); });
  const last = S0.segs[S0.segs.length - 1], rng = `บรรทัด ${S0.segs[0].start}–${last.start + last.lines.length - 1}`;
  const body = S0.segs.map((sg, si) => (si ? '<div class="cgap">⋮</div>' : '') + sg.lines.map((l, li) => { const k = si + ':' + li;
    return `<div class="cl${mark[k] ? ' hit' : ''}"><span class="cn">${sg.start + li}</span><span class="cm">${mark[k] || ''}</span><code>${hlCode(l, py) || ' '}</code></div>`; }).join('')).join('');
  return `<div class="ccap"><div class="cbar"><i></i><i></i><i></i><b>${S0.file}</b><span>${rng}</span></div><div class="cbody">${body}</div></div>
    <ol class="cnotes">${notes.map(([m, t], i) => `<li><span class="cmk">${CIRC[i]}</span><span>${t}</span></li>`).join('')}</ol>`;
}

function renderGuide(){
  const el = $('page-guide');
  if(!GUIDE_TABS.find(t => t[0] === S.guideTab)) S.guideTab = 'user';
  const pr = S.guidePrint, tab = S.guideTab;
  const body = { user: guideUser, dev: guideDev, debug: guideDebug };
  const today = new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });
  const logo = (document.querySelector('.logo img') || {}).src || '';
  const part = k => { const t = GUIDE_TABS.find(x => x[0] === k); return `<div class="gpart" data-part="${k}"><div class="gphead"><img src="${logo}" alt=""><div><b>${t[1]}</b><span>${t[2]} · ระบบวิเคราะห์ R/A/M หม้อแปลง RAM Insight</span></div></div>${body[k]()}</div>`; };
  const parts = pr === 'all' ? GUIDE_TABS.map(t => t[0]) : [pr || tab];
  el.innerHTML = `<h1>${ic('book')}คู่มือการใช้งาน</h1>
  <div class="gcover"><img src="${logo}" alt=""><h1>${pr === 'all' ? 'คู่มือระบบ RAM Insight' : GUIDE_TABS.find(t => t[0] === parts[0])[1]}</h1>
    <p>ระบบวิเคราะห์ Reliability · Availability · Maintainability ของหม้อแปลง</p>
    <ul>${parts.map((k, i) => `<li>${i + 1}. ${GUIDE_TABS.find(t => t[0] === k)[1]} <span>${GUIDE_TABS.find(t => t[0] === k)[2]}</span></li>`).join('')}</ul><small>พิมพ์เมื่อ ${today}</small></div>
  <div class="ghead no-print">
    <div class="gtabs" role="tablist">${GUIDE_TABS.map(([k, n, d, i], x) => `<button role="tab" aria-selected="${k === tab}" data-gtab="${k}" class="${k === tab ? 'on' : ''}"><span class="gtn">${'①②③'[x]}</span>${ic(i)}<span><b>${n}</b><small>${d}</small></span></button>`).join('')}</div>
    <div class="gtool"><div class="gnav">${GUIDE_SEC[tab].map(([id, n], i) => `<button class="gchip" data-gto="${id}">${i + 1}. ${n}</button>`).join('')}</div>
      <div class="gpdf"><button class="btn sm" data-gpdf="one">${ic('down')}บันทึกส่วนนี้เป็น PDF</button><button class="btn sm" data-gpdf="all">${ic('file')}ทั้ง 3 ส่วนเป็น PDF</button></div></div>
  </div>
  ${parts.map(part).join('')}
  <div class="gback no-print"><button class="btn sm" data-gtop>${ic('chev')}กลับไปเมนูคู่มือด้านบน</button></div>`;
}
function printGuide(which){
  S.guidePrint = which === 'all' ? 'all' : S.guideTab; renderGuide();
  const pg = $('page-guide');
  pg.querySelectorAll('details').forEach(d => d.open = true);
  document.body.classList.add('print-guide');
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('print-on', p === pg));
  audit('Export PDF', 'คู่มือ · ' + (which === 'all' ? 'ทั้ง 3 ส่วน' : GUIDE_TABS.find(t => t[0] === S.guideTab)[1]));
  const done = () => { window.removeEventListener('afterprint', done); document.body.classList.remove('print-guide'); S.guidePrint = null; if(S.page === 'guide') renderGuide(); };
  window.addEventListener('afterprint', done);
  setTimeout(() => window.print(), 80);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-gtab]'); if(t){ S.guideTab = t.dataset.gtab; renderGuide(); const h = document.querySelector('#page-guide .ghead'); if(h && h.getBoundingClientRect().top < 0) window.scrollTo({ top: 0 }); return; }
  const p = e.target.closest('[data-gpdf]'); if(p){ printGuide(p.dataset.gpdf); return; }
  if(e.target.closest('[data-gtop]')) window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderPage(){
  if(!menuOn(S.page)){ S.page = 'home'; try{ history.replaceState(null, '', '#home'); }catch(_){} }
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== 'page-' + S.page; if(p.hidden) p.innerHTML = ''; });
  if(S.page !== 'rank') destroyChart('trend'); if(S.page !== 'py') destroyChart('lowA');
  ({ home: renderHome, plan: renderPlan, rank: renderRank, py: renderPy, guide: renderGuide })[S.page]();
  paintChrome();
}
function rebuild(){ MODEL = buildModel(DATA.rows || []); renderPage(); }
document.addEventListener('click', e => {
  const n = e.target.closest('.nav[data-page]');
  if(n){ S.page = n.dataset.page; document.body.classList.remove('nav-open'); renderPage(); window.scrollTo(0, 0); try{ history.replaceState(null, '', '#' + S.page); }catch(_){} return; }
  const s = e.target.closest('[data-stn]');
  if(s){ S.stn = s.dataset.stn; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; document.body.classList.remove('nav-open'); renderPage(); return; }
  const a = e.target.closest('[data-act]');
  if(a){ if(a.dataset.act === 'upload') $('uploadBtn').click(); else openLogin(); }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-stnsel]')){ S.stn = e.target.value; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; renderPage(); return; }
  if(e.target.matches('[data-sheetsel]')){ S.sheet = e.target.value; S.home.open.clear(); S.plan.sMtbf = S.plan.sMttr = null; renderPage(); }
});
$('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('scrim').onclick = () => document.body.classList.remove('nav-open');
window.addEventListener('afterprint', () => document.querySelectorAll('.page').forEach(p => p.classList.remove('print-on')));

/* ---------------- boot ---------------- */
(function boot(){
  const who = sess.get(); if(who && admins().some(a => a.name === who)) S.admin = who;
  const h = (location.hash || '').slice(1); if(TITLES[h]) S.page = h;
  rebuild();
})();

</script>
