<style>
:root{
  --navy:#0b2160; --navy2:#1c3a7a; --blue:#1677f2; --sky:#0ea0e6;
  --bg:#f3f6fb; --card:#fff; --line:#e3e9f3; --line2:#eef2f8; --text:#14213d; --soft:#5d6b86; --faint:#8a96ad;
  --R:#2563eb; --Rbg:#eaf1ff; --Rbd:#c7d8fb; --M:#e07a1f; --Mtx:#b85f10; --Mbg:#fff2e5; --Mbd:#f6d3b0;
  --A:#2e8b57; --Atx:#23704a; --Abg:#e8f6ee; --Abd:#bfe3cd; --bad:#c2413b; --badbg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans Thai Looped','IBM Plex Sans',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
svg.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,#fff 0,#fff 267px,var(--line) 267px,var(--line) 268px,transparent 268px)}

/* sidebar */
.side{background:#fff;border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.logo img{height:34px;width:auto}
.logo b{font-size:21px;letter-spacing:-.2px;color:var(--navy)}
.logo b span{color:var(--blue)}
.sec{font-size:12.5px;font-weight:600;color:var(--faint);letter-spacing:.3px;margin:12px 6px 4px}
.stn{border:1px solid var(--line);border-radius:12px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;background:#fafcff;text-align:left;width:100%}
.stn:hover{border-color:#c8d4ea}
.stn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.stn .t{font-weight:600;font-size:15px;display:block}.stn .s{font-size:12.5px;color:var(--soft);display:block}.stn.on .s{color:#c6d3ef}
.stn svg.ic{margin-top:3px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--soft);font-weight:500;background:none;border:0;width:100%;text-align:left}
.nav:hover{background:#f3f6fc;color:var(--text)}
.nav.on{background:#e8eefb;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:500;font-size:14.5px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:#c3cee3;background:#f8faff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.danger{color:var(--bad);border-color:#f0c9c6}
.btn.save{background:var(--A);color:#fff;border-color:var(--A)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.side .btn{width:100%;justify-content:flex-start}
.pill{margin-top:8px;border-radius:12px;padding:9px 12px;font-size:13.5px;display:flex;gap:8px;background:#f1f4f9;color:var(--soft)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--faint);margin-top:7px;flex:none}
.pill.ok{background:var(--Abg);color:var(--Atx)}.pill.ok i{background:var(--A)}
.foot{margin-top:auto;padding-top:10px}

/* main */
.main{display:flex;flex-direction:column;min-width:0}
.top{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;position:sticky;top:0;z-index:20}
.crumb{color:var(--soft);font-size:14px}
.top .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.menu-btn{display:none}
.admin-badge{display:inline-flex;align-items:center;gap:6px;background:#e8eefb;color:var(--navy);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.dirty{width:8px;height:8px;border-radius:50%;background:var(--M)}
.content{padding:24px 28px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;display:flex;align-items:center;gap:10px;color:var(--navy);line-height:1.3}
h1 svg.ic{width:26px;height:26px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 16px;border-radius:9px;font-weight:500;color:var(--soft);background:none;border:0}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--navy);color:#fff}
.sel{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px 4px 3px 12px;font-weight:500}
.sel label{color:var(--soft);font-weight:400;font-size:14px}
.sel select{border:0;background:transparent;padding:5px 6px;font-weight:500;max-width:100%;outline:none}
select.fld,input.fld{border:1px solid #cfd8e8;border-radius:10px;padding:9px 12px;background:#fff;width:100%;outline:none}
select.fld:focus,input.fld:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative;min-width:0}
.card h3{font-size:16.5px;display:flex;align-items:center;gap:8px;line-height:1.35}
.sub{color:var(--soft);font-size:13.5px;margin-top:2px}
.info{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);color:var(--faint);font-size:11.5px;font-weight:700;font-family:Georgia,serif;font-style:italic;background:#fff;flex:none;padding:0}
.info:hover{border-color:var(--blue);color:var(--blue)}
.kpi .ico{width:40px;height:40px;border-radius:11px;background:#eaf0fb;display:grid;place-items:center;color:var(--navy);margin-bottom:12px}
.kpi .lb{font-size:14px;color:var(--soft);font-weight:500}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2;margin-top:2px}.kpi .v small{font-size:16px;font-weight:600;color:var(--soft);margin-left:4px}
.kpi .n{font-size:13px;color:var(--faint)}
.kpi .info{position:absolute;right:16px;top:16px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.badge svg.ic{width:14px;height:14px}
.ok{background:var(--Abg);color:var(--Atx)}.bad{background:var(--badbg);color:var(--bad)}.mute{background:#eef2f8;color:var(--soft)}
.rk{display:flex;align-items:center;gap:10px;margin-top:12px}
.rk .nm{width:130px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk .tr{flex:1;height:10px;background:#eef2f8;border-radius:6px;overflow:hidden}.rk .tr i{display:block;height:100%;border-radius:6px}
.rk .ct{width:70px;text-align:right;font-weight:600}
.rk.wide .nm{width:210px}@media (max-width:560px){.rk.wide .nm{width:140px}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;color:var(--soft);font-weight:600;font-size:13px;padding:9px 10px;border-bottom:1px solid var(--line);background:#f8fafd;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.grp td{background:#f5f8fe;font-weight:600;cursor:pointer}
tr.grp:hover td{background:#edf2fc}
tr.ev{cursor:pointer}tr.ev:hover td,tr.click:hover td{background:#fafcff}
tr.click{cursor:pointer}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12.5px;font-weight:700}
.tR{background:var(--Rbg);color:var(--R)}.tM{background:var(--Mbg);color:var(--Mtx)}.tA{background:var(--Abg);color:var(--Atx)}
.p1{background:var(--badbg);color:var(--bad)}.p2{background:var(--Mbg);color:var(--Mtx)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--faint);min-width:220px;background:#fff}
.search input{border:0;outline:none;padding:8px 0;flex:1;min-width:0;color:var(--text)}
.lbl{font-size:13.5px;color:var(--soft);font-weight:500;margin-bottom:6px}
.inp{position:relative}
.inp input{width:100%;border:1px solid #cfd8e8;border-radius:10px;padding:9px 28px 9px 10px;font-size:19px;-moz-appearance:textfield;font-weight:600;background:#fff;outline:none}
.inp input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1677f222}
.inp span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--soft);font-weight:500}
.inp.auto input{background:#e9f7ee;border-color:#9fd5b3}
.res{border-radius:16px;padding:18px 20px;border:1px solid;min-width:0}
.res.R{background:var(--Rbg);border-color:var(--Rbd)}.res.M{background:var(--Mbg);border-color:var(--Mbd)}.res.A{background:var(--Abg);border-color:var(--Abd)}
.res .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.big{background:#fff;border-radius:12px;padding:12px 14px;margin:12px 0 8px}
.big .k{font-size:13px;color:var(--soft)}.big .v{font-size:34px;font-weight:700;line-height:1.15;word-break:break-word}.big .v small{font-size:17px;margin-left:4px;color:var(--soft);font-weight:600}
.big .v.empty{font-size:28px;color:var(--faint)}
.res .ln{font-size:13.5px;color:var(--soft)}
.res .ln b{color:var(--text)}
details.fx summary{list-style:none;display:flex;align-items:center;justify-content:space-between;font-weight:600;cursor:pointer}
details.fx summary::-webkit-details-marker{display:none}
details.fx[open] summary .chev{transform:rotate(180deg)}
.care{border-radius:14px;padding:14px 16px;background:#fff;border:1px solid var(--line);display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.care:hover{border-color:#c3cee3}
.care .no{width:34px;height:34px;border-radius:10px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.slider{width:100%;accent-color:var(--R)}
.slider.m{accent-color:var(--M)}
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.cmp .a{color:var(--soft);text-align:right}.cmp .b{font-weight:700;text-align:right}
.qk{background:#f5f8fe;border-radius:12px;padding:10px 12px;min-width:0}
.qk .l{font-size:13px;color:var(--soft)}.qk .v{font-size:22px;font-weight:700;line-height:1.3}.qk .n{font-size:12px;color:var(--faint)}
.empty-state{text-align:center;padding:60px 20px;color:var(--soft)}
.empty-state .ico{width:64px;height:64px;border-radius:18px;background:#e8eefb;color:var(--navy);display:grid;place-items:center;margin:0 auto 14px}
.empty-state .ico svg.ic{width:30px;height:30px}
.empty-state h2{color:var(--text);font-size:20px;margin-bottom:6px}
.note{font-size:13px;color:var(--faint)}
.warnbox{background:#fff8e6;border:1px solid #f1dca0;color:#7a5b00;border-radius:12px;padding:10px 14px;font-size:14px}
.errbox{background:var(--badbg);border:1px solid #f0c9c6;color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px}
.chart-box{position:relative;height:260px}
pre.code{background:#0f1a33;color:#dbe4f7;border-radius:12px;padding:14px 16px;overflow:auto;font-size:12.5px;line-height:1.55;max-height:60vh}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,26,51,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100;overflow-y:auto}
.ovl.open{display:flex}
.modal{background:#fff;border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(15,26,51,.25);display:flex;flex-direction:column;max-height:88vh}
.modal.wide{max-width:900px}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:18px}
.modal .mb{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.xbtn{border:0;background:#f1f4f9;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--soft)}
.chk-row{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.chk-row input{width:17px;height:17px;accent-color:var(--navy)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14.5px}
.kv dt{color:var(--soft)}
.stabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 20px}
.stabs button{border:0;background:none;padding:10px 10px;color:var(--soft);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.stabs button.on{color:var(--navy);border-color:var(--blue);font-weight:600}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form-grid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 18px;font-size:14.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2);display:none}
.toast.show{display:block}
.spinner{width:18px;height:18px;border:2.5px solid #c9d5ee;border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.scrim{display:none}
input[type=file].hidden-file{display:none}

/* responsive */
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.layout-plan{grid-template-columns:minmax(0,1fr)!important}.layout-2{grid-template-columns:minmax(0,1fr)!important}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:none}
  body.nav-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,26,51,.35);z-index:50}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px}
  .crumb{display:none}
  .content{padding:18px 16px 40px}
  .g3,.g2{grid-template-columns:1fr}
  h1{font-size:22px}
}
@media (max-width:560px){
  .g4{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}.kpi .v{font-size:24px}.kpi .ico{width:34px;height:34px;margin-bottom:8px}
  .seg button{padding:7px 10px;font-size:14px}
  .search{min-width:0;flex:1 1 100%}
  .rk .nm{width:92px}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
  .big .v{font-size:28px}
  .top .acts .btn span.t{display:none}
}

/* print = Export PDF */
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff;font-size:12px}
  .side,.top,.no-print,.ovl,.toast,.info{display:none!important}
  .app{display:block}
  .content{padding:0;gap:10px}
  .card,.res{break-inside:avoid;border-color:#ccd}
  .page{display:none!important}
  .page.print-on{display:flex!important;flex-direction:column;gap:12px}
  .print-head{display:flex!important}
}
.print-head{display:none;align-items:center;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:8px;margin-bottom:6px}
.print-head img{height:30px}
.page{display:flex;flex-direction:column;gap:18px}

.inp input::-webkit-outer-spin-button,.inp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.qtag{background:var(--badbg);color:var(--bad);font-size:11px;padding:0 6px;margin-left:4px;white-space:nowrap}

.info.why{border-color:var(--M);color:var(--M);width:18px;height:18px;font-size:10.5px;margin-left:6px;vertical-align:middle;position:relative;top:-2px}
.info.why:hover{background:var(--Mbg)}
.dash{white-space:nowrap}
.kpi .v .info.why{position:relative;top:-6px;right:auto}

.card.drill{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card.drill:hover{border-color:#b9c7e2;box-shadow:0 4px 16px rgba(11,33,96,.07)}
.drill-hint{font-size:12px;color:var(--faint);margin-top:6px}
.modal .mb > *{flex-shrink:0}

/* รายงานสรุป 1 หน้า */
.rep{font-size:11px;color:#14213d;display:flex;flex-direction:column;gap:10px}
.rep-head{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--navy);padding-bottom:8px}
.rep-head img{height:34px}
.rep-t{font-size:15px;font-weight:700;color:var(--navy)}
.rep-s{font-size:10px;color:var(--soft)}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.rep-h{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px}
.rep-tb{width:100%;border-collapse:collapse;font-size:10.5px}
.rep-tb th{font-size:10px;padding:3px 5px;background:#eef2f8;border-bottom:1px solid #ccd5e6}
.rep-tb td{padding:3px 5px;border-bottom:1px solid #e3e9f3}
.rep-n{font-size:9.5px;color:var(--soft);margin-top:3px;line-height:1.5}
.rep-foot{font-size:9px;color:var(--soft);border-top:1px solid #ccd5e6;padding-top:6px;line-height:1.5}
@media print{ body.print-report .print-head{display:none!important} }

.sticky-tbl thead th{position:sticky;top:0;z-index:1}
td b{white-space:nowrap}
@media print{.sticky-tbl{max-height:none!important;overflow:visible!important}}
.sticky-tbl th,.sticky-tbl td{padding-left:7px;padding-right:7px}

/* หน้าจัดอันดับ: stat row, Pareto แนวนอน, data bar */
.stat-row .qk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.stat-row .qk .v{font-size:24px}
.phead,.prow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px 52px;gap:10px;align-items:center}
.phead{font-size:12px;color:var(--faint);margin-top:14px;padding:0 6px 4px;border-bottom:1px solid var(--line)}
.phead .pn,.phead .pc{text-align:right}
.prow{padding:6px;border-radius:8px;cursor:pointer;font-size:14px}
.prow:hover{background:#f3f6fc}
.prow .pl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)}
.prow.vital .pl{color:var(--text);font-weight:600}
.prow .pb{height:14px;background:#eef2f8;border-radius:0 4px 4px 0;overflow:hidden}
.prow .pb i{display:block;height:100%;background:#b9c9ec;border-radius:0 4px 4px 0}
.prow.vital .pb i{background:#2f5bb7}
.prow .pn{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.prow .pc{text-align:right;color:var(--soft);font-variant-numeric:tabular-nums;font-size:13px}
.p80{position:relative;height:18px;margin:2px 0}
.p80:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1.5px dashed var(--bad)}
.p80 span{position:relative;background:#fff;padding:0 8px;margin-left:6px;font-size:11.5px;color:var(--bad);font-weight:600}
.databar{position:relative;height:22px;display:flex;align-items:center}
.databar i{position:absolute;left:0;top:4px;bottom:4px;background:#d9e3f7;border-radius:0 4px 4px 0}
.databar span{position:relative;padding-left:8px;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:560px){.phead,.prow{grid-template-columns:minmax(70px,110px) 1fr 36px 44px;gap:6px}.stat-row .qk .v{font-size:20px}}

.fielderr{color:var(--bad);font-size:12.5px;margin-top:4px;min-height:0}
.fielderr:empty{display:none}

.boxhint{font-size:12.5px;font-weight:600;margin-top:4px;color:var(--soft)}
.boxhint:empty{display:none}
#hintR{color:var(--R)}
#hintM{color:var(--Mtx)}
.ramt{border-radius:14px;padding:14px 16px;cursor:pointer;border:1px solid var(--line);transition:box-shadow .15s}
.ramt:hover{box-shadow:0 4px 14px rgba(20,33,61,.08)}
.ramt.R{background:var(--Rbg)}.ramt.A{background:var(--Abg)}.ramt.M{background:var(--Mbg)}
.ramt .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.ramt .v{font-size:32px;font-weight:700;margin-top:6px;line-height:1.2}.ramt .v small{font-size:16px;margin-left:3px}
.ramt .n{font-size:13px;color:var(--soft);margin-top:6px;line-height:1.6}
.ovcard:hover{box-shadow:0 4px 14px rgba(20,33,61,.08)}

</style>

# RAM Insight — ตรวจสอบด้วย Python (ใช้ไลบรารีมาตรฐานเท่านั้น)
# RAW_JSON = แถวต้นฉบับทุกแถวจาก Excel (Service Request ของหม้อแปลง)
# ใช้เฉพาะงาน [CM] · เวลาซ่อม = Actual Start → Actual Finish · หน่วย = หม้อแปลงแต่ละลูก
import json, re, math
from datetime import datetime, timedelta
from statistics import mean
from collections import Counter, defaultdict

rows = json.loads(RAW_JSON)
EPOCH = datetime(1970, 1, 1)

def to_time(v):
    """แปลงเวลาเป็น datetime ปัดเป็นนาที: เลขซีเรียลของ Excel (นับจาก 1899-12-30) หรือข้อความวันที่"""
    if v is None or v == '':
        return None
    if isinstance(v, (int, float)):
        minutes = math.floor((v - 25569) * 1440 + 0.5)
        return EPOCH + timedelta(minutes=minutes)
    s = str(v).strip()
    m = re.match(r'^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:\.\d+)?)?)?$', s)
    if m:
        d = datetime(int(m[1]), int(m[2]), int(m[3]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
    else:
        m = re.match(r'^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2}|\d{4})(?:\s+(\d{1,2})[:.](\d{2})(?::(\d{2}))?)?$', s)
        if m:
            y = int(m[3])
            if len(m[3]) == 2:            # ปี 2 หลัก: <= 50 = ค.ศ. 20xx, > 50 = พ.ศ. 25xx
                y = 2000 + y if y <= 50 else 2500 + y
            if y > 2400:
                y -= 543
            d = datetime(y, int(m[2]), int(m[1]), int(m[4] or 0), int(m[5] or 0), int(m[6] or 0))
        elif re.match(r'^\d+(\.\d+)?$', s):
            return to_time(float(s))
        else:
            return None
    return EPOCH + timedelta(minutes=math.floor((d - EPOCH).total_seconds() / 60 + 0.5))

def hours(a, b):
    return (b - a).total_seconds() / 3600

def is_pm(r):
    s = str(r.get('summary') or '').strip()
    if re.match(r'^\[\s*PM\s*\]', s, re.I):
        return True
    if re.match(r'^\[\s*CM\s*\]', s, re.I):
        return False
    return str(r.get('prio')).strip() == '4'

def unit_of(r):
    m = re.search(r'\(([^)]+)\)', str(r.get('loc') or ''))
    if m:
        return m[1].strip()
    m = re.search(r'\b([A-Z]{1,6}-?TR\.?\s*\d+)\b', str(r.get('summary') or ''), re.I)
    if m:
        return re.sub(r'\s+', '', m[1].upper())
    return str(r.get('loc') or '').strip()

    m = re.match(r'^([A-Za-z]+)', str(code or '').strip())

pm = sum(1 for r in rows if is_pm(r))
seen, uniq = set(), []
for r in rows:
    if is_pm(r):
        continue
    f, t = to_time(r.get('start')), to_time(r.get('finish'))
    sr = str(r.get('sr') or '').strip()
    key = ('SR', sr) if sr else (r.get('loc'), f or ('x', str(r.get('start'))), t or ('x', str(r.get('finish'))))
    if key not in seen:
        seen.add(key)
        uniq.append({'r': r, 'f': f, 't': t})

good = []
for u in uniq:
    if u['f'] is None or u['t'] is None:
        missing += 1
    elif u['t'] == u['f']:      # เริ่ม = เสร็จ: ไม่ตัดทิ้ง นับเป็นซ่อม 0 นาทีตามที่กรอก
        zero += 1
        good.append(u)
    elif u['t'] < u['f']:
        reversed_ += 1
    elif hours(u['f'], u['t']) > 8760:
        too_long += 1
    else:
        good.append(u)

events = []
for u in good:
    r = u['r']; unit = unit_of(r) or '(ไม่ระบุหม้อแปลง)'
    events.append({'unit': unit, 'stn': prefix(unit) or '?', 'from': u['f'], 'to': u['t'], 'dur': hours(u['f'], u['t']),
                   'prob': str(r.get('prob') or '').strip(), 'cause': str(r.get('cause') or '').strip(),
                   'prio': str(r.get('prio')).strip(), 'zero': u['t'] == u['f']})

# ---------- ② สูตร: หน่วย = สถานี + รหัสหม้อแปลง ----------
def top(counter):
    items = sorted(((k or 'ไม่ระบุ', n) for k, n in counter.items()), key=lambda x: (-x[1], x[0]))
    return f'{items[0][0]} {items[0][1]}' if items else '– 0'

def analyse(evs):
    by_unit = defaultdict(list)
    for e in evs:
        by_unit[(e['stn'], e['unit'])].append(e)
    units, ev_mtbf, ev_A, all_gaps = [], [], [], []
    for (stn, unit), es in by_unit.items():
        es.sort(key=lambda e: e['from'])
        gaps = []
        for i in range(1, len(es)):
            g = hours(es[i - 1]['to'], es[i]['from'])
            if g > 0:
                gaps.append(g)
        all_gaps += gaps
        mttr = mean(e['dur'] for e in es)
        mtbf = mean(gaps) if gaps else None
        if mtbf is not None:
            for e in es:
                ev_mtbf.append(mtbf)
                ev_A.append(mtbf / (mtbf + e['dur']) * 100)
        units.append({'unit': unit, 'stn': stn, 'n': len(es), 'ngaps': len(gaps), 'mtbf': mtbf, 'mttr': mttr,
                      'A': (mtbf / (mtbf + mttr) * 100) if mtbf is not None else None})
    units.sort(key=lambda u: (-u['n'], u['A'] if u['A'] is not None else 999, u['unit']))
    return {
        'n': len(evs),
        'units_n': len(units),
        'mtbf_days': mean(ev_mtbf) / 24 if ev_mtbf else None,
        'pooled_days': mean(all_gaps) / 24 if all_gaps else None,
        'mttr': mean(e['dur'] for e in evs) if evs else None,
        'A': mean(ev_A) if ev_A else None,
        'top_prob': top(Counter(e['prob'] for e in evs)),
        'top_cause': top(Counter(e['cause'] for e in evs)),
        'p1': sum(1 for e in evs if e['prio'] == '1'),
        'zero': sum(1 for e in evs if e['zero']),
        'units': units,
    }

T = analyse(events)
by_stn = {s: analyse([e for e in events if e['stn'] == s]) for s in sorted({e['stn'] for e in events})}
json.dumps({
    'quality': {'raw': len(rows), 'pm': pm, 'unique': len(uniq), 'dupes': len(rows) - pm - len(uniq),
                'missing': missing, 'reversed': reversed_, 'zero': zero, 'long': too_long, 'used': len(events)},
    'T': T,
    'stn': {s: {'n': v['n'], 'units_n': v['units_n'], 'mtbf_days': v['mtbf_days'], 'mttr': v['mttr'], 'A': v['A']} for s, v in by_stn.items()},
}, ensure_ascii=False)

/* ---------------- cleaning + model ---------------- */
function prefixOf(code){ const m = String(code || '').trim().match(/^([A-Za-z]+)/); return m ? m[1].toUpperCase() : ''; }
function buildModel(rawRows){
  const sheetCount = {}; rawRows.forEach(r => { sheetCount[r.sheet] = (sheetCount[r.sheet] || 0) + 1; });

  const events = []; let id = 0;
  good.forEach(u => {
    const r = u.r, dur = (u.t - u.f) / 3600000, unit = unitOf(r) || '(ไม่ระบุหม้อแปลง)', stn = prefixOf(unit) || '?';
    if(!stnNames[stn] && locName(r)) stnNames[stn] = locName(r);
    events.push({ id: 'e' + (id++), grp:'T', unit, stn, from: u.f, to: u.t, dur, cause: r.cause || '', comp: r.prob || '', prio: r.prio === '' ? '' : +r.prio || r.prio,
      sr: r.sr || '', sheet: '', raw: r, rawRows: [r], q: u.zero ? 1 : 0 });
  });
  events.sort((a, b) => a.from - b.from);
  events.forEach(e => { const d = new Date(e.from); e.ym = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1); e.yq = d.getUTCFullYear() + '-Q' + (Math.floor(d.getUTCMonth() / 3) + 1); e.yy = String(d.getUTCFullYear()); e.sheet = e.yy; });
  const years = [...new Set(events.map(e => e.yy))].sort();
  return { rawCount: rawRows.length, pm, uniqCount: uniq.length, dupes: rawRows.length - pm - uniq.length, rowsT: good.length, ex, exSample, events, sheets: years, stnNames };
}

/* สูตร: จัดกลุ่มตาม สถานี + รหัสหม้อแปลง, ช่วงห่างของแต่ละเหตุ = เริ่ม(i) − เสร็จ(i−1) (> 0) */
function computeUnits(evs){
  const g = new Map();
  evs.forEach(e => { const k = e.grp + '|' + e.stn + '|' + e.unit; if(!g.has(k)) g.set(k, []); g.get(k).push(e); });
  const units = [], per = new Map();
  g.forEach((arr, k) => {
    arr.sort((a, b) => a.from - b.from);
    const gaps = [];
    arr.forEach((e, i) => {
      let gap = NaN;
      if(i > 0){ const gp = (e.from - arr[i-1].to) / 3600000; if(gp > 0){ gap = gp; gaps.push(gp); } }
      per.set(e.id, { gap, first: i === 0 });
    });
    const mtbf = mean(gaps), mttr = mean(arr.map(e => e.dur));
    const A = fin(mtbf) ? mtbf / (mtbf + mttr) * 100 : NaN;
    arr.forEach(e => { const p = per.get(e.id); p.mtbf = mtbf; p.A = fin(mtbf) ? mtbf / (mtbf + e.dur) * 100 : NaN; });
    units.push({ key:k, unit: arr[0].unit, stn: arr[0].stn, grp: arr[0].grp, events: arr, n: arr.length, mtbf, mttr, A, gaps });
  });
  units.sort((a, b) => b.n - a.n || (fin(a.A) ? a.A : 999) - (fin(b.A) ? b.A : 999) || a.unit.localeCompare(b.unit));
  return { units, per };
}
function stats(evs){
  const { units, per } = computeUnits(evs);
  const mt = [], av = [], gaps = [];
  evs.forEach(e => { const p = per.get(e.id); if(fin(p.mtbf)){ mt.push(p.mtbf); av.push(p.A); } if(fin(p.gap)) gaps.push(p.gap); });
  const comp = {}, cause = {}, prio = {};
  evs.forEach(e => { const c = compLabel(e.comp); comp[c] = (comp[c] || 0) + 1; const k = causeLabel(e.cause); cause[k] = (cause[k] || 0) + 1; const p = prioLabel(e.prio); prio[p] = (prio[p] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  return { n: evs.length, nQ: evs.filter(e => e.q).length, units, per, nUnits: units.length, mtbfH: mean(mt), pooledH: mean(gaps), mttrH: mean(evs.map(e => e.dur)), A: mean(av), nA: av.length,
    comp: top(comp), cause: top(cause), prio: Object.entries(prio).sort((a, b) => a[0].localeCompare(b[0])) };
}
function scoped(opts = {}){
  if(!MODEL) return [];
  const stn = opts.stn !== undefined ? opts.stn : S.stn, sheet = opts.sheet !== undefined ? opts.sheet : S.sheet;
  return MODEL.events.filter(e => (stn === 'ALL' || e.stn === stn) && (sheet === 'ALL' || e.yy === sheet));
}

function gaugeSvg(v, tgt){
  const lo = Math.min(90, Math.floor(Math.min(fin(v) ? v : 90, tgt) / 10) * 10), hi = 100, cx = 150, cy = 135, r = 100;
  const ang = x => Math.PI * (1 - Math.min(1, Math.max(0, (x - lo) / (hi - lo)))), pt = (a, rr) => [cx + rr * Math.cos(a), cy - rr * Math.sin(a)];
  let s = ''; const N = 40;
  for(let i = 0; i < N; i++){
    const a0 = Math.PI * (1 - i / N), a1 = Math.PI * (1 - (i + 1) / N), x = lo + (hi - lo) * (i + .5) / N, t = Math.max(0, Math.min(1, (x - lo) / Math.max(.001, tgt - lo)));
    const c = x >= tgt ? '#3a9a66' : `rgb(${Math.round(200 - t * 20)},${Math.round(110 + t * 60)},90)`;
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1 + .004, r);
    s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${c}" stroke-width="20" fill="none"/>`;
  }
  [[lo, Math.PI], [hi, 0]].forEach(([l, a]) => { const [x, y] = pt(a, r + 30); s += `<text x="${x}" y="${y + 4}" font-size="12" fill="#8a96ad" text-anchor="middle">${l}%</text>`; });
  const [t0x, t0y] = pt(ang(tgt), r - 16), [t1x, t1y] = pt(ang(tgt), r + 16), [tlx, tly] = pt(ang(tgt), r + 28);
  s += `<line x1="${t0x}" y1="${t0y}" x2="${t1x}" y2="${t1y}" stroke="#14213d" stroke-width="3"/><text x="${tlx}" y="${tly}" font-size="12" fill="#14213d" text-anchor="middle" font-weight="600">${tgt}%</text>`;
  if(fin(v)){ const [nx, ny] = pt(ang(v), r - 18); s += `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#0b2160" stroke-width="4" stroke-linecap="round"/>`; }
  s += `<circle cx="${cx}" cy="${cy}" r="8" fill="#0b2160"/>`;
  return `<svg viewBox="0 0 300 150" width="100%" style="max-width:320px" role="img" aria-label="Availability ${fmt(v, 2)}%">${s}</svg>`;
}
/* สีของชนิดปัญหา: เรียงตามจำนวน ใช้ชุดสีเดิมของเว็บ (น้ำเงิน เขียว ส้ม …) */
const MIX_COL = ['#2563eb', '#e07a1f', '#2e8b57', '#7c4dbd', '#d0544c', '#1c9aa8', '#b58a1b', '#5d6b86', '#c2477f', '#4f7a28', '#8a96ad', '#3d5a99'];
function donutSvg(arr, T){
  let a = -Math.PI / 2, s = ''; const r = 78, cx = 95, cy = 95;
  arr.forEach(([k, v], i) => {
    if(!v) return; const c = MIX_COL[i % MIX_COL.length];
    const frac = v / T, b = a + 2 * Math.PI * frac;
    if(frac >= 0.9999) s += `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></circle>`;
    else { const l = (b - a) > Math.PI ? 1 : 0, gap = Math.min(.012, (b - a) / 4);
      s += `<path d="M${(cx + r * Math.cos(a)).toFixed(2)} ${(cy + r * Math.sin(a)).toFixed(2)}A${r} ${r} 0 ${l} 1 ${(cx + r * Math.cos(b - gap)).toFixed(2)} ${(cy + r * Math.sin(b - gap)).toFixed(2)}" stroke="${c}" stroke-width="30" fill="none" data-drill="comp" data-val="${esc(k)}" style="cursor:pointer"><title>${esc(k)}: ${v}</title></path>`; }
    a = b;
  });
  return `<svg width="190" height="190" viewBox="0 0 190 190">${s}<text x="95" y="96" text-anchor="middle" font-size="30" font-weight="700" fill="#14213d">${T}</text><text x="95" y="118" text-anchor="middle" font-size="12.5" fill="#5d6b86">เหตุทั้งหมด</text></svg>`;
}

      ${tile('A', 'Availability', st.A, `พร้อมใช้งาน · เกณฑ์ ≥ ${SETTINGS.threshold}%<br>${fin(st.A) ? passBadge(st.A) : ''}`, aggWhy('A'))}
      ${tile('M', 'Maintainability', r.M, `ซ่อมเสร็จภายใน ${V.r} ชม.<br>M = (1 − e<sup>−${V.r} ÷ ${fmt(st.mttrH, 2)}</sup>) × 100`, 'ยังไม่มีเหตุในขอบเขตนี้')}
    </div></div>`;

/* ---------- การ์ดเปรียบเทียบ ก่อน / หลัง ---------- */
const cmpState = (x, y, dir) => !fin(x) || !fin(y) ? null : Math.abs(y - x) < 1e-9 ? 0 : (y - x) * dir > 0 ? 1 : -1;   // 1 ดีขึ้น · 0 เท่าเดิม · −1 แย่ลง
function cmpBadge(x, y, dir, isPct){   // ค่าที่เป็น % แสดงผลต่างเป็น "จุด" (percentage point) ค่าอื่นแสดง % ที่เปลี่ยน
  const st = cmpState(x, y, dir);
  if(st === null) return '';
  if(st === 0) return '<span class="badge mute" style="font-size:12.5px">เท่าเดิม</span>';
  const pc = x !== 0 ? Math.abs((y - x) / x * 100) : NaN;
  const amt = isPct ? ' ' + fmt(Math.abs(y - x), 2) + ' จุด' : fin(pc) ? ' ' + fmt(pc, 1) + '%' : '';
  return `<span class="badge ${st > 0 ? 'ok' : 'bad'}" style="font-size:12.5px">${st > 0 ? '▲ ดีขึ้น' : '▼ แย่ลง'}${amt}</span>`;
}
/* แถวตาราง: [ชื่อ, สี, ก่อน, หลัง, ฟอร์แมต, ทิศทางที่ดี (1 = มากดี, −1 = น้อยดี), คำอธิบายเมื่อไม่มีค่า] · hl = ระบายแถวที่เท่าเดิม/แย่ลง */
function cmpRows(rows, hl){
  return rows.map(([l, col, x, y, f, dir, why]) => { const st = cmpState(x, y, dir);
    const bg = hl && st === 0 ? 'background:#fff8ec' : hl && st === -1 ? 'background:#fdf0ef' : '';
    return `<tr style="${bg}"><td style="font-weight:600;color:${col}">${l}</td><td class="n">${fin(x) ? f(x) : dash(why || 'ข้อมูลไม่พอ')}</td>
    <td class="n" style="font-weight:700;color:${st === 1 ? 'var(--Atx)' : st === -1 ? 'var(--bad)' : 'var(--text)'}">${fin(y) ? f(y) : dash(why || 'ข้อมูลไม่พอ')}</td><td>${cmpBadge(x, y, dir, f === fP)}</td></tr>`; }).join('');
}
const assetBox = () => `<div class="bar" style="margin-top:10px;gap:8px"><span class="note">มูลค่าหม้อแปลง</span><div class="inp" style="width:220px"><input type="number" id="cmpAsset" value="${S.plan.asset}" min="0" step="1000000" style="padding:6px 50px 6px 10px;font-size:14px"><span>บาท</span></div></div>`;
const fH = h => fmt(h, 1) + ' ชม.', fP = v => pctTxt(v, 2) + '%', fB = v => '฿' + fmt(v, 0), fN = v => fmt(v, 2) + ' ครั้ง';
const okLine = html => `<div style="margin-top:10px;border-radius:10px;padding:8px 12px;background:var(--Abg);border:1px solid var(--Abd);color:var(--Atx);font-size:14px">${html}</div>`;
const warnLine = html => `<div style="margin-top:10px;border-radius:10px;padding:8px 12px;background:#fff8ec;border:1px solid var(--Mbd);color:#8a4b0c;font-size:14px;line-height:1.6">${html}</div>`;
function planCmpCard(o, B){
  const P = S.plan;
  if(P.view === 'cap') return capYearCard(o, B);
  const V = VIEWS[P.view];
  const tB = o.R ? o.R.mtbf : o.A && fin(o.A.mtbf) ? o.A.mtbf : B.mtbf, tR = o.M ? o.M.mttr : o.A && fin(o.A.mttr) ? o.A.mttr : B.mttr;

    [`R (${V.m.toLocaleString('en-US')} ชม.)`, 'var(--R)', a.R, t.R, fP, 1], [`M (${V.r} ชม.)`, 'var(--Mtx)', a.M, t.M, fP, 1], ['A', 'var(--Atx)', a.A, t.A, fP, 1],
    ['เสียเฉลี่ยต่อปี (8,760 ÷ MTBF)', 'var(--text)', a.n, t.n, fN, -1], ['Downtime ต่อปี', 'var(--text)', a.dt, t.dt, fH, -1],
    [`โอกาสเสียใน ${per} (1 − R)`, 'var(--bad)', a.pf, t.pf, fP, -1], [`ความเสี่ยงต่อทรัพย์สิน (${per})`, 'var(--text)', a.risk, t.risk, fB, -1]];
  // ตรวจว่าดีขึ้นครบทุกค่าไหม: ทุกค่ามาจาก MTBF (ต้องเพิ่ม) และ MTTR (ต้องลด)
  const sts = rows.map(r => cmpState(r[2], r[3], r[5])), nUp = sts.filter(x => x === 1).length;

  const stB = cmpState(B.mtbf, tB, 1), stR = cmpState(B.mttr, tR, -1), fix = [];

  return `<div class="card" id="cmpCardGoal"><h3>เปรียบเทียบ ก่อน / หลังตั้งเป้าหมาย · ${esc(B.src)} (${V.name})</h3>
    <div class="sub">ก่อน = ค่าจริงจากข้อมูล · หลัง = ค่าที่ได้ถ้าทำได้ตามเป้า${kept.length ? ` · ${kept.join(' และ ')} ยังไม่ได้ตั้งเป้า จึงใช้ค่าปัจจุบัน` : ''}</div>
    ${check}

}
/* มุมมองค่าปัจจุบัน: เทียบหม้อแปลงลูกที่เลือก ระหว่าง 2 ปีที่เลือกเอง (ใช้เฉพาะเหตุในปีนั้น)

function capYearCard(o, B){
  const P = S.plan;
  if(!B.u) return `<div class="card"><h3>เปรียบเทียบรายปี</h3><div class="sub">เลือกหม้อแปลงทางซ้าย เพื่อเทียบค่าของลูกนั้นระหว่าง 2 ปีที่เลือก</div></div>`;
  const all = MODEL.events.filter(e => e.stn === B.u.stn && e.unit === B.u.unit && (!P.comp || compLabel(e.comp) === P.comp));
  const years = MODEL.sheets.slice(), has = [...new Set(all.map(e => e.yy))].sort();
  const last = S.sheet !== 'ALL' ? S.sheet : has[has.length - 1] || years[years.length - 1];
  if(!P.cmpY || !years.includes(P.cmpY.a) || !years.includes(P.cmpY.b)) P.cmpY = { b: last, a: years.includes(String(+last - 1)) ? String(+last - 1) : years[0] };
  const yA = P.cmpY.a, yB = P.cmpY.b;
  const one = y => { const ev = all.filter(e => e.yy === y), u = computeUnits(ev).units[0];
    const mtbf = u ? u.mtbf : NaN, mttr = u ? u.mttr : NaN, Ry = fin(mtbf) ? Math.exp(-8760 / mtbf) * 100 : NaN;
    return { n: ev.length, gaps: u ? u.gaps.length : 0, dt: ev.reduce((a, e) => a + e.dur, 0), mtbf, mttr, A: u ? u.A : NaN, Rm: fin(mtbf) ? Math.exp(-720 / mtbf) * 100 : NaN, Ry,
      tR: o.R && fin(mtbf) ? -mtbf * Math.log(o.R.R / 100) : NaN, tM: o.M && fin(mttr) ? -mttr * Math.log(1 - o.M.M / 100) : NaN, risk: fin(Ry) ? (1 - Ry / 100) * P.asset : NaN }; };
  const a = one(yA), b = one(yB), name = B.src, cnt = y => all.filter(e => e.yy === y).length;
  const sel = (id, v) => `<select class="fld" id="${id}" style="width:auto;padding:6px 10px">${years.map(y => `<option value="${y}" ${y === v ? 'selected' : ''}>${yLabel(y)} · ${cnt(y)} เหตุ</option>`).join('')}</select>`;
  const mtbfWhy = `MTBF ต้องมีอย่างน้อย 2 เหตุในปีเดียวกัน · ${esc(name)} มี ${a.n} เหตุใน${yLabel(yA)} และ ${b.n} เหตุใน${yLabel(yB)}<br>ลองเลือกปีอื่นที่ช่องเลือกปีด้านบน`;
  // ① กล่องค่าที่เปลี่ยนตามที่กรอก
  const big = (v, f, col) => fin(v) ? `<span style="font-size:24px;font-weight:700;white-space:nowrap;color:${col}">${f(v)}</span>` : dash(mtbfWhy);
  const tBox = (title, col, x, y, f, dir, hint, need) => { const st = cmpState(x, y, dir), cB = st === 1 ? 'var(--Atx)' : st === -1 ? 'var(--bad)' : 'var(--text)';
    return `<div style="background:#fff;border-radius:12px;padding:12px 14px;border:1px solid var(--line)"><div style="font-weight:600;color:${col}">${title}</div>
      ${need ? `<div class="note" style="margin-top:8px">${need}</div>` : `<div style="display:flex;align-items:flex-end;gap:12px;margin-top:6px;flex-wrap:wrap">
        <div><div class="note">${yLabel(yA)}</div>${big(x, f, 'var(--text)')}</div><div style="font-size:20px;color:var(--faint);padding-bottom:4px">→</div>
        <div><div class="note">${yLabel(yB)}</div>${big(y, f, cB)}</div></div><div style="margin-top:6px">${cmpBadge(x, y, dir)}</div>`}
      <div class="note" style="margin-top:4px">${hint}</div></div>`; };
  const hmBig1 = v => { const [n, u] = hmBig(v, 1); return `${n}<small style="font-size:13px"> ${u}</small>`; };
  const sec1 = `<div style="margin-top:14px;border:2px solid #1677f2;border-radius:14px;padding:14px 16px;background:#f5f9ff">
      <div class="bar" style="gap:10px"><span style="font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:#dbe8ff;color:#1452c4">① เปลี่ยนตามที่กรอก R / M</span><span class="note">${o.R || o.M ? `กรอก ${[o.R ? `R ${pctTxt(o.R.R, 2)}%` : '', o.M ? `M ${pctTxt(o.M.M, 2)}%` : ''].filter(Boolean).join(' และ ')} ทางซ้าย` : 'กรอก R หรือ M ทางซ้าย'}</span></div>
      <div class="grid g2" style="margin-top:12px;gap:14px">
        ${tBox(`คงความน่าเชื่อถือ ≥ ${o.R ? pctTxt(o.R.R, 2) : '…'}% ได้นาน (t)`, 'var(--R)', a.tR, b.tR, hmBig1, 1, 'นานขึ้น = ดีขึ้น', o.R ? '' : 'กรอก R (%) ทางซ้าย เพื่อดูเวลา t ของแต่ละปี')}
        ${tBox(`ซ่อมเสร็จได้ ≥ ${o.M ? pctTxt(o.M.M, 2) : '…'}% ภายใน (t)`, 'var(--Mtx)', a.tM, b.tM, hmBig1, -1, 'สั้นลง = ดีขึ้น', o.M ? '' : 'กรอก M (%) ทางซ้าย เพื่อดูเวลา t ของแต่ละปี')}
      </div></div>`;
  // ② ค่าจริงจากข้อมูล
  const rows = [['จำนวนเหตุ', 'var(--text)', a.n, b.n, v => fmt(v, 0) + ' ครั้ง', -1], ['เวลาซ่อมรวมทั้งปี', 'var(--text)', a.dt, b.dt, fH, -1],
    ['MTBF', 'var(--R)', a.mtbf, b.mtbf, fH, 1, mtbfWhy], ['MTTR', 'var(--Mtx)', a.mttr, b.mttr, v => hm(v), -1, `${yLabel(yA)} หรือ ${yLabel(yB)} ไม่มีเหตุของหม้อแปลงนี้`],
    ['A', 'var(--Atx)', a.A, b.A, fP, 1, 'A ต้องใช้ MTBF ซึ่งต้องมีอย่างน้อย 2 เหตุในปีเดียวกัน'],
    ['R 1 เดือน (720 ชม.)', 'var(--R)', a.Rm, b.Rm, fP, 1, 'R ต้องใช้ MTBF ซึ่งต้องมีอย่างน้อย 2 เหตุในปีเดียวกัน'], ['R 1 ปี (8,760 ชม.)', 'var(--R)', a.Ry, b.Ry, fP, 1, 'R ต้องใช้ MTBF ซึ่งต้องมีอย่างน้อย 2 เหตุในปีเดียวกัน'],
    ['ความเสี่ยงต่อทรัพย์สิน (1 ปี)', 'var(--text)', a.risk, b.risk, fB, -1, 'ความเสี่ยง = (1 − R 1 ปี) × มูลค่า ต้องใช้ MTBF ของปีนั้น']];
  return `<div class="card" id="cmpCardYear"><h3>เปรียบเทียบรายปี · ${esc(name)}</h3>
    <div class="bar" style="gap:10px;margin-top:10px;flex-wrap:wrap"><span class="note">เทียบ</span>${sel('cmpYA', yA)}<span style="font-size:18px;color:var(--faint)">→</span>${sel('cmpYB', yB)}<span class="note">เลือกปีที่จะเทียบได้ 2 ปี · ใช้เฉพาะเหตุในปีนั้น</span></div>
    ${sec1}
    <div style="margin-top:16px"><span style="font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--line2);color:var(--soft)">② ค่าจริงจากข้อมูล · ไม่เปลี่ยนตามที่กรอก</span></div>
    <div class="tbl-wrap" style="margin-top:8px"><table><thead><tr><th>ตัวชี้วัด</th><th class="n">${yLabel(yA)}</th><th class="n">${yLabel(yB)}</th><th>ผล</th></tr></thead><tbody>${cmpRows(rows)}</tbody></table></div>
    ${assetBox()}
    <div class="note" style="margin-top:8px">ความเสี่ยงต่อทรัพย์สิน = (1 − R 1 ปี) × มูลค่าหม้อแปลง · ค่าที่เป็น % แสดงผลต่างเป็น "จุด" · MTBF รายปีคิดจากช่วงห่างในปีนั้นเท่านั้น จึงสั้นกว่าค่าทุกปี</div></div>`;
}
document.addEventListener('change', e => {
  const id = e.target.id;
  if(id === 'cmpAsset'){ const x = parseFloat(e.target.value); S.plan.asset = fin(x) && x >= 0 ? x : 0; paintPlan(); }
  else if(id === 'cmpYA' || id === 'cmpYB'){ S.plan.cmpY = Object.assign({}, S.plan.cmpY, { [id === 'cmpYA' ? 'a' : 'b']: e.target.value }); paintPlan(); }
});
/* ส่วนปรับค่าจำลอง: วาดตัวควบคุมครั้งเดียว ตอนเลื่อนแถบอัปเดตเฉพาะตัวเลข (เลื่อนลื่น ไม่สะดุด) */
function paintSlide(out){
  const P = S.plan, B = planBase();
  if(P.sMtbf === null) P.sMtbf = B.mtbf;
  if(P.sMttr === null) P.sMttr = B.mttr;
  const minB = 1000, maxB = 10000, minR = 1, maxR = 48;   // ช่วงแถบเลื่อนตามข้อกำหนด (พิมพ์ค่านอกช่วงได้ที่ช่องตัวเลข)
  out.innerHTML = `<div class="card">
    <div class="bar"><h3>ปรับค่าจำลอง ${esc(B.u ? B.src : '(ค่าเริ่มต้น)')}</h3><div class="right seg"><button data-sview="month" class="${P.sView === 'month' ? 'on' : ''}">รายเดือน</button><button data-sview="year" class="${P.sView === 'year' ? 'on' : ''}">รายปี</button></div></div>
    <div class="grid g2" style="margin-top:10px;gap:28px">
      <div>
        <div class="lbl" style="margin-top:8px;display:flex;justify-content:space-between">MTBF (ชม.) <input type="number" class="fld" id="sMtbfN" value="${+P.sMtbf.toFixed(1)}" min="1" step="any" style="width:120px;padding:4px 8px;text-align:right"></div>
        <input type="range" class="slider" id="sMtbf" min="${minB}" max="${maxB}" step="1" value="${Math.min(Math.max(P.sMtbf, minB), maxB)}"><div class="note" style="display:flex;justify-content:space-between"><span>1,000</span><span>10,000</span></div>
        <div class="note">ปัจจุบัน ${fmt(B.mtbf, 1)} ชม.</div>
        <div class="lbl" style="margin-top:16px;display:flex;justify-content:space-between">MTTR (ชม.) <input type="number" class="fld" id="sMttrN" value="${+P.sMttr.toFixed(2)}" min="0.01" step="any" style="width:120px;padding:4px 8px;text-align:right"></div>
        <input type="range" class="slider m" id="sMttr" min="${minR}" max="${maxR}" step="0.01" value="${Math.min(Math.max(P.sMttr, minR), maxR)}"><div class="note" style="display:flex;justify-content:space-between"><span>1</span><span>48</span></div>
        <div class="note">ปัจจุบัน ${hm(B.mttr)}</div>
        <div class="lbl" style="margin-top:16px">ค่าเสียหายต่อชั่วโมงที่หม้อแปลงหยุด</div>
        <div class="inp"><input type="number" id="sCost" value="${P.cost}" min="0" step="1000" style="font-size:16px;padding-right:70px"><span>บาท/ชม.</span></div>
        <div class="lbl" style="margin-top:16px">มูลค่าหม้อแปลง (ทรัพย์สิน)</div>
        <div class="inp"><input type="number" id="sAsset" value="${P.asset}" min="0" step="1000000" style="font-size:16px;padding-right:50px"><span>บาท</span></div>
      </div>
      <div id="sRes"></div>
    </div></div>`;
  paintSlideRes(B);
  let raf = 0;
  const live = () => { if(raf) return; raf = requestAnimationFrame(() => { raf = 0; paintSlideRes(B); }); };
  const num = (k, v) => { const x = parseFloat(v); if(fin(x) && x > 0){ P[k] = x; const sl = $(k); sl.value = Math.min(Math.max(x, +sl.min), +sl.max); live(); } };
  $('sMtbf').addEventListener('input', e => { P.sMtbf = +e.target.value; $('sMtbfN').value = P.sMtbf; live(); });
  $('sMttr').addEventListener('input', e => { P.sMttr = +e.target.value; $('sMttrN').value = P.sMttr; live(); });
  $('sMtbfN').addEventListener('input', e => num('sMtbf', e.target.value));
  $('sMttrN').addEventListener('input', e => num('sMttr', e.target.value));
  $('sCost').addEventListener('input', e => { const x = parseFloat(e.target.value); P.cost = fin(x) && x >= 0 ? x : 0; live(); });
  $('sAsset').addEventListener('input', e => { const x = parseFloat(e.target.value); P.asset = fin(x) && x >= 0 ? x : 0; live(); });
}
function paintSlideRes(B){
  const P = S.plan, V = VIEWS[P.sView], el = $('sRes'); if(!el) return;
  const calc = (mtbf, mttr) => { const A = mtbf / (mtbf + mttr) * 100, dt = 8760 * (1 - A / 100); const R = Math.exp(-V.m / mtbf) * 100; return { R, M: (1 - Math.exp(-V.r / mttr)) * 100, A, dt, cost: dt * P.cost, pf: 100 - R, risk: (1 - R / 100) * P.asset }; };
  const a = calc(B.mtbf, B.mttr), b = calc(P.sMtbf, P.sMttr);
  const pc = v => v >= 99.995 && v < 100 ? fmt(v, 3) : fmt(v, 2);
  const row = (lab, col, x, y, f, better) => `<div class="cmp"><span style="color:${col};font-weight:600">${lab}</span><span class="a">${f(x)}</span><span class="b" style="color:${better === undefined || Math.abs(y - x) < 1e-9 ? 'var(--text)' : better ? 'var(--Atx)' : 'var(--bad)'}">${f(y)}</span></div>`;
  el.innerHTML = `<div class="cmp" style="font-size:13px;color:var(--faint)"><span>${V.name} (t = ${V.m.toLocaleString('en-US')} / ${V.r} ชม.)</span><span style="text-align:right">ปัจจุบัน</span><span style="text-align:right">หลังปรับ</span></div>
        ${row('R', 'var(--R)', a.R, b.R, v => fmt(v, 2) + '%', b.R > a.R)}
        ${row('M', 'var(--Mtx)', a.M, b.M, v => pc(v) + '%', b.M > a.M)}
        ${row('A', 'var(--Atx)', a.A, b.A, v => fmt(v, 2) + '%', b.A > a.A)}
        ${row('Downtime ต่อปี', 'var(--text)', a.dt, b.dt, v => fmt(v, 1) + ' ชม.', b.dt < a.dt)}
        ${row('ค่าเสียหายต่อปี', 'var(--text)', a.cost, b.cost, v => '฿' + fmt(v, 0), b.cost < a.cost)}
        <div class="lbl" style="margin-top:14px">ความเสี่ยงต่อทรัพย์สิน (${V.name})</div>
        ${row('โอกาสเสีย (1 − R)', 'var(--bad)', a.pf, b.pf, v => fmt(v, 2) + '%', b.pf < a.pf)}
        ${row('ความเสี่ยงต่อทรัพย์สิน', 'var(--text)', a.risk, b.risk, v => '฿' + fmt(v, 0), b.risk < a.risk)}
        <div class="note" style="margin-top:6px">ความเสี่ยงต่อทรัพย์สิน = โอกาสเสีย (1 − R) × มูลค่าหม้อแปลง · ${Math.abs(a.risk - b.risk) < 0.5 ? 'ยังไม่ได้ปรับค่า' : b.risk < a.risk ? `<b style="color:var(--Atx)">ความเสี่ยงลดลง ฿${fmt(a.risk - b.risk, 0)}</b>` : `<b style="color:var(--bad)">ความเสี่ยงเพิ่มขึ้น ฿${fmt(b.risk - a.risk, 0)}</b>`}</div>
        <div class="note" style="margin-top:8px">Downtime ต่อปี = 8,760 × (1 − A/100) · λ = 1/MTBF = ${fmt(1 / P.sMtbf, 5)} ครั้ง/ชม. · μ = 1/MTTR = ${fmt(1 / P.sMttr, 3)} ครั้ง/ชม.</div>`;
}
document.addEventListener('click', e => {
  if(S.page !== 'plan') return;
  const P = S.plan, t = e.target.closest('[data-pmode],[data-pview],[data-pfix],[data-sview]'); if(!t) return;
  if(t.dataset.pmode){ P.mode = t.dataset.pmode; renderPlan(); }
  else if(t.dataset.pview){ P.view = t.dataset.pview; P.vals = { R:'', M:'', A:'' }; P.user = { R:false, M:false, A:false }; renderPlan(); }
  else if(t.dataset.pfix){ P.fix = t.dataset.pfix; P.fixVal = ''; renderPlan(); }
  else if(t.dataset.sview){ P.sView = t.dataset.sview; paintPlan(); }
});

function renderRank(){
  const el = $('page-rank');
  destroyChart('trend');
  if(!MODEL || !MODEL.events.length){ el.innerHTML = `<h1>${ic('trend')}จัดอันดับ &amp; แนวโน้ม</h1>${emptyState()}`; return; }
  if(!scoped({ sheet:'ALL' }).length){ el.innerHTML = `<h1>${ic('trend')}จัดอันดับ &amp; แนวโน้ม</h1>${ctrlBar()}${noStationData()}`; return; }
  const evs = scoped(), st = stats(evs), thr = SETTINGS.threshold;
  const flag = A => !fin(A) ? `<span class="badge mute">ข้อมูลไม่พอ</span>` : A < thr ? `<span class="badge bad">${ic('alert')}ต่ำกว่าเกณฑ์</span>` : `<span class="badge ok">ผ่าน</span>`;
  const nMon = new Set(evs.map(e => e.ym)).size, nQ = new Set(evs.map(e => e.yq)).size;
  const gran = nMon <= 36 ? 'ym' : nQ <= 40 ? 'yq' : 'yy';
  const granName = { ym:'รายเดือน', yq:'รายไตรมาส', yy:'รายปี' }[gran], granUnit = { ym:'เดือน', yq:'ไตรมาส', yy:'ปี' }[gran];
  const glabel = k => gran === 'ym' ? monLabel(k) : gran === 'yq' ? qLabel(k) : 'พ.ศ. ' + (+k + 543);
  const cnt = {}; evs.forEach(e => { cnt[e[gran]] = (cnt[e[gran]] || 0) + 1; });
  const keys = Object.keys(cnt).sort(), avg = keys.length ? evs.length / keys.length : 0;
  const peak = keys.reduce((m, k) => cnt[k] > (cnt[m] || -1) ? k : m, keys[0]);
  const below = st.units.filter(u => fin(u.A) && u.A < thr).length;
  const top = paretoData(evs, 'comp')[0];
  const maxN = st.units.length ? st.units[0].n : 1;
  el.innerHTML = `
  <h1>${ic('trend')}จัดอันดับ &amp; แนวโน้ม</h1>
  ${ctrlBar()}
  <div class="grid g4 stat-row">
    ${qkBox('จำนวนเหตุ', evs.length.toLocaleString('en-US'), `${st.nUnits} ลูก · ${keys.length} ${granUnit}`)}
    ${qkBox(`เหตุเฉลี่ยต่อ${granUnit}`, fmt(avg, 1), peak ? `สูงสุด ${glabel(peak)} · ${cnt[peak]} เหตุ` : '')}
    ${qkBox('หม้อแปลงที่ A ต่ำกว่าเกณฑ์', `<span style="color:${below ? 'var(--bad)' : 'var(--Atx)'}">${below}</span> <small style="font-size:14px;color:var(--soft)">/ ${st.nUnits} ลูก</small>`, `เกณฑ์ A ≥ ${thr}%`)}
    ${qkBox('ปัญหาอันดับ 1', top ? esc(top.k) : '–', top ? `${top.n} เหตุ · ${fmt(top.pct, 1)}% ของทั้งหมด` : '')}
  </div>
  <div class="card"><h3>${ic('alert', 'color:var(--M)')}ดูแลก่อน · 3 อันดับที่เกิดเหตุบ่อยที่สุด ${info('care')}</h3>
    <div class="grid g3" style="margin-top:12px">${st.units.slice(0, 3).map((u, i) => `<div class="care" role="button" tabindex="0" style="cursor:pointer" data-unit="${esc(u.key)}"><span class="no">${i + 1}</span><span><b style="font-size:17px">${esc(u.unit)}</b> <span style="color:var(--faint)">· ${esc(stnName(u.stn))}</span><span style="display:block;font-size:13.5px;color:var(--soft)">${u.n} เหตุ · MTBF ${fin(u.mtbf) ? fmt(u.mtbf, 1) + ' ชม.' : dash(unitWhy(u.unit, u.n, u.gaps.length))} · A ${fin(u.A) ? fmt(u.A, 2) + '%' : dash(unitWhy(u.unit, u.n, u.gaps.length, 'A'))}</span></span></div>`).join('')}</div></div>
  <div class="grid layout-2" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch">
    <div class="card" id="paretoCard"></div>
    <div class="card" style="display:flex;flex-direction:column"><h3>แนวโน้มจำนวนเหตุ · ${granName} ${info('trend')}</h3>

function paretoData(evs, by){
  const keyf = PARETO_BY[by][1], o = {};
  evs.forEach(e => { const k = keyf(e); (o[k] = o[k] || []).push(e); });
  let arr = Object.entries(o).map(([k, list]) => ({ k, n: list.length, list })).sort((a, b) => b.n - a.n || a.k.localeCompare(b.k));
  const MAX = 12;
  if(arr.length > MAX){ const rest = arr.slice(MAX - 1); arr = arr.slice(0, MAX - 1).concat([{ k: `อื่น ๆ (${rest.length} รายการ)`, n: rest.reduce((t, r) => t + r.n, 0), list: rest.flatMap(r => r.list), other: true }]); }
  const T = evs.length; let cum = 0;
  arr.forEach(a => { a.before = cum / T * 100; cum += a.n; a.cum = cum / T * 100; a.pct = a.n / T * 100; a.vital = a.before < 80 && !a.other; });
  return arr;
}

const PY_CODE = document.getElementById('pyCode').textContent.replace(/^\n/, '');
function jsValues(){
  const evs = MODEL.events, t = stats(evs);
  const topCode = key => { const o = {}; evs.forEach(e => { const k = String(e[key] || '').trim() || 'ไม่ระบุ'; o[k] = (o[k] || 0) + 1; }); const a = Object.entries(o).sort((x, y) => y[1] - x[1] || (x[0] < y[0] ? -1 : 1))[0]; return a ? a[0] + ' ' + a[1] : '– 0'; };
  const stn = {}; [...new Set(evs.map(e => e.stn))].sort().forEach(c => { const x = stats(evs.filter(e => e.stn === c)); stn[c] = { n: x.n, A: x.A, mtbf: x.mtbfH / 24 }; });
  return { n: t.n, units: t.nUnits, mtbf: t.mtbfH / 24, pooled: t.pooledH / 24, mttr: t.mttrH, A: t.A, topProb: topCode('comp'), topCause: topCode('cause'),
    p1: evs.filter(e => +e.prio === 1).length, zero: t.nQ, stn };
}
function loadScript(src){ return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('load failed')); document.head.appendChild(s); }); }
let pyodideP = null;
async function runPython(){
  S.py = { status:'loading', result:null, err:'' }; renderPy();
  try{
    if(!pyodideP) pyodideP = (async () => { if(typeof loadPyodide === 'undefined') await loadScript(PYODIDE_URL + 'pyodide.js'); return await loadPyodide({ indexURL: PYODIDE_URL }); })();
    const py = await pyodideP.catch(e => { pyodideP = null; throw e; });
    py.globals.set('RAW_JSON', JSON.stringify(DATA.rows));
    const res = JSON.parse(py.runPython(PY_CODE));
    S.py = { status:'done', result: res, err:'' };
    audit('รันตรวจสอบด้วย Python', '');
  }catch(e){
    S.py = { status:'error', result:null, err: String(e && e.message || e) };
  }
  if(S.page === 'py') renderPy();
}

function requireAdmin(){ if(!S.admin){ openLogin(); return false; } return true; }
$('uploadBtn').onclick = () => { if(requireAdmin()) $('fileInput').click(); };
$('fileInput').addEventListener('change', e => {
  const file = e.target.files[0]; e.target.value = ''; if(!file) return;
  if(typeof XLSX === 'undefined'){ alert('โหลดไลบรารีอ่าน Excel ไม่ได้ (ต้องใช้อินเทอร์เน็ตในการเปิดเว็บครั้งแรก)'); return; }
  const rd = new FileReader();
  rd.onload = ev => {
    try{
      const wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
      const sheets = wb.SheetNames.map(n => ({ name:n, rows: sheetRows(wb, n), cols: sheetCols(wb, n) })).filter(s => s.rows.length);
      if(!sheets.length){ alert('ไม่พบแถวข้อมูลที่มีคอลัมน์ Service Request / Summary / สถานที่ติดตั้ง ในไฟล์นี้'); return; }
      if(sheets.length === 1) ingest(sheets, sheets.map(s => s.name), file.name);
      else openSheetPicker(sheets, file.name);
    }catch(err){ alert('อ่านไฟล์ไม่ได้: ' + err.message); }
  };
  rd.readAsArrayBuffer(file);
});
function openSheetPicker(sheets, fname){

function ingest(sheets, names, fname){
  const all = []; sheets.filter(s => names.includes(s.name)).forEach(s => all.push(...s.rows));
  const rows = all.filter(r => !isPM(r)), pmDropped = all.length - rows.length;   // ตัดงาน PM ออกตั้งแต่ตอนอัปโหลด
  DATA = { rows, source: fname, uploadedAt: Date.now(), pmDropped };
  S.sheet = 'ALL'; S.home.open.clear(); S.py = { status:'idle', result:null, err:'' };
  audit('อัปโหลดไฟล์ Excel', `${fname} · ${names.length} ชีต · ${all.length} แถว (ตัด PM ${pmDropped})`);
  markDirty(); rebuild();
  showImportReport(sheets.filter(s => names.includes(s.name)), fname, all.length, pmDropped);

function showImportReport(sheets, fname, nRead, pmDropped){

  const show = v => v === '' || v == null ? '(ว่าง)' : typeof v === 'number' && v > 20000 ? fmtDT(toMs(v)) : v;

      ${droppedAll ? '<b>ไม่มีแถวที่ใช้คำนวณได้เลย</b> ดูสาเหตุด้านล่าง' : `ใช้คำนวณได้ <b>งานซ่อม [CM] ${used} เหตุ · หม้อแปลง ${units} ลูก</b>`}</div>
    <dl class="kv"><dt>ไฟล์</dt><dd>${esc(fname)} · ${sheets.length} ชีต</dd><dt>แถวที่อ่านได้</dt><dd>${nRead} แถว</dd>
      <dt>งาน [PM] ที่ตัดออก</dt><dd>${pmDropped} แถว <span class="note">(บำรุงรักษาตามแผน ไม่นำมาคำนวณ R/A/M)</span></dd>
      <dt>งาน [CM]</dt><dd>${m.rawCount} แถว (ซ้ำ ${m.dupes} → เหลือ ${m.uniqCount})</dd>
      <dt>ช่วงข้อมูล</dt><dd>${m.sheets.length ? `${yLabel(m.sheets[0])} – ${yLabel(m.sheets[m.sheets.length - 1])} (${m.sheets.length} ปี)` : '–'}</dd></dl>
    ${need.length ? `<div class="errbox">ไม่พบคอลัมน์: ${need.map(([c, n]) => `<b>${FIELD_NAME[c]}</b> (${n})`).join(', ')}<br>ชื่อคอลัมน์ต้องตรงกับไฟล์ตัวอย่าง (Service Request, Summary, สถานที่ติดตั้ง, Actual Start, Actual Finish, …) และอยู่ใน 15 แถวแรกของชีต</div>` : ''}
    ${reasons.length ? `<div class="lbl" style="margin-top:4px">แถวที่ตัดออก ${reasons.reduce((s, [k]) => s + m.ex[k], 0)} แถว</div>
      <div class="tbl-wrap"><table><thead><tr><th>สาเหตุ</th><th class="n">แถว</th><th>ตัวอย่าง (SR · เริ่ม → เสร็จ)</th></tr></thead><tbody>
      ${reasons.map(([k, n]) => `<tr><td>${n}</td><td class="n">${m.ex[k]}</td><td class="mono" style="font-size:12px">${m.exSample[k].map(sample).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : ''}
    ${m.ex.zero ? `<div class="warnbox"><b>เก็บไว้ ${m.ex.zero} แถว</b> ที่ Actual Start = Actual Finish (ไม่ตัดทิ้ง) นับเป็นซ่อม 0 นาที และติดธง "เริ่ม = เสร็จ" ให้เห็นในหน้าหลัก<div class="mono" style="font-size:12px;margin-top:6px">${m.exSample.zero.map(sample).join('<br>')}</div></div>` : ''}
    <div class="note">ข้อมูลยังไม่ถูกบันทึก กด "บันทึกการเปลี่ยนแปลง" ด้านบนเพื่อเก็บไว้ในเบราว์เซอร์นี้</div>`,
    `<button class="btn pri" data-close>ตกลง</button>`, true);

$('exportExcelBtn').onclick = () => {

  const evs = scoped(), t = stats(evs), num = (v, d) => fin(v) ? +v.toFixed(d) : '';
  const sum = [['RAM Insight · สรุปผลหม้อแปลง (งาน CM)'], [scope], [], ['ตัวชี้วัด', 'ค่า'],
    ['จำนวนเหตุ', t.n], ['จำนวนหม้อแปลง', t.nUnits], ['MTBF เฉลี่ย (ชม.)', num(t.mtbfH, 2)], ['MTBF เฉลี่ย (วัน)', num(t.mtbfH / 24, 2)],
    ['MTTR เฉลี่ย (ชม.)', num(t.mttrH, 2)], ['Availability เฉลี่ย (%)', num(t.A, 2)], ['เกณฑ์ A (%)', SETTINGS.threshold], ['เหตุที่เวลาเริ่ม = เสร็จ', t.nQ],
    [], ['ชนิดปัญหา', 'จำนวนเหตุ']].concat(t.comp.map(([k, v]) => [k, v])).concat([[], ['สาเหตุ', 'จำนวนเหตุ']]).concat(t.cause.map(([k, v]) => [k, v]));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sum), 'สรุป');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(t.units.map((u, i) => ({ อันดับ: i + 1, หม้อแปลง: u.unit, สถานี: u.stn, จำนวนเหตุ: u.n, 'MTBF (ชม.)': num(u.mtbf, 2), 'MTTR (ชม.)': num(u.mttr, 2), 'A (%)': num(u.A, 3), สถานะ: !fin(u.A) ? 'ข้อมูลไม่พอ' : u.A < SETTINGS.threshold ? 'ต่ำกว่าเกณฑ์' : 'ผ่านเกณฑ์' }))), 'หม้อแปลง');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(evs.map(e => ({ 'Service Request': e.sr, หม้อแปลง: e.unit, สถานี: e.stn, เริ่มซ่อม: fmtDT(e.from), ซ่อมเสร็จ: fmtDT(e.to), 'ซ่อม (ชม.)': +e.dur.toFixed(3),
    'Problem Code': e.comp, ปัญหา: compLabel(e.comp), Cause: e.cause, สาเหตุ: causeLabel(e.cause), Priority: e.prio, 'เริ่ม = เสร็จ': e.q ? 'ใช่' : '', Summary: e.raw.summary }))), 'รายการเหตุ');
  XLSX.writeFile(wb, `RAM_Insight_Transformer_${new Date().toISOString().slice(0, 10)}.xlsx`);
  audit('Export Excel', scope);
};
function renderReport(){
  const el = $('page-report'), thr = SETTINGS.threshold;
  const fe = scoped(), f = stats(fe);
  const stnRows = stationCodes().filter(c => S.stn === 'ALL' || c === S.stn).map(c => [c, stats(fe.filter(e => e.stn === c))]).filter(([, x]) => x.n);
  const kv = (lab, ...vals) => `<tr><td>${lab}</td>${vals.map(v => `<td class="n">${v}</td>`).join('')}</tr>`;
  const aTxt = st => fin(st.A) ? `${fmt(st.A, 2)}% ${st.A >= thr ? '✓' : '✗'}` : '–';
  const care = f.units.slice(0, 6), par = paretoData(fe, 'comp').slice(0, 7), cau = paretoData(fe, 'cause').slice(0, 5);
  const range = fe.length ? `${monLabel(fe[0].ym)} – ${monLabel(fe[fe.length - 1].ym)}` : '–';
  const cols = [['รวม', f]].concat(stnRows.length > 1 ? stnRows.map(([c, x]) => [stnName(c), x]) : []);
  el.innerHTML = `<div class="rep">
    <div class="rep-head"><img src="${document.querySelector('.logo img').src}" alt=""><div><div class="rep-t">รายงานสรุปความน่าเชื่อถือ ความพร้อมใช้งาน และการซ่อมบำรุงหม้อแปลง (R/A/M)</div>
      <div class="rep-s">สถานี: ${esc(S.stn === 'ALL' ? stationCodes().map(stnName).join(', ') : stnName(S.stn))} · ${esc(S.sheet === 'ALL' ? 'ทุกปี' : yLabel(S.sheet))} (${range}) · งานซ่อม [CM] · เกณฑ์ A ≥ ${thr}% · พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}</div></div></div>
    <div class="rep-grid">
      <div><div class="rep-h">1. ตัวชี้วัดหลัก</div><table class="rep-tb"><thead><tr><th></th>${cols.map(([n]) => `<th class="n">${esc(n)}</th>`).join('')}</tr></thead><tbody>
        ${kv('จำนวนเหตุ', ...cols.map(([, x]) => x.n))}${kv('จำนวนหม้อแปลง', ...cols.map(([, x]) => x.nUnits))}${kv('MTBF เฉลี่ย', ...cols.map(([, x]) => fin(x.mtbfH) ? fmt(x.mtbfH / 24, 1) + ' วัน' : '–'))}
        ${kv('MTTR เฉลี่ย', ...cols.map(([, x]) => fmt(x.mttrH, 2) + ' ชม.'))}${kv('Availability เฉลี่ย', ...cols.map(([, x]) => aTxt(x)))}
        ${kv('Priority 1', ...cols.map(([n, x]) => (n === 'รวม' ? fe : fe.filter(e => stnName(e.stn) === n)).filter(e => +e.prio === 1).length))}</tbody></table></div>
      <div><div class="rep-h">2. หม้อแปลงที่ควรดูแลก่อน (เหตุมากที่สุด)</div><table class="rep-tb"><thead><tr><th>หม้อแปลง</th><th class="n">เหตุ</th><th class="n">MTBF (ชม.)</th><th class="n">MTTR (ชม.)</th><th class="n">A (%)</th></tr></thead><tbody>
        ${care.map(u => `<tr><td><b>${esc(u.unit)}</b></td><td class="n">${u.n}</td><td class="n">${fmt(u.mtbf, 1)}</td><td class="n">${fmt(u.mttr, 2)}</td><td class="n">${fmt(u.A, 2)}${fin(u.A) && u.A < thr ? ' ✗' : ''}</td></tr>`).join('')}</tbody></table></div>
      <div><div class="rep-h">3. Pareto ชนิดปัญหา</div><table class="rep-tb"><thead><tr><th>ปัญหา</th><th class="n">เหตุ</th><th class="n">ซ่อมเฉลี่ย (ชม.)</th><th class="n">% สะสม</th></tr></thead><tbody>
        ${par.map(a => `<tr${a.vital ? ' style="font-weight:600"' : ''}><td>${esc(a.k)}</td><td class="n">${a.n}</td><td class="n">${fmt(mean(a.list.map(e => e.dur)), 1)}</td><td class="n">${fmt(a.cum, 1)}</td></tr>`).join('')}</tbody></table>
        <div class="rep-n">ตัวหนา = กลุ่มที่ทำให้เกิดเหตุรวมกันประมาณ 80% ควรแก้ก่อน</div></div>
      <div><div class="rep-h">4. สาเหตุที่พบบ่อย</div><table class="rep-tb"><thead><tr><th>สาเหตุ</th><th class="n">เหตุ</th><th class="n">% สะสม</th></tr></thead><tbody>
        ${cau.map(a => `<tr><td>${esc(a.k)}</td><td class="n">${a.n}</td><td class="n">${fmt(a.cum, 1)}</td></tr>`).join('')}</tbody></table>
        <div class="rep-h" style="margin-top:8px">5. คุณภาพการกรอกข้อมูล</div>
        <div class="rep-n" style="font-size:10.5px;color:#14213d">${f.nQ ? `มี <b>${f.nQ}</b> เหตุ (${fmt(f.nQ / f.n * 100, 1)}%) ที่ Actual Start = Actual Finish (ยังไม่ได้กรอกเวลาซ่อมจริง) ทำให้ MTTR ต่ำและ A สูงกว่าความจริง` : 'ทุกเหตุกรอกเวลาเริ่มซ่อมและเวลาซ่อมเสร็จครบ'}</div></div>
    </div>
    <div class="rep-foot">นิยาม: ใช้เฉพาะงานซ่อมเมื่อเสีย [CM] (ตัดงาน PM) · MTBF = ค่าเฉลี่ยช่วงห่างระหว่างเหตุของหม้อแปลงลูกเดียวกัน · MTTR = ค่าเฉลี่ยเวลาซ่อม (Actual Start → Actual Finish) · A = MTBF ÷ (MTBF + MTTR) × 100 · ✓/✗ = ผ่าน/ไม่ผ่านเกณฑ์ A ≥ ${thr}% · จัดทำโดยระบบ RAM Insight</div>
  </div>`;
}
function doPrint(which){
  closeModal();
  document.body.classList.toggle('print-report', which === 'report');
  if(which === 'report') renderReport();
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('print-on', p.id === (which === 'report' ? 'page-report' : 'page-' + S.page)));
  $('printMeta').textContent = `${$('crumb').textContent} · หม้อแปลง · สถานี: ${S.stn === 'ALL' ? 'ทุกสถานี' : stnName(S.stn)} · ${S.sheet === 'ALL' ? 'ทุกปี' : yLabel(S.sheet)} · พิมพ์เมื่อ ${new Date().toLocaleString('th-TH')}`;
  audit('Export PDF', which === 'report' ? 'รายงานสรุป 1 หน้า' : S.page);
  setTimeout(() => window.print(), 80);
}
$('exportPdfBtn').onclick = () => {
  if(!MODEL || !MODEL.events.length){ alert('ยังไม่มีข้อมูล'); return; }
  openModal('Export PDF', `<div class="sub">ในหน้าต่างพิมพ์ เลือก "บันทึกเป็น PDF" (Save as PDF)</div>
    <button class="care" data-print="report" style="cursor:pointer"><span class="no">${ic('file')}</span><span><b>รายงานสรุป 1 หน้า (A4)</b><span style="display:block;font-size:13.5px;color:var(--soft)">ตัวชี้วัดหลักของหม้อแปลง · ลูกที่ควรดูแลก่อน · Pareto ชนิดปัญหา · สาเหตุ · คุณภาพการกรอกข้อมูล (ตามสถานีและปีที่เลือก)</span></span></button>
    <button class="care" data-print="page" style="cursor:pointer"><span class="no">${ic('list')}</span><span><b>พิมพ์หน้าที่เปิดอยู่</b><span style="display:block;font-size:13.5px;color:var(--soft)">${esc(TITLES[S.page])} ตามที่เห็นบนจอ</span></span></button>`);
};
document.addEventListener('click', e => { const b = e.target.closest('[data-print]'); if(b) doPrint(b.dataset.print); });

/* =====================================================================
   CHROME + ROUTING
   ===================================================================== */
const TITLES = { home:'หน้าหลัก', plan:'วางแผนเป้าหมาย R/A/M', ov:'ภาพรวมหม้อแปลง', rank:'จัดอันดับ & แนวโน้ม', py:'ตรวจสอบด้วย Python' };
function paintChrome(){
  document.querySelectorAll('.admin-only').forEach(x => x.hidden = !S.admin);
  $('loginBtn').hidden = !!S.admin;
  $('adminName').textContent = S.admin ? 'แอดมิน: ' + S.admin : '';
  $('dirtyDot').hidden = !S.dirty; $('saveBtn').disabled = !S.dirty;
  document.querySelectorAll('.nav').forEach(n => { n.classList.toggle('on', n.dataset.page === S.page); n.hidden = !menuOn(n.dataset.page); });
  $('crumb').textContent = 'RAM Insight  /  ' + TITLES[S.page];
  const has = MODEL && MODEL.events.length;
  $('exportExcelBtn').disabled = $('exportPdfBtn').disabled = !has;
  // stations
  const evs = MODEL ? MODEL.events : [];
  const codes = stationCodes();
  const cnt = c => { const u = new Set(); let n = 0; evs.forEach(e => { if(c === 'ALL' || e.stn === c){ u.add(e.stn + e.unit); n++; } }); return `${u.size} หม้อแปลง · ${n} เหตุ`; };
  if(S.stn !== 'ALL' && !codes.includes(S.stn)) S.stn = 'ALL';
  $('stationList').innerHTML = `<button class="stn ${S.stn === 'ALL' ? 'on' : ''}" data-stn="ALL">${ic('grid')}<span><span class="t">${codes.length ? 'ทั้ง ' + codes.length + ' สถานี' : 'ทุกสถานี'}</span><span class="s">${cnt('ALL')}</span></span></button>` +
    codes.map(c => `<button class="stn ${S.stn === c ? 'on' : ''}" data-stn="${esc(c)}">${ic('zap')}<span><span class="t">${esc(stnName(c))} (${esc(c)})</span><span class="s">${cnt(c)}</span></span></button>`).join('');
  const pill = $('dataPill');
  if(has){ const n = MODEL.events.length, y = MODEL.sheets; pill.className = 'pill ok'; pill.innerHTML = `<i></i><span>โหลดข้อมูลแล้ว ${n} รายการ (CM)<br>${yLabel(y[0])}${y.length > 1 ? ' – ' + yLabel(y[y.length - 1]).slice(3) : ''}${DATA.pmDropped ? `<span style="display:block;font-size:12.5px;opacity:.8">ตัดงาน PM ${DATA.pmDropped} รายการ</span>` : ''}</span>`; }
  else { pill.className = 'pill'; pill.innerHTML = '<i></i><span>ยังไม่มีข้อมูล</span>'; }
}
function renderPage(){
  if(!menuOn(S.page)){ S.page = 'home'; try{ history.replaceState(null, '', '#home'); }catch(_){} }
  document.querySelectorAll('.page').forEach(p => { p.hidden = p.id !== 'page-' + S.page; if(p.hidden) p.innerHTML = ''; });
  if(S.page !== 'rank') destroyChart('trend'); if(S.page !== 'py') destroyChart('lowA');
  ({ home: renderHome, plan: renderPlan, ov: renderOverview, rank: renderRank, py: renderPy })[S.page]();
  paintChrome();
}
function rebuild(){ MODEL = buildModel(DATA.rows || []); renderPage(); }
document.addEventListener('click', e => {
  const n = e.target.closest('.nav[data-page]');
  if(n){ S.page = n.dataset.page; document.body.classList.remove('nav-open'); renderPage(); window.scrollTo(0, 0); try{ history.replaceState(null, '', '#' + S.page); }catch(_){} return; }
  const s = e.target.closest('[data-stn]');
  if(s){ S.stn = s.dataset.stn; S.home.open.clear(); S.home.unit = ''; S.plan.unit = ''; S.plan.sMtbf = S.plan.sMttr = null; document.body.classList.remove('nav-open'); renderPage(); return; }
  const a = e.target.closest('[data-act]');
  if(a){ if(a.dataset.act === 'upload') $('uploadBtn').click(); else openLogin(); }
});
document.addEventListener('change', e => {
  if(e.target.matches('[data-sheetsel]')){ S.sheet = e.target.value; S.home.open.clear(); S.plan.sMtbf = S.plan.sMttr = null; renderPage(); }
});
$('menuBtn').onclick = () => document.body.classList.toggle('nav-open');
$('scrim').onclick = () => document.body.classList.remove('nav-open');
window.addEventListener('afterprint', () => document.querySelectorAll('.page').forEach(p => p.classList.remove('print-on')));

/* ---------------- boot ---------------- */
(function boot(){
  const who = sess.get(); if(who && admins().some(a => a.name === who)) S.admin = who;
  const h = (location.hash || '').slice(1); if(TITLES[h]) S.page = h;
  rebuild();
})();

</script>
</body>
